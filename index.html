.sortbtn{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.sortbtn.on{color:var(--text)}
.ptable td.sorted{background:color-mix(in srgb,var(--accent) 7%,var(--surface));font-weight:700}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <label class="brand"><span class="dot"></span><span class="visually-hidden">Teams</span>
    <select id="view" aria-label="Choose teams"></select></label>
  <span class="spacer"></span>
  <span class="updated" id="updated"></span>
  <button class="iconbtn" id="refresh" title="Refresh now" aria-label="Refresh now">↻</button>
</div></header>
<main class="wrap" id="app"><div class="loading">Loading…</div></main>

<script>
/* ---------- Config: your teams ---------- */
// Each view is a set of teams. Cleveland is the default; open ?view=bayarea (or the bayarea/ folder) for the other one.
// news:true shows the news feed collected by scripts/news.mjs (its TEAMS list must include the view's team keys).
const VIEWS = {
  cleveland: { name:'Cleveland Sports', short:'CLE Sports', local:'Cleveland-area', icon:'icon-180.png', news:true, teams:[
    { key:'cavs',      label:'Cavaliers', league:'nba', sport:'basketball', abbr:'cle', id:'5', color:'var(--cavs)' },
    { key:'browns',    label:'Browns',    league:'nfl', sport:'football',   abbr:'cle', id:'5', color:'var(--browns)' },
    { key:'guardians', label:'Guardians', league:'mlb', sport:'baseball',   abbr:'cle', id:'5', color:'var(--guardians)' },
  ]},
  bayarea: { name:'Bay Area Sports', short:'Bay Sports', local:'Bay Area', icon:'icon-bayarea-180.png', news:true, teams:[
    { key:'warriors',  label:'Warriors',  league:'nba', sport:'basketball', abbr:'gs',  id:'9',  color:'var(--warriors)' },
    { key:'niners',    label:'49ers',     league:'nfl', sport:'football',   abbr:'sf',  id:'25', color:'var(--niners)' },
    { key:'giants',    label:'Giants',    league:'mlb', sport:'baseball',   abbr:'sf',  id:'26', color:'var(--giants)' },
    { key:'sharks',    label:'Sharks',    league:'nhl', sport:'hockey',     abbr:'sj',  id:'18', color:'var(--sharks)' },
    { key:'athletics', label:'Athletics', league:'mlb', sport:'baseball',   abbr:'ath', id:'11', color:'var(--athletics)' },
    { key:'raiders',   label:'Raiders',   league:'nfl', sport:'football',   abbr:'lv',  id:'13', color:'var(--raiders)' },
  ]},
};
const VIEW_KEY = Object.hasOwn(VIEWS, new URLSearchParams(location.search).get('view')) ? new URLSearchParams(location.search).get('view') : 'cleveland';
const VIEW = VIEWS[VIEW_KEY];
const TEAMS = VIEW.teams;
// The page's title, header and home-screen name/icon follow the view.
document.title = VIEW.name;
// Header title is a selector; choosing another view reloads the page with ?view=… (Cleveland is the plain address).
(() => {
  const sel = document.getElementById('view');
  sel.innerHTML = Object.entries(VIEWS).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('');
  sel.value = VIEW_KEY;
  sel.onchange = () => { location.href = `${location.pathname}${sel.value === 'cleveland' ? '' : `?view=${sel.value}`}#/`; };
})();
document.querySelector('.brand .dot').style.background = `linear-gradient(135deg,${TEAMS.map(t => t.color).join(',')})`;
document.querySelector('meta[name="apple-mobile-web-app-title"]').content = VIEW.short;
document.querySelectorAll('link[rel="apple-touch-icon"],link[rel="icon"]').forEach(l => l.href = VIEW.icon);
const API = 'https://site.api.espn.com/apis/site/v2/sports';
const SPORT = { nba:'basketball', nfl:'football', mlb:'baseball', nhl:'hockey' };
const H = 3600e3;

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => (typeof u === 'string' && u.startsWith('https://')) ? u : '';
const img = (u, cls='logo', alt='') => safeUrl(u) ? `<img class="${cls}" src="${esc(safeUrl(u))}" alt="${esc(alt)}" loading="lazy">` : `<span class="${cls}"></span>`;
const hexColor = c => /^[0-9a-f]{6}$/i.test(c || '') ? '#' + c : null;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
async function getJSON(url){
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
const fmtTime = d => d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
const fmtDay = d => d.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' });
const sameDay = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const ordinal = n => { const s=['th','st','nd','rd'], v=n%100; return n + (s[(v-20)%10] || s[v] || s[0]); };
const num = v => { const n = parseFloat(String(v).replace('%','')); return isNaN(n) ? null : n; };
const pct = (v, d=1) => v == null || !isFinite(v) ? '–' : (v*100).toFixed(d) + '%';
const teamOf = league => TEAMS.find(t => t.league === league);

let timer = null;
function schedule(fn, ms){ clearTimeout(timer); timer = setTimeout(fn, ms); }
function setUpdated(extra=''){ $('#updated').textContent = `Updated ${fmtTime(new Date())}${extra}`; }

/* ---------- Normalize ESPN events (schedule + scoreboard shapes) ---------- */
function logoOf(tm){ return safeUrl(tm?.logo || tm?.logos?.[0]?.href || ''); }
function scoreOf(s){ return s == null ? null : (typeof s === 'object' ? (s.displayValue ?? s.value) : s); }
function recOf(x){
  const r = x.records || x.record;
  if (Array.isArray(r) && r.length) { const t = r.find(z => z.type === 'total') || r[0]; return t.summary || t.displayValue || ''; }
  return '';
}
function bcOf(c){
  const out = [];
  for (const b of c.broadcasts || []) {
    if (b.media?.shortName) out.push(b.media.shortName);
    else if (Array.isArray(b.names)) out.push(...b.names);
  }
  return [...new Set(out)].join(', ');
}
function side(x){
  if (!x) return { abbr:'TBD', name:'TBD', short:'TBD', logo:'', score:null, winner:false, record:'' };
  return { id:x.team?.id, abbr:x.team?.abbreviation, name:x.team?.displayName, short:x.team?.shortDisplayName || x.team?.name,
           logo:logoOf(x.team), score:scoreOf(x.score), winner:!!x.winner, record:recOf(x) };
}
function norm(e, t){
  const c = e.competitions?.[0] || {};
  const st = (c.status || e.status || {}).type || {};
  const comps = c.competitors || [];
  const g = {
    id:e.id, team:t, league:t.league, date:new Date(e.date), state:st.state || 'pre', completed:!!st.completed,
    detail:st.shortDetail || st.detail || '', home:side(comps.find(x => x.homeAway==='home')),
    away:side(comps.find(x => x.homeAway==='away')), broadcast:bcOf(c), venue:c.venue?.fullName || '',
  };
  g.bay = bayArea(g.league, g.date, bcList(c), g.home, g.away);
  return g;
}

/* ---------- Bay Area TV ---------- */
// Broadcasts with their market ("national" / "home" / "away"), from schedule, scoreboard or summary shapes.
function bcList(c){
  const out = [];
  for (const b of c.broadcasts || []) {
    const market = String((typeof b.market === 'string' ? b.market : b.market?.type) || '').toLowerCase();
    const names = b.media?.shortName ? [b.media.shortName] : (Array.isArray(b.names) ? b.names : []);
    for (const n of names) if (n) out.push({ name:String(n).trim(), market });
  }
  return out;
}
const BAY = {
  ota: { ABC:'KGO 7', CBS:'KPIX 5', NBC:'KNTV 11', FOX:'KTVU 2' },
  // Bay Area teams: when one is the opponent, its own broadcast airs here.
  teams: { nba:{ GS:'NBC Sports Bay Area' }, mlb:{ SF:'NBC Sports Bay Area', ATH:'NBC Sports California', OAK:'NBC Sports California' }, nfl:{ SF:'' }, nhl:{ SJ:'NBC Sports Bay Area' } },
  cable: /^(ESPN|ESPN2|ESPNU|ESPNEWS|ABC\/ESPN|TNT|TBS|truTV|FS1|FS2|NFL Net(work)?|NFLN|NBA TV|MLB Net(work)?|MLBN|NHL Net(work)?|NHLN|NBCSN|USA Net(work)?)$/i,
  stream: /prime|peacock|netflix|apple tv|espn\+|espn unl|youtube|^max$|paramount|nbc sports app|amazon/i,
  packages: /mlb\.tv|league pass|sunday ticket|nfl\+/i,      // out-of-market packages, not Bay Area TV
  alias: { 'NBC Sports BA':'NBC Sports Bay Area', 'NBCS-BA':'NBC Sports Bay Area', 'NBCS-CA':'NBC Sports California' }, // ESPN's short names
  outOfMarket: { nba:'NBA League Pass', mlb:'MLB.TV', nfl:'NFL Sunday Ticket', nhl:'ESPN+' },
};
// NHL games listed nationally on ESPN+ are its out-of-market package (blacked out in the home teams' markets), not national TV.
const isPackage = (league, name) => BAY.packages.test(name) || (league === 'nhl' && /^espn\s?\+$/i.test(name));
function etParts(d){
  const parts = new Intl.DateTimeFormat('en-US', { timeZone:'America/New_York', weekday:'short', hour:'numeric', hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(d);
  return Object.fromEntries(parts.map(p => [p.type, p.value]));
}
function bayArea(league, date, bcs, home, away){
  const teams = BAY.teams[league] || {};
  const baySide = home && home.abbr in teams ? 'home' : away && away.abbr in teams ? 'away' : null;
  const bayTeam = baySide === 'home' ? home : baySide === 'away' ? away : null;
  const opts = [];
  for (const b of bcs) {
    if (isPackage(league, b.name)) continue;
    const key = b.name.toUpperCase();
    if (b.market === 'national') {
      if (BAY.ota[key]) {
        const et = etParts(date);
        const regional = (league === 'nfl' && (key === 'CBS' || key === 'FOX') && et.weekday === 'Sun' && Number(et.hour) < 19)
                      || (league === 'mlb' && key === 'FOX');
        if (regional && !baySide) opts.push({ lvl:1, label:`Maybe · ${key} regional`, net:key, regional:true,
          why:`${key}'s Sunday-afternoon games are regional. ${BAY.ota[key]} airs it only if the Bay Area is in this game's coverage map.` });
        else opts.push({ lvl:2, label:`${BAY.ota[key]} · ${key}`, why:'Free over-the-air TV in the Bay Area.' });
      } else if (BAY.stream.test(b.name)) opts.push({ lvl:2, label:b.name, why:'Streams nationally, including the Bay Area.' });
      else if (BAY.cable.test(b.name)) opts.push({ lvl:2, label:b.name, why:'National cable channel, available in the Bay Area.' });
      else opts.push({ lvl:1, label:`Maybe · ${b.name}`, why:`Listed nationally on ${b.name}, which I don't recognize as a Bay Area channel.` });
    } else if (baySide && b.market === baySide) {
      opts.push({ lvl:2, label:BAY.alias[b.name] || b.name, why:`The ${bayTeam.short} broadcast airs in the Bay Area.` });
    }
  }
  if (baySide && !opts.some(o => o.lvl === 2)) {
    const ch = teams[bayTeam.abbr] || (league === 'nfl' ? 'Local TV' : '');
    if (ch) opts.push({ lvl:2, label:ch, why:`The ${bayTeam.short} broadcast airs in the Bay Area.` });
  }
  if (opts.length) return opts.sort((a, b) => b.lvl - a.lvl)[0];
  if (!bcs.some(b => !isPackage(league, b.name))) return null; // TV not announced yet
  return { lvl:0, label:'Not on Bay Area TV', sub:BAY.outOfMarket[league],
    why:`Only on ${teamOf(league) ? VIEW.local : 'the teams\' local'} channels. Out of market, you can stream it on ${BAY.outOfMarket[league]}.` };
}
// For a regional NFL game: if the 49ers are on the same network at the same time, Bay Area TV shows the 49ers.
const sfCache = {};
async function refineBay(games){
  const jobs = games.filter(g => g.bay?.regional && g.league === 'nfl').map(async g => {
    const et = etParts(g.date), ymd = `${et.year}${et.month}${et.day}`;
    try {
      sfCache[ymd] ||= getJSON(`${API}/football/nfl/scoreboard?dates=${ymd}`);
      const sb = await sfCache[ymd];
      const sf = (sb.events || []).find(e => (e.competitions?.[0]?.competitors || []).some(x => x.team?.abbreviation === 'SF'));
      if (!sf || sf.id === g.id) return;
      const sameTime = new Date(sf.date).getTime() === g.date.getTime();
      const sameNet = bcList(sf.competitions[0]).some(b => b.name.toUpperCase() === g.bay.net);
      if (sameTime && sameNet) g.bay = { lvl:0, label:'Not on Bay Area TV', sub:`${BAY.ota[g.bay.net]} has the 49ers`,
        why:`${BAY.ota[g.bay.net]} is showing the 49ers in the same time slot. Stream it on NFL Sunday Ticket.` };
    } catch { delete sfCache[ymd]; }
  });
  await Promise.all(jobs);
}
const TV_ICON = `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 14.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
const TV_OFF = `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 2l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
function bayPill(bay){
  if (!bay) return `<span class="bay none">${TV_ICON}Bay Area TV: not announced</span>`;
  const cls = ['no', 'maybe', 'yes'][bay.lvl];
  const text = bay.lvl === 2 ? `Bay Area TV: ${bay.label}` : bay.lvl === 1 ? `Bay Area TV: ${bay.label}` : `${bay.label}${bay.sub ? ' · ' + bay.sub : ''}`;
  return `<span class="bay ${cls}" title="${esc(bay.why || '')}">${bay.lvl ? TV_ICON : TV_OFF}${esc(text)}</span>`;
}

/* ---------- Home ---------- */
const scoreboardCache = {};
async function leagueScoreboard(t){
  const d = await getJSON(`${API}/${t.sport}/${t.league}/scoreboard`);
  scoreboardCache[t.league] = d;
  return d;
}
async function loadTeam(t){
  const base = `${API}/${t.sport}/${t.league}`;
  const urls = [2, 3].map(st => `${base}/teams/${t.abbr}/schedule?seasontype=${st}`);
  const res = await Promise.allSettled([...urls.map(getJSON), leagueScoreboard(t)]);
  const events = new Map();
  let ok = false;
  res.slice(0, 2).forEach(r => { if (r.status === 'fulfilled') { ok = true; (r.value.events || []).forEach(e => events.set(e.id, norm(e, t))); } });
  const sb = res[2];
  if (sb.status === 'fulfilled') {
    for (const e of sb.value.events || []) {
      const mine = (e.competitions?.[0]?.competitors || []).some(x => (x.team?.abbreviation || '').toLowerCase() === t.abbr);
      if (mine) { ok = true; events.set(e.id, norm(e, t)); }
    }
  }
  if (!ok) throw new Error(`Couldn't load the ${t.label} schedule`);
  return [...events.values()];
}

let homeState = { games:[], errors:[] };
const FILTER_KEY = VIEW_KEY === 'cleveland' ? 'teamFilter' : `teamFilter:${VIEW_KEY}`; // each view remembers its own team filter
async function showHome(){
  document.title = VIEW.name;
  if (!homeState.games.length) $('#app').innerHTML = '<div class="loading">Loading your teams…</div>';
  const res = await Promise.allSettled(TEAMS.map(loadTeam));
  if (currentRoute().name !== 'home') return;
  homeState = { games:res.flatMap(r => r.status==='fulfilled' ? r.value : []), errors:res.flatMap(r => r.status==='rejected' ? [r.reason.message] : []) };
  const soon = Date.now() + 8*24*H;
  await refineBay(homeState.games.filter(g => g.date.getTime() < soon && g.date.getTime() > Date.now() - 2*24*H));
  if (currentRoute().name !== 'home') return;
  renderHome();
  setUpdated();
  const now = Date.now();
  const busy = homeState.games.some(g => g.state === 'in' || (g.state === 'pre' && g.date - now < 30*60e3 && g.date - now > -3*H));
  schedule(showHome, busy ? 30e3 : 5*60e3);
}
function buckets(games, filter){
  const now = new Date(), t = now.getTime();
  const gs = games.filter(g => filter === 'all' || g.team.key === filter);
  const live = gs.filter(g => g.state === 'in').sort((a,b) => a.date-b.date);
  const today = gs.filter(g => g.state !== 'in' && sameDay(g.date, now)).sort((a,b) => a.date-b.date);
  const recent = gs.filter(g => g.state === 'post' && !sameDay(g.date, now) && g.date.getTime() + 3*H >= t - 36*H && g.date.getTime() <= t)
                   .sort((a,b) => b.date-a.date);
  const upcoming = gs.filter(g => g.state === 'pre' && !sameDay(g.date, now) && g.date > now && g.date - now <= 7*24*H).sort((a,b) => a.date-b.date);
  return { live, today, recent, upcoming };
}
function teamRow(s, g){
  const showScore = g.state !== 'pre' && s.score != null;
  const cls = g.state === 'post' && showScore ? (s.winner ? 'win' : 'lose') : '';
  return `<div class="trow ${cls}">${teamLink(g.team.league, { id:s.id, displayName:s.name, abbreviation:s.abbr }, img(s.logo, '', s.abbr), true)}<span class="nm">${esc(s.short || s.name)}<span class="rec">${esc(s.record)}</span></span>${showScore ? `<span class="sc">${esc(s.score)}</span>` : ''}</div>`;
}
function card(g){
  let status;
  if (g.state === 'in') status = `<span class="status-live">${esc(g.detail || 'Live')}</span>`;
  else if (g.state === 'post') status = `<span>${esc(g.detail || 'Final')} · ${esc(fmtDay(g.date))}</span>`;
  else status = `<span>${esc(sameDay(g.date, new Date()) ? 'Today' : fmtDay(g.date))} · ${esc(fmtTime(g.date))}</span>`;
  const foot = [g.broadcast, g.venue].filter(Boolean).join(' · ');
  return `<a class="card" style="--tc:${g.team.color}" href="#/g/${g.team.league}/${esc(g.id)}">
    <div class="meta"><span class="lg">${g.team.league.toUpperCase()}</span>${status}</div>
    ${teamRow(g.away, g)}${teamRow(g.home, g)}
    ${foot ? `<div class="foot">${esc(foot)}</div>` : ''}
    ${bayPill(g.bay)}</a>`;
}
function section(title, list, emptyMsg){
  return `<h2 class="sec">${esc(title)} <span class="count">${list.length || ''}</span></h2>` +
    (list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty">${esc(emptyMsg)}</div>`);
}
function renderHome(){
  const saved = store.get(FILTER_KEY, 'all');
  const filter = TEAMS.some(t => t.key === saved) ? saved : 'all';
  const b = buckets(homeState.games, filter);
  const chips = [{key:'all', label:'All teams'}, ...TEAMS].map(t =>
    `<button class="chip" data-filter="${t.key}" aria-pressed="${filter===t.key}">${t.color ? `<span class="sw" style="background:${t.color}"></span>` : ''}${esc(t.label)}</button>`).join('');
  const logoSrc = (t, dark) => `https://a.espncdn.com/i/teamlogos/${t.league}/${dark ? '500-dark' : '500'}/${t.abbr}.png`;
  const quick = `<nav class="quick" aria-label="Team pages">${TEAMS.map(t => `<a class="qteam" style="--tc:${t.color}" href="#/t/${t.league}/${t.id}">
      <picture><source media="(prefers-color-scheme: dark)" srcset="${logoSrc(t, true)}"><img src="${logoSrc(t, false)}" alt="" width="44" height="44"></picture>
      <span class="qname">${esc(t.label)}</span><span class="qlg">${t.league.toUpperCase()}</span></a>`).join('')}</nav>`;
  $('#app').innerHTML = `${quick}<div class="chips">${chips}</div>
    ${homeState.errors.length === TEAMS.length
      ? `<div class="err">Can't reach ESPN for scores. If you're offline, this will retry by itself. If you opened this file in a preview window (Files, Mail or a chat app), those usually block internet access, so open it in a web browser instead.</div>`
      : homeState.errors.map(e => `<div class="err">${esc(e)}. Retrying automatically.</div>`).join('')}
    ${b.live.length ? section('Live now', b.live, '') : ''}
    ${!b.today.length && !b.recent.length
      ? `<h2 class="sec">Today</h2><div class="empty slim">No games today or in the last 36 hours.</div>`
      : section('Today', b.today, 'No games today.') + section('Last 36 hours', b.recent, 'No games finished in the last 36 hours.')}
    ${section('Next 7 days', b.upcoming, 'Nothing scheduled in the next 7 days.')}
    ${VIEW.news ? `<div id="home-news">${newsBlock({ team:filter === 'all' ? null : filter, limit:homeNewsLimit, home:true })}</div>` : ''}`;
  if (VIEW.news && !newsState.loading && (!newsState.data || Date.now() - newsState.fetchedAt > 5*60e3)) loadNews().then(() => { if (currentRoute().name === 'home') { const el = $('#home-news'); if (el) { const f = store.get(FILTER_KEY, 'all'); el.innerHTML = newsBlock({ team:f === 'all' ? null : f, limit:homeNewsLimit, home:true }); wireNews(); } } });
  wireNews();
  $('#app').querySelectorAll('[data-filter]').forEach(el => el.onclick = () => { store.set(FILTER_KEY, el.dataset.filter); renderHome(); });
}

/* ---------- Game view ---------- */
const view = { league:null, id:null, tab:null, s:null, sit:null, open:new Set(), period:'all', shotTeam:'all', loading:false };

const LIVE_MS = 5000; // ESPN caches game data for ~1s, so this picks up changes within a few seconds
function playIds(s){
  if (s.drives) return [...(s.drives.previous || []), ...(s.drives.current ? [s.drives.current] : [])].flatMap(d => (d.plays || []).map(p => String(p.id)));
  return (s.plays || []).map(p => String(p.id));
}
function gameSig(s, sit, ids){
  const c = s.header?.competitions?.[0] || {};
  return JSON.stringify([c.status?.displayClock, c.status?.period, c.status?.type?.name,
    (c.competitors || []).map(x => [x.score, x.possession, (x.linescores || []).length]),
    ids.length, ids[ids.length - 1], sit ? [sit.down, sit.distance, sit.possessionText, sit.balls, sit.strikes, sit.outs, sit.onFirst, sit.onSecond, sit.onThird, sit.lastPlay?.id] : null,
    (s.boxscore?.players || []).map(p => (p.statistics || []).map(g => (g.totals || []).join()).join()).join()]);
}
const agoText = ms => { const sec = Math.max(0, Math.round(ms / 1000)); return sec < 60 ? `${sec}s ago` : `${Math.floor(sec / 60)}m ${sec % 60}s ago`; };
const fmtClock = d => d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit', second:'2-digit' });
// Updates the live status line every second without redrawing the page.
function tickLive(){
  const el = document.getElementById('livebar');
  if (!el || !view.fetchedAt) return;
  const age = Date.now() - view.fetchedAt;
  const stale = age > 30e3 || view.failures > 0;
  el.className = 'livebar' + (stale ? ' stale' : '');
  const espn = view.espnAt ? ` · ESPN data as of ${fmtClock(view.espnAt)}` : '';
  el.innerHTML = stale
    ? `<span class="dot"></span><b>Updates delayed</b> · last updated ${esc(fmtClock(view.fetchedAt))} (${esc(agoText(age))}) · retrying`
    : `<span class="dot"></span><b>Live</b> · Last updated ${esc(fmtClock(view.fetchedAt))} <span class="ago">(${esc(agoText(age))})</span>${esc(espn)}`;
}
setInterval(tickLive, 1000);

async function showGame(league, id){
  const sameGame = view.league === league && view.id === id;
  if (!sameGame) Object.assign(view, { league, id, tab:null, s:null, sit:null, open:new Set(), period:'all', shotTeam:'all',
    sig:null, seen:null, fresh:new Set(), fetchedAt:null, espnAt:null, failures:0 });
  if (document.hidden && view.s) { schedule(() => showGame(league, id), LIVE_MS); return; } // paused while the app is in the background
  if (!view.s) $('#app').innerHTML = `<a class="back" href="#/">← All games</a><div class="loading">Loading game…</div>`;
  const sport = SPORT[league];
  try {
    const s = await getJSON(`${API}/${sport}/${league}/summary?event=${encodeURIComponent(id)}`);
    const state = s.header?.competitions?.[0]?.status?.type?.state || 'pre';
    let sit = null;
    if (state === 'in' && (league === 'nfl' || league === 'mlb')) {
      try {
        const sb = await leagueScoreboard(teamOf(league));
        const ev = (sb.events || []).find(e => e.id === id);
        sit = ev?.competitions?.[0]?.situation || null;
      } catch {}
    }
    const r = currentRoute();
    if (r.name !== 'game' || r.id !== id) return;
    const hc = s.header?.competitions?.[0] || {};
    const hs = c => c ? { abbr:c.team?.abbreviation, short:c.team?.shortDisplayName || c.team?.name } : null;
    const bay = { league, date:new Date(hc.date || 0), id,
      bay:bayArea(league, new Date(hc.date || 0), bcList(hc), hs((hc.competitors || []).find(x => x.homeAway === 'home')), hs((hc.competitors || []).find(x => x.homeAway === 'away'))) };
    if (state !== 'post') await refineBay([bay]);
    // Which plays are new since the last update (highlighted briefly), and did anything change at all?
    const ids = playIds(s);
    const sig = gameSig(s, sit, ids);
    const changed = sig !== view.sig;
    view.fresh = view.seen ? new Set(ids.filter(x => !view.seen.has(x))) : new Set();
    view.seen = new Set(ids);
    view.s = s; view.sit = sit; view.bay = bay.bay; view.sig = sig;
    view.fetchedAt = new Date(); view.failures = 0;
    view.espnAt = s.meta?.lastUpdatedAt ? new Date(s.meta.lastUpdatedAt) : null;
    if (!view.tab) view.tab = state === 'in' ? 'gamecast' : state === 'post' ? 'box' : 'preview';
    if (changed || !$('#app .score-hero')) renderGame();
    view.fresh = new Set(); // highlight new plays once, not again on tab switches
    tickLive();
    setUpdated(state === 'in' ? ' · live' : '');
    const start = new Date(s.header?.competitions?.[0]?.date || 0);
    if (state === 'in') schedule(() => showGame(league, id), LIVE_MS);
    else if (state === 'pre' && start - Date.now() < H) schedule(() => showGame(league, id), 60e3);
  } catch (e) {
    if (!view.s) $('#app').innerHTML = `<a class="back" href="#/">← All games</a><div class="err">Couldn't load this game (${esc(e.message)}). Retrying…</div>`;
    view.failures = (view.failures || 0) + 1;
    tickLive();
    // keep retrying quickly during a live game, backing off to 30s
    const live = view.s?.header?.competitions?.[0]?.status?.type?.state === 'in';
    schedule(() => showGame(league, id), live ? Math.min(30e3, LIVE_MS * 2 ** Math.min(view.failures, 3)) : 20e3);
  }
}

function gameCtx(){
  const s = view.s, comp = s.header.competitions[0];
  const cs = comp.competitors || [];
  const home = cs.find(c => c.homeAway === 'home') || cs[0];
  const away = cs.find(c => c.homeAway === 'away') || cs[1];
  const st = comp.status?.type || {};
  const color = (c, fallback) => hexColor(c?.team?.color) || fallback;
  let ac = color(away, '#5b6b8c'), hc = color(home, '#c2410c');
  if (ac.toLowerCase() === hc.toLowerCase()) hc = hexColor(home?.team?.alternateColor) || '#c2410c';
  return { s, comp, home, away, st, state:st.state || 'pre', league:view.league, ac, hc,
    byId: id => (String(home?.team?.id) === String(id) ? home : String(away?.team?.id) === String(id) ? away : null) };
}

function renderGame(){
  const g = gameCtx();
  const tabs = tabList(g);
  if (!tabs.some(t => t.key === view.tab)) view.tab = tabs[0].key;
  document.title = `${g.away?.team?.abbreviation} ${g.away?.score ?? ''} – ${g.home?.team?.abbreviation} ${g.home?.score ?? ''} · ${VIEW.name}`;
  const panel = tabs.find(t => t.key === view.tab).render(g);
  $('#app').innerHTML = `<a class="back" href="#/">← All games</a>
    ${hero(g)}
    <div class="tabs" role="tablist">${tabs.map(t => `<button class="tab" role="tab" data-tab="${t.key}" aria-selected="${t.key===view.tab}">${esc(t.label)}</button>`).join('')}</div>
    <div class="panel" role="tabpanel">${panel}</div>`;
  wireGame();
}

function tabList(g){
  const box = { key:'box', label:'Box Score', render:renderBox };
  const team = { key:'team', label:'Team Stats', render:renderTeamStats };
  const plays = { key:'plays', label:'Play-by-Play', render:renderPlays };
  const summary = { key:'summary', label:'Summary', render:renderSummary };
  if (g.state === 'in') return [{ key:'gamecast', label:'Gamecast', render:renderGamecast }, box, team, plays];
  if (g.state === 'post') return [box, team, summary, plays];
  return [{ key:'preview', label:'Preview', render:renderPreview }];
}

function hero(g){
  const { comp, home, away, state } = g;
  const st = comp.status?.type || {};
  const t = (c) => {
    if (!c) return '<div></div>';
    const cls = state === 'post' ? (c.winner ? 'win' : 'lose') : '';
    const rec = recOf(c);
    const poss = state === 'in' && g.league === 'nfl' && (c.possession || String(view.sit?.possession) === String(c.team?.id)) ? '● Ball' : '';
    return `<div class="hteam ${cls}">${teamLink(g.league, c.team, img(logoOf(c.team), '', c.team?.abbreviation))}
      <div class="tn">${teamLink(g.league, c.team, esc(c.team?.shortDisplayName || c.team?.displayName))}</div><div class="tr">${esc(rec)}</div>
      ${state !== 'pre' ? `<div class="ts num">${esc(scoreOf(c.score) ?? 0)}</div>` : ''}<div class="poss">${esc(poss)}</div></div>`;
  };
  const date = new Date(comp.date);
  const mid = state === 'pre'
    ? `<div class="st">${esc(fmtTime(date))}</div><div>${esc(fmtDay(date))}</div>`
    : state === 'in' ? `<div class="st status-live">${esc(st.shortDetail || st.detail)}</div>` : `<div class="st">${esc(st.detail || 'Final')}</div><div>${esc(fmtDay(date))}</div>`;
  const venue = view.s.gameInfo?.venue?.fullName;
  const bc = bcOf(comp);
  return `<div class="score-hero"><div class="hero-grid">${t(away)}<div class="hmid">${mid}</div>${t(home)}</div>
    ${linescore(g)}
    ${state === 'in' ? `<div class="livebar" id="livebar" role="status" aria-live="off"></div>` : ''}
    <div class="hero-foot">${esc([venue, bc].filter(Boolean).join(' · '))}<br>${bayPill(view.bay)}
      ${view.bay?.why ? `<div class="baynote">${esc(view.bay.why)}${view.bay.regional ? ` <a href="https://506sports.com/nfl.php" target="_blank" rel="noopener">See this week's coverage maps</a>` : ''}</div>` : ''}</div></div>`;
}

function linescore(g){
  const { home, away, league, state } = g;
  if (state === 'pre' || !home || !away) return '';
  const n = Math.max(home.linescores?.length || 0, away.linescores?.length || 0);
  if (!n) return '';
  const regs = league === 'mlb' ? 9 : league === 'nhl' ? 3 : 4;
  const cols = Array.from({ length:Math.max(n, league === 'mlb' ? regs : n) }, (_, i) => league === 'nhl' && i >= regs ? nhlPerLabel(i + 1)
    : i < regs ? String(i+1) : (league === 'mlb' ? String(i+1) : (i === regs ? 'OT' : `${i-regs+1}OT`)));
  const mlbExtra = league === 'mlb';
  const teamHits = c => {
    const t = (view.s.boxscore?.teams || []).find(x => String(x.team?.id) === String(c.team?.id));
    const bat = (t?.statistics || []).find(gp => gp.name === 'batting');
    const fld = (t?.statistics || []).find(gp => gp.name === 'fielding');
    const get = (gp, ab) => (gp?.stats || []).find(z => z.abbreviation === ab)?.displayValue;
    return { h: c.hits ?? get(bat, 'H') ?? '', e: c.errors ?? get(fld, 'E') ?? '' };
  };
  const row = c => {
    const ls = c.linescores || [];
    const x = mlbExtra ? teamHits(c) : null;
    return `<tr><td>${esc(c.team?.abbreviation)}</td>${cols.map((_, i) => `<td>${esc(ls[i]?.displayValue ?? (ls[i]?.value ?? ''))}</td>`).join('')}
      <td><b>${esc(scoreOf(c.score) ?? '')}</b></td>${mlbExtra ? `<td>${esc(x.h)}</td><td>${esc(x.e)}</td>` : ''}</tr>`;
  };
  return `<div class="tablewrap line"><table><thead><tr><th></th>${cols.map(c => `<th>${c}</th>`).join('')}<th>${mlbExtra ? 'R' : 'T'}</th>${mlbExtra ? '<th>H</th><th>E</th>' : ''}</tr></thead>
    <tbody>${row(away)}${row(home)}</tbody></table></div>`;
}

function wireGame(){
  $('#app').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { view.tab = b.dataset.tab; renderGame(); });
  $('#app').querySelectorAll('details[data-id]').forEach(d => d.addEventListener('toggle', () => {
    const id = d.dataset.id;
    if (d.open) { view.open.add(id); view.open.delete('closed-' + id); } else { view.open.delete(id); view.open.add('closed-' + id); }
  }));
  $('#app').querySelectorAll('[data-period]').forEach(b => b.onclick = () => { view.period = b.dataset.period; renderGame(); });
  $('#app').querySelectorAll('[data-shot]').forEach(b => b.onclick = () => { view.shotTeam = b.dataset.shot; renderGame(); });
}

/* ---------- Box score ---------- */
function orderedPlayers(g){
  const ps = g.s.boxscore?.players || [];
  return [...ps].sort((a, b) => (String(a.team?.id) === String(g.away?.team?.id) ? -1 : 1) - (String(b.team?.id) === String(g.away?.team?.id) ? -1 : 1));
}
function grpTitle(gp){
  const t = gp.name || gp.type || gp.text || '';
  return t ? t.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()) : '';
}
function nbaDerived(gp){
  const L = gp.labels || [];
  const iP = L.indexOf('PTS'), iFG = L.indexOf('FG'), i3 = L.indexOf('3PT'), iFT = L.indexOf('FT');
  if (iP < 0 || iFG < 0 || iFT < 0) return null;
  return {
    labels:['TS%', 'eFG%'],
    calc(stats){
      const [fgm, fga] = String(stats[iFG] || '').split('-').map(Number);
      const [, fta] = String(stats[iFT] || '').split('-').map(Number);
      const [tpm] = String(stats[i3] || '').split('-').map(Number);
      const pts = Number(stats[iP]);
      if (!fga && !fta) return ['–', '–'];
      const ts = pts / (2 * (fga + 0.44 * fta));
      const efg = fga ? (fgm + 0.5 * (tpm || 0)) / fga : null;
      return [pct(ts), efg == null ? '–' : pct(efg)];
    }
  };
}
// NHL box score: ESPN sends ~20 columns per skater; show the usual hockey line. Keys are ESPN's stat keys.
const NHL_BOX = {
  skater:[['goals','G'], ['assists','A'], ['=pts','PTS'], ['plusMinus','+/-'], ['shotsTotal','S'], ['hits','HIT'], ['blockedShots','BLK'], ['penaltyMinutes','PIM'], ['faceoffPercent','FO%'], ['timeOnIce','TOI']],
  goalies:[['goalsAgainst','GA'], ['shotsAgainst','SA'], ['saves','SV'], ['savePct','SV%'], ['timeOnIce','TOI'], ['penaltyMinutes','PIM']],
};
const NHL_GROUP = { forwards:'Forwards', defenses:'Defense', goalies:'Goalies', skaters:'Skaters' };
function nhlBox(gp){
  const keys = gp.keys || [], L = gp.labels || [];
  const spec = NHL_BOX[gp.name === 'goalies' ? 'goalies' : 'skater'];
  const cols = spec.map(([k, label]) => {
    if (k === '=pts') { const ig = keys.indexOf('goals'), ia = keys.indexOf('assists'); return ig < 0 || ia < 0 ? null : { label, get:st => String(Number(st[ig]) + Number(st[ia])) }; }
    const i = keys.indexOf(k);
    return i < 0 ? null : { label, get:st => st[i] };
  }).filter(Boolean);
  // drop faceoff % for defensemen: almost always 0
  const useCols = gp.name === 'defenses' ? cols.filter(c => c.label !== 'FO%') : cols;
  if (!useCols.length) return null;
  return { labels:useCols.map(c => c.label), pick:st => useCols.map(c => c.get(st) ?? ''), descs:useCols.map(c => (gp.descriptions || [])[L.indexOf(c.label)] || '') };
}
function renderBox(g){
  const players = orderedPlayers(g);
  if (!players.length) return `<div class="empty">Box score isn't available yet.</div>`;
  const teams = players.map(p => {
    const groups = (p.statistics || []).filter(gp => (gp.athletes || []).length).map(gp => {
      const der = g.league === 'nba' ? nbaDerived(gp) : null;
      const nhl = g.league === 'nhl' ? nhlBox(gp) : null;
      const labels = nhl ? nhl.labels : [...(gp.labels || []), ...(der ? der.labels : [])];
      const desc = nhl ? nhl.descs : gp.descriptions || [];
      const title = (g.league === 'nhl' && NHL_GROUP[gp.name]) || grpTitle(gp);
      const head = `<tr><th>${esc(title || 'Player')}</th>${labels.map((l, i) => `<th title="${esc(desc[i] || '')}">${esc(l)}</th>`).join('')}</tr>`;
      let ath = gp.athletes;
      const rows = [];
      const rowFor = a => {
        const pos = a.athlete?.position?.abbreviation || a.position?.abbreviation || '';
        const name = `${esc(a.athlete?.shortName || a.athlete?.displayName)}${pos ? `<span class="pos">${esc(pos)}</span>` : ''}`;
        if (!a.stats?.length) return `<tr><td class="pl">${name}</td><td colspan="${labels.length}" style="text-align:left"><span class="dnp">${esc(a.reason || 'Did not play')}</span></td></tr>`;
        const extra = der ? der.calc(a.stats) : [];
        const vals = nhl ? nhl.pick(a.stats) : [...a.stats, ...extra];
        return `<tr><td class="pl">${name}</td>${vals.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`;
      };
      if (g.league === 'nba') {
        const st = ath.filter(a => a.starter), bn = ath.filter(a => !a.starter);
        rows.push(`<tr class="divider"><td colspan="${labels.length + 1}">Starters</td></tr>`, ...st.map(rowFor));
        if (bn.length) rows.push(`<tr class="divider"><td colspan="${labels.length + 1}">Bench</td></tr>`, ...bn.map(rowFor));
      } else rows.push(...ath.map(rowFor));
      if (gp.totals?.length && !nhl) {
        const extra = der ? der.calc(gp.totals) : [];
        rows.push(`<tr class="total"><td>Team</td>${[...gp.totals, ...extra].map(v => `<td>${esc(v)}</td>`).join('')}</tr>`);
      }
      return `${g.league !== 'nba' ? `<div class="grp-title">${esc(title)}</div>` : ''}<div class="tablewrap"><table><thead>${head}</thead><tbody>${rows.join('')}</tbody></table></div>`;
    }).join('');
    return `<div class="box"><div class="teamhead">${teamLink(g.league, p.team, img(logoOf(p.team), 'logo', p.team?.abbreviation) + esc(p.team?.displayName))}</div>${groups}</div>`;
  });
  return teams.join('') + (g.league === 'nba' ? `<div class="note">TS% (true shooting) and eFG% (effective field goal) are calculated from the box score.</div>` : '');
}

/* ---------- Team stats ---------- */
function orderedTeams(g){
  const ts = g.s.boxscore?.teams || [];
  const a = ts.find(t => String(t.team?.id) === String(g.away?.team?.id)) || ts[0];
  const h = ts.find(t => String(t.team?.id) === String(g.home?.team?.id)) || ts[1];
  return [a, h];
}
function cmpRow(label, av, hv, opts={}){
  const a = num(String(av).split('-')[0]), h = num(String(hv).split('-')[0]);
  let bar = '';
  if (a != null && h != null && a + h > 0 && !opts.noBar) {
    let pa = a / (a + h);
    if (opts.lowerBetter) pa = 1 - pa;
    bar = `<div class="bar"><span style="width:${(pa*100).toFixed(1)}%;background:var(--ac)"></span><span style="width:${((1-pa)*100).toFixed(1)}%;background:var(--hc)"></span></div>`;
  }
  return `<div class="v va">${esc(av)}</div><div class="lbl">${esc(label)}</div><div class="v">${esc(hv)}</div>${bar || '<div class="bar nobar"></div>'}`;
}
function cmpHead(g){
  return `<div class="cmp-head"><span style="display:flex;gap:8px;align-items:center">${img(logoOf(g.away?.team),'logo')}${esc(g.away?.team?.abbreviation)}</span><span></span><span style="display:flex;gap:8px;align-items:center">${esc(g.home?.team?.abbreviation)}${img(logoOf(g.home?.team),'logo')}</span></div>`;
}
function renderTeamStats(g){
  const [a, h] = orderedTeams(g);
  if (!a || !h || !(a.statistics || []).length) return `<div class="empty">Team stats aren't available yet.</div>`;
  const vars = `style="--ac:${g.ac};--hc:${g.hc}"`;
  let out = '';
  if (g.league === 'nba') out += nbaAdvanced(g, a, h, vars);
  if (a.statistics[0]?.stats) {
    // Grouped (MLB): batting / pitching / fielding
    const groups = a.statistics.map((ga, i) => {
      const gh = h.statistics.find(x => x.name === ga.name) || h.statistics[i] || { stats:[] };
      const rows = (ga.stats || []).filter(st => st.displayValue !== '' && !['GP','G'].includes(st.abbreviation)).map(st => {
        const hv = (gh.stats || []).find(x => x.name === st.name)?.displayValue ?? '';
        return cmpRow(st.displayName || st.abbreviation || st.name, st.displayValue, hv, { noBar:true });
      }).join('');
      return rows ? `<div class="box"><h3>${esc(grpTitle(ga))}</h3>${cmpHead(g)}<div class="cmp" ${vars}>${rows}</div></div>` : '';
    }).join('');
    out += `<div class="two">${groups}</div>`;
  } else {
    const lowerBetter = /turnover|foul|penalt|sack|interception|fumble|giveaway/i;
    const rows = a.statistics.map(st => {
      const hv = (h.statistics || []).find(x => x.name === st.name)?.displayValue ?? '';
      const pctLike = /pct|percent|%/i.test(st.name + st.label);
      return cmpRow(st.label || st.name, st.displayValue, hv, { lowerBetter:lowerBetter.test(st.name + st.label), noBar:pctLike && false });
    }).join('');
    out += `<div class="box"><h3>Team stats</h3>${cmpHead(g)}<div class="cmp" ${vars}>${rows}</div></div>`;
  }
  return out;
}
function nbaAdvanced(g, a, h, vars){
  const pick = (t) => {
    const by = n => (t.statistics || []).find(s => s.name === n)?.displayValue ?? '';
    const pair = n => String(by(n)).split('-').map(Number);
    const [fgm, fga] = pair('fieldGoalsMade-fieldGoalsAttempted');
    const [tpm] = pair('threePointFieldGoalsMade-threePointFieldGoalsAttempted');
    const [ftm, fta] = pair('freeThrowsMade-freeThrowsAttempted');
    const oreb = Number(by('offensiveRebounds')), dreb = Number(by('defensiveRebounds'));
    const tov = Number(by('totalTurnovers') || by('turnovers'));
    const c = g.byId(t.team?.id);
    return { fgm, fga, tpm, ftm, fta, oreb, dreb, tov, pts:Number(scoreOf(c?.score)) };
  };
  const A = pick(a), Hm = pick(h);
  if (!A.fga || !Hm.fga) return '';
  const calc = (x, o) => {
    const poss = x.fga + 0.44 * x.fta - x.oreb + x.tov;
    return { poss, ortg:100 * x.pts / poss, efg:(x.fgm + 0.5 * x.tpm) / x.fga, ts:x.pts / (2 * (x.fga + 0.44 * x.fta)),
      tovp:x.tov / poss, orbp:x.oreb / (x.oreb + o.dreb), ftr:x.ftm / x.fga };
  };
  const ca = calc(A, Hm), ch = calc(Hm, A);
  const pace = (ca.poss + ch.poss) / 2;
  const rows = [
    cmpRow('Possessions (est.)', ca.poss.toFixed(1), ch.poss.toFixed(1), { noBar:true }),
    cmpRow('Offensive rating', ca.ortg.toFixed(1), ch.ortg.toFixed(1)),
    cmpRow('eFG%', pct(ca.efg), pct(ch.efg)),
    cmpRow('True shooting %', pct(ca.ts), pct(ch.ts)),
    cmpRow('Turnover %', pct(ca.tovp), pct(ch.tovp), { lowerBetter:true }),
    cmpRow('Off. rebound %', pct(ca.orbp), pct(ch.orbp)),
    cmpRow('FT rate (FTM/FGA)', ca.ftr.toFixed(3), ch.ftr.toFixed(3)),
  ].join('');
  return `<div class="box"><h3>Advanced <span class="sub">Four Factors · pace ≈ ${pace.toFixed(1)} possessions</span></h3>${cmpHead(g)}<div class="cmp" ${vars}>${rows}</div>
    <div class="note">Calculated from the box score. Rating = points per 100 possessions.</div></div>`;
}

/* ---------- Win probability ---------- */
function winProb(g){
  const wp = g.s.winprobability || [];
  if (wp.length < 2) return '';
  const W = 600, Hh = 150, n = wp.length;
  const pts = wp.map((p, i) => [i / (n - 1) * W, (1 - p.homeWinPercentage) * Hh]);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const last = wp[n - 1].homeWinPercentage;
  const leader = last >= 0.5 ? g.home : g.away;
  const lp = last >= 0.5 ? last : 1 - last;
  return `<div class="box"><h3>Win probability <span class="sub">${esc(leader?.team?.abbreviation)} ${pct(lp, 1)}</span></h3>
    <svg viewBox="0 0 ${W} ${Hh}" width="100%" preserveAspectRatio="none" style="height:150px;display:block" role="img" aria-label="Win probability chart">
      <defs><clipPath id="top"><rect x="0" y="0" width="${W}" height="${Hh/2}"/></clipPath><clipPath id="bot"><rect x="0" y="${Hh/2}" width="${W}" height="${Hh/2}"/></clipPath></defs>
      <path d="${line}L${W},${Hh/2}L0,${Hh/2}Z" fill="${g.hc}" opacity=".22" clip-path="url(#top)"/>
      <path d="${line}L${W},${Hh/2}L0,${Hh/2}Z" fill="${g.ac}" opacity=".22" clip-path="url(#bot)"/>
      <line x1="0" x2="${W}" y1="${Hh/2}" y2="${Hh/2}" stroke="var(--border)" stroke-dasharray="4 4"/>
      <path d="${line}" fill="none" stroke="var(--text)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="legend"><span><i style="background:${g.hc}"></i>${esc(g.home?.team?.abbreviation)} (top)</span><span><i style="background:${g.ac}"></i>${esc(g.away?.team?.abbreviation)} (bottom)</span></div></div>`;
}

/* ---------- Leaders ---------- */
function leaders(g){
  const L = g.s.leaders || [];
  if (!L.length) return '';
  const cols = [g.away, g.home].map(c => {
    const t = L.find(x => String(x.team?.id) === String(c?.team?.id));
    if (!t || !(t.leaders || []).length) return '';
    const rows = t.leaders.slice(0, 4).map(cat => {
      const top = cat.leaders?.[0];
      if (!top) return '';
      return `<div class="leader">${img(top.athlete?.headshot?.href, 'hs', '')}<div><div class="cat">${esc(cat.displayName || cat.name)}</div><div class="who">${esc(top.athlete?.displayName)}</div></div><div class="small">${esc(top.displayValue)}</div></div>`;
    }).join('');
    return `<div><div class="teamhead" style="font-size:14px">${teamLink(g.league, c?.team, img(logoOf(c?.team), 'logo') + esc(c?.team?.shortDisplayName || c?.team?.displayName || c?.team?.name || c?.team?.abbreviation || ''))}</div><div class="leaders">${rows}</div></div>`;
  });
  if (!cols.join('')) return '';
  return `<div class="box"><h3>Top performers</h3><div class="two">${cols.join('')}</div></div>`;
}

/* ---------- Scoring summary ---------- */
function teamLogoById(g, id){ return logoOf(g.byId(id)?.team); }
function scoringSummary(g){
  let list = [];
  if (g.league === 'nfl') list = g.s.scoringPlays || [];
  else if (g.league === 'mlb') list = (g.s.plays || []).filter(p => p.scoringPlay && p.type?.type === 'play-result' || (p.scoringPlay && p.summaryType !== 'P'));
  else if (g.league === 'nhl') list = (g.s.plays || []).filter(p => p.scoringPlay);
  else return '';
  if (!list.length) return '';
  const per = p => g.league === 'mlb' ? `${p.period?.type === 'Bottom' ? 'Bot' : 'Top'} ${ordinal(p.period?.number || 0)}`
    : g.league === 'nhl' ? nhlClk(g, p) : `Q${p.period?.number}${p.clock?.displayValue ? ' ' + p.clock.displayValue : ''}`;
  const seen = new Set();
  const items = list.filter(p => { const k = p.id; if (seen.has(k)) return false; seen.add(k); return true; }).map(p =>
    `<li class="scoring"><span class="clk">${esc(per(p))}</span>${img(teamLogoById(g, p.team?.id), '', '')}<span class="txt">${esc(p.text)}${nhlStrength(g, p)}</span><span class="scr">${playScore(g, p)}</span></li>`).join('');
  return `<div class="box"><h3>Scoring summary <span class="sub">${esc(g.away?.team?.abbreviation)}–${esc(g.home?.team?.abbreviation)}</span></h3><ul class="plays">${items}</ul></div>`;
}

function renderSummary(g){
  return [winProb(g), scoringSummary(g), leaders(g)].filter(Boolean).join('') || `<div class="empty">No summary available.</div>`;
}

/* ---------- Play-by-play ---------- */
function playRow(g, p, clk){
  const dd = p.start?.downDistanceText && !/kickoff|timeout|end of|extra point/i.test(p.type?.text || '') ? `<span class="dd">${esc(p.start.downDistanceText)}</span>` : '';
  const isNew = view.fresh?.has(String(p.id));
  return `<li class="${p.scoringPlay ? 'scoring' : ''}${isNew ? ' new' : ''}"><span class="clk">${esc(clk)}</span>${img(teamLogoById(g, p.team?.id), '', '')}<span class="txt">${dd}${esc(p.text)}</span><span class="scr">${playScore(g, p)}</span></li>`;
}
function periodChips(periods, label){
  return `<div class="pchips"><button class="chip" data-period="all" aria-pressed="${view.period==='all'}">All</button>${periods.map(n =>
    `<button class="chip" data-period="${n}" aria-pressed="${String(view.period)===String(n)}">${esc(label(n))}</button>`).join('')}</div>`;
}
const nbaPer = n => n <= 4 ? `Q${n}` : (n === 5 ? 'OT' : `${n-4}OT`);
/* NHL periods: 1–3, then OT; in the regular season period 5 is the shootout, in the playoffs it's 2OT and so on.
   ESPN's NHL clock is time elapsed in the period. */
const nhlPlayoffs = () => view.s?.header?.season?.type === 3;
const nhlPerLabel = n => n <= 3 ? String(n) : n === 4 ? 'OT' : nhlPlayoffs() ? `${n-3}OT` : 'SO';
const nhlPerName = n => n <= 3 ? ordinal(n) : nhlPerLabel(n);
const isShootout = p => !nhlPlayoffs() && p.period?.number >= 5;
const nhlClk = (g, p) => isShootout(p) ? 'SO' : `${nhlPerName(p.period?.number || 0)} ${p.clock?.displayValue || ''}`.trim();
function nhlStrength(g, p){
  const t = p.strength?.abbreviation;
  if (g.league !== 'nhl' || !p.scoringPlay || !t || t === 'even-strength') return '';
  return ` <span class="dd">${esc(p.strength.text)}</span>`;
}
// During a shootout ESPN's play scores count shootout goals, not the game score: leave them out.
function playScore(g, p){
  if (g.league === 'nhl' && isShootout(p)) return '';
  return `${esc(p.awayScore ?? '')}–${esc(p.homeScore ?? '')}`;
}
const NHL_SKIP = /^(Stoppage|Period Start|Shootout Start)$/;
function renderPlays(g){
  const live = g.state === 'in';
  if (g.league === 'nfl') {
    const d = g.s.drives || {};
    let drives = [...(d.previous || [])];
    if (d.current && !drives.some(x => x.id === d.current.id)) drives.push(d.current);
    if (!drives.length) return `<div class="empty">No plays yet.</div>`;
    if (live) drives.reverse();
    const lastId = live ? drives[0]?.id : null;
    return `<div>${drives.map(dr => {
      const id = 'd' + dr.id;
      const open = view.open.has(id) || (dr.id === lastId && !view.open.has('closed-' + id));
      let plays = [...(dr.plays || [])];
      if (live) plays.reverse();
      return `<details class="drive ${dr.isScore ? 'score' : ''}" data-id="${esc(id)}" ${open ? 'open' : ''}>
        <summary>${img(logoOf(dr.team), 'logo', dr.team?.abbreviation)}<div><div class="res">${esc(dr.displayResult || dr.result || (dr.id === d.current?.id ? 'In progress' : ''))}</div>
        <div class="ds">${esc(dr.description)}${dr.start?.text ? ' · from ' + esc(dr.start.text) : ''}</div></div><span class="small">${esc(dr.plays?.[0]?.period?.number ? 'Q' + dr.plays[0].period.number : '')}</span></summary>
        <ul class="plays">${plays.map(p => playRow(g, p, `Q${p.period?.number} ${p.clock?.displayValue || ''}`)).join('')}</ul></details>`;
    }).join('')}</div>`;
  }
  if (g.league === 'nba') {
    const all = g.s.plays || [];
    if (!all.length) return `<div class="empty">No plays yet.</div>`;
    const periods = [...new Set(all.map(p => p.period?.number))].filter(Boolean);
    let list = view.period === 'all' ? all : all.filter(p => String(p.period?.number) === String(view.period));
    if (live) list = [...list].reverse();
    if (view.period === 'all' && list.length > 400) list = live ? list.slice(0, 400) : list;
    return `<div class="box">${periodChips(periods, nbaPer)}<ul class="plays">${list.map(p => playRow(g, p, `${nbaPer(p.period?.number)} ${p.clock?.displayValue || ''}`)).join('')}</ul></div>`;
  }
  if (g.league === 'nhl') {
    const all = (g.s.plays || []).filter(p => !NHL_SKIP.test(p.type?.text || ''));
    if (!all.length) return `<div class="empty">No plays yet.</div>`;
    const periods = [...new Set(all.map(p => p.period?.number))].filter(Boolean);
    let list = view.period === 'all' ? all : all.filter(p => String(p.period?.number) === String(view.period));
    if (live) list = [...list].reverse();
    return `<div class="box">${periodChips(periods, nhlPerName)}<ul class="plays">${list.map(p => playRow(g, p, nhlClk(g, p))).join('')}</ul></div>`;
  }
  // MLB: grouped by half-inning, each at-bat expandable to its pitches
  const all = g.s.plays || [];
  if (!all.length) return `<div class="empty">No plays yet.</div>`;
  const pitchesByAB = {};
  all.forEach(p => { if (p.summaryType === 'P' && p.atBatId) (pitchesByAB[p.atBatId] ||= []).push(p); });
  const skip = new Set(['start-batterpitcher', 'end-batterpitcher', 'start-inning', 'end-inning']);
  const events = all.filter(p => p.summaryType !== 'P' && !skip.has(p.type?.type) && p.text);
  const halves = [];
  events.forEach(p => {
    const key = `${p.period?.type}-${p.period?.number}`;
    let h = halves[halves.length - 1];
    if (!h || h.key !== key) halves.push(h = { key, label:`${p.period?.type === 'Bottom' ? 'Bottom' : 'Top'} ${ordinal(p.period?.number || 0)}`, items:[] });
    h.items.push(p);
  });
  if (live) { halves.reverse(); halves.forEach(h => h.items.reverse()); }
  const used = new Set();
  return `<div class="box">${halves.map(h => `<div class="half">${esc(h.label)}</div><ul class="plays">${h.items.map(p => {
    const pitches = p.type?.type === 'play-result' && p.atBatId && !used.has(p.atBatId) ? (used.add(p.atBatId), pitchesByAB[p.atBatId] || []) : [];
    const id = 'ab' + p.id;
    const body = pitches.length
      ? `<details class="ab" data-id="${esc(id)}" ${view.open.has(id) ? 'open' : ''}><summary>${esc(p.text)} <span class="small">· ${pitches.length} pitch${pitches.length === 1 ? '' : 'es'}</span></summary>
         <ol class="pitchlist">${pitches.map(pi => `<li>${esc(pi.type?.text)}${pi.pitchType?.text ? ` · ${esc(pi.pitchType.text)}` : ''}${pi.pitchVelocity ? ` ${esc(pi.pitchVelocity)} mph` : ''}</li>`).join('')}</ol></details>`
      : esc(p.text);
    return `<li class="${p.scoringPlay ? 'scoring' : ''}"><span class="clk">${esc(p.outs != null ? p.outs + ' out' : '')}</span>${img(teamLogoById(g, p.team?.id), '', '')}<span class="txt">${body}</span><span class="scr">${esc(p.awayScore ?? '')}–${esc(p.homeScore ?? '')}</span></li>`;
  }).join('')}</ul>`).join('')}</div>`;
}

/* ---------- Gamecast ---------- */
function renderGamecast(g){
  const parts = [];
  if (g.league === 'nfl') parts.push(nflField(g));
  if (g.league === 'mlb') parts.push(mlbDiamond(g));
  if (g.league === 'nba') parts.push(nbaLive(g), nbaShots(g));
  if (g.league === 'nhl') parts.push(nhlLive(g), nhlShots(g));
  parts.push(winProb(g), recentPlays(g), quickCompare(g), scoringSummary(g), leaders(g));
  return parts.filter(Boolean).join('');
}
function lastPlays(g, n){
  if (g.league === 'nfl') {
    const d = g.s.drives || {};
    const plays = [...(d.previous || []), ...(d.current && !(d.previous || []).some(x => x.id === d.current.id) ? [d.current] : [])].flatMap(dr => dr.plays || []);
    return plays.slice(-n).reverse();
  }
  const ps = (g.s.plays || []).filter(p => g.league === 'nhl' ? !NHL_SKIP.test(p.type?.text || '') && p.text
    : g.league !== 'mlb' || (p.summaryType !== 'P' && p.text && !/batterpitcher|inning/.test(p.type?.type || '')));
  return ps.slice(-n).reverse();
}
function recentPlays(g){
  const ps = lastPlays(g, 8);
  if (!ps.length) return '';
  const clk = p => g.league === 'mlb' ? `${p.period?.type === 'Bottom' ? 'B' : 'T'}${p.period?.number}` : g.league === 'nba' ? `${nbaPer(p.period?.number)} ${p.clock?.displayValue || ''}`
    : g.league === 'nhl' ? nhlClk(g, p) : `Q${p.period?.number} ${p.clock?.displayValue || ''}`;
  return `<div class="box"><h3>Latest plays <span class="sub">new plays appear automatically</span></h3><ul class="plays">${ps.map(p => playRow(g, p, clk(p))).join('')}</ul></div>`;
}
function quickCompare(g){
  const [a, h] = orderedTeams(g);
  if (!a || !h) return '';
  const want = { nba:['fieldGoalPct', 'threePointFieldGoalPct', 'totalRebounds', 'assists', 'totalTurnovers', 'pointsInPaint', 'fastBreakPoints'],
                 nfl:['totalYards', 'netPassingYards', 'rushingYards', 'thirdDownEff', 'turnovers', 'possessionTime', 'totalPenaltiesYards'],
                 nhl:['shotsTotal', 'powerPlayGoals', 'powerPlayOpportunities', 'faceoffPercent', 'hits', 'blockedShots', 'takeaways', 'giveaways', 'penaltyMinutes'] }[g.league];
  if (!want) return '';
  const rows = want.map(n => {
    const sa = (a.statistics || []).find(s => s.name === n), sh = (h.statistics || []).find(s => s.name === n);
    return sa ? cmpRow(sa.label, sa.displayValue, sh?.displayValue ?? '', { lowerBetter:/turnover|penalt|giveaway/i.test(n), noBar:n === 'possessionTime' }) : '';
  }).join('');
  return rows ? `<div class="box"><h3>Key stats</h3>${cmpHead(g)}<div class="cmp" style="--ac:${g.ac};--hc:${g.hc}">${rows}</div></div>` : '';
}

/* NFL field */
function nflField(g){
  const d = g.s.drives || {};
  const cur = d.current;
  const lastPlay = cur?.plays?.[cur.plays.length - 1];
  const sit = view.sit || {};
  const possText = sit.possessionText || lastPlay?.end?.possessionText || '';
  const ddText = sit.downDistanceText || lastPlay?.end?.downDistanceText || '';
  const possId = sit.possession || lastPlay?.end?.team?.id || cur?.team?.id;
  const distance = sit.distance ?? lastPlay?.end?.distance;
  const awayAbbr = g.away?.team?.abbreviation;
  // Absolute yard from the away team's goal line (left) to home goal line (right).
  let abs = null;
  const m = possText.match(/^([A-Z]+)\s+(\d+)$/);
  if (m) abs = m[1] === awayAbbr ? Number(m[2]) : 100 - Number(m[2]);
  else if (/^50$|^\s*50\s*$/.test(possText.trim())) abs = 50;
  const offAway = String(possId) === String(g.away?.team?.id);
  const dir = offAway ? 1 : -1;
  const offense = g.byId(possId);
  const W = 120, U = 6; // 120 yards incl. end zones, scale factor
  const X = y => (10 + y) * U;
  let marks = '';
  if (abs != null) {
    const fd = distance != null ? Math.max(0, Math.min(100, abs + dir * distance)) : null;
    if (fd != null && /&/.test(ddText)) marks += `<line x1="${X(fd)}" x2="${X(fd)}" y1="0" y2="160" stroke="#f5d90a" stroke-width="3"/>`;
    marks += `<line x1="${X(abs)}" x2="${X(abs)}" y1="0" y2="160" stroke="#3b82f6" stroke-width="3"/>`;
    marks += `<g transform="translate(${X(abs)},80)"><ellipse rx="11" ry="7" fill="#8b4513" stroke="#fff" stroke-width="1.5"/><path d="M${dir*16},0 l${-dir*6},-5 v10z" fill="#fff"/></g>`;
  }
  let lines = '';
  for (let y = 0; y <= 100; y += 5) lines += `<line x1="${X(y)}" x2="${X(y)}" y1="0" y2="160" stroke="var(--field-line)" stroke-width="${y % 10 === 0 ? 1.5 : .7}"/>`;
  let labels = '';
  for (let y = 10; y < 100; y += 10) labels += `<text x="${X(y)}" y="150" text-anchor="middle" font-size="12" fill="rgba(255,255,255,.75)" font-weight="700">${y <= 50 ? y : 100 - y}</text>`;
  const ezA = `<rect x="0" y="0" width="${10*U}" height="160" fill="${g.ac}" opacity=".85"/><text x="${5*U}" y="80" transform="rotate(-90 ${5*U} 80)" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="800" font-size="16">${esc(awayAbbr)}</text>`;
  const ezH = `<rect x="${110*U}" y="0" width="${10*U}" height="160" fill="${g.hc}" opacity=".85"/><text x="${115*U}" y="80" transform="rotate(90 ${115*U} 80)" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="800" font-size="16">${esc(g.home?.team?.abbreviation)}</text>`;
  const lp = sit.lastPlay?.text || lastPlay?.text || '';
  return `<div class="box"><div class="situ" style="justify-content:space-between;margin-bottom:10px">
      <div><div class="bigtxt">${esc(ddText || 'Between plays')}</div><div class="small">${offense ? `${esc(offense.team?.displayName)} ball${sit.isRedZone ? ' · Red zone' : ''}` : ''}${cur?.description ? ` · Drive: ${esc(cur.description)}` : ''}</div></div>
      <div class="small">Timeouts: ${esc(awayAbbr)} ${esc(sit.awayTimeouts ?? '–')} · ${esc(g.home?.team?.abbreviation)} ${esc(sit.homeTimeouts ?? '–')}</div></div>
    <svg viewBox="0 0 ${W*U} 160" width="100%" style="display:block;border-radius:8px;background:var(--field)" role="img" aria-label="Field position: ${esc(possText)}">
      ${ezA}${ezH}${lines}${labels}${marks}</svg>
    <div class="legend"><span><i style="background:#3b82f6"></i>Line of scrimmage</span><span><i style="background:#f5d90a"></i>First down</span></div>
    ${lp ? `<div class="lastplay" style="margin-top:12px"><span class="lbl">Last play</span>${esc(lp)}</div>` : ''}</div>`;
}

/* MLB diamond + strike zone */
function mlbDiamond(g){
  const plays = g.s.plays || [];
  const sit = view.sit || {};
  const pitches = plays.filter(p => p.summaryType === 'P');
  const lastPitch = pitches[pitches.length - 1];
  const abId = sit.lastPlay?.atBatId || lastPitch?.atBatId;
  const abPitches = pitches.filter(p => p.atBatId === abId);
  const balls = sit.balls ?? lastPitch?.resultCount?.balls ?? 0;
  const strikes = sit.strikes ?? lastPitch?.resultCount?.strikes ?? 0;
  const outs = sit.outs ?? plays[plays.length - 1]?.outs ?? 0;
  const on = [sit.onFirst, sit.onSecond, sit.onThird].map(Boolean);
  const startAB = [...plays].reverse().find(p => p.type?.type === 'start-batterpitcher');
  const batter = sit.batter?.athlete?.displayName, pitcher = sit.pitcher?.athlete?.displayName;
  const matchup = batter && pitcher ? `${batter} vs. ${pitcher}` : (startAB?.text || '');
  const dots = (n, max) => `<span class="dots">${Array.from({ length:max }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
  const base = (x, y, lit) => `<rect x="${x-13}" y="${y-13}" width="26" height="26" transform="rotate(45 ${x} ${y})" fill="${lit ? 'var(--accent)' : 'none'}" stroke="var(--muted)" stroke-width="2"/>`;
  const diamond = `<svg viewBox="0 0 140 120" width="140" height="120" role="img" aria-label="Runners on base">
    ${base(70, 22, on[1])}${base(112, 64, on[0])}${base(28, 64, on[2])}<path d="M62 98h16v8l-8 8-8-8z" fill="var(--muted)"/></svg>`;
  // Strike zone: ESPN pitch coordinates, zone approx x 85–145, y 145–200
  const zx = x => (x - 20) * 1.1, zy = y => (y - 80) * 1.1;
  const color = t => /ball/.test(t) ? '#3b82f6' : /strike|foul/.test(t) ? '#e11d48' : '#16a34a';
  const pts = abPitches.filter(p => p.pitchCoordinate).map((p, i) =>
    `<g><circle cx="${zx(p.pitchCoordinate.x).toFixed(1)}" cy="${zy(p.pitchCoordinate.y).toFixed(1)}" r="9" fill="${color(p.type?.type || '')}" opacity=".9"/><text x="${zx(p.pitchCoordinate.x).toFixed(1)}" y="${zy(p.pitchCoordinate.y).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#fff" font-weight="700">${i+1}</text></g>`).join('');
  const zone = `<svg viewBox="0 0 190 200" width="190" height="200" role="img" aria-label="Pitch locations for the current at-bat">
    <rect x="${zx(85)}" y="${zy(145)}" width="${66}" height="${60.5}" fill="none" stroke="var(--zone)" stroke-width="2"/>${pts}</svg>`;
  const list = abPitches.map((p, i) => `<li>${i+1}. ${esc(p.type?.text)}${p.pitchType?.text ? ` · ${esc(p.pitchType.text)}` : ''}${p.pitchVelocity ? ` ${esc(p.pitchVelocity)} mph` : ''}</li>`).join('');
  const lp = [...plays].reverse().find(p => p.type?.type === 'play-result');
  return `<div class="box"><h3>${esc(g.comp.status?.type?.detail || '')}</h3>
    <div class="situ">${diamond}
      <div><div class="count"><span>B ${dots(balls, 4)}</span><span>S ${dots(strikes, 3)}</span><span>O ${dots(outs, 3)}</span></div>
      <div style="margin-top:8px;font-weight:600">${esc(matchup)}</div>
      ${lp ? `<div class="lastplay" style="margin-top:8px"><span class="lbl">Last play</span>${esc(lp.text)}</div>` : ''}</div>
      ${abPitches.length ? `<div style="display:flex;gap:12px;align-items:flex-start">${zone}<ol class="pitchlist" style="list-style:none;padding:0">${list}</ol></div>` : ''}
    </div>
    <div class="legend"><span><i style="background:#3b82f6"></i>Ball</span><span><i style="background:#e11d48"></i>Strike / foul</span><span><i style="background:#16a34a"></i>In play</span></div></div>`;
}

/* NBA live + shot chart */
function nbaLive(g){
  const plays = g.s.plays || [];
  const last = plays[plays.length - 1];
  if (!last) return '';
  // Current run: consecutive points by one team
  let run = { team:null, pts:0, opp:0 };
  for (let i = plays.length - 1; i >= 0; i--) {
    const p = plays[i];
    if (!p.scoringPlay) continue;
    if (!run.team) run.team = p.team?.id;
    if (p.team?.id === run.team) run.pts += p.scoreValue || 0; else break;
  }
  const runTeam = g.byId(run.team);
  return `<div class="box"><div class="lastplay"><span class="lbl">Last play · ${esc(nbaPer(last.period?.number))} ${esc(last.clock?.displayValue || '')}</span>${esc(last.text)}</div>
    ${run.pts >= 6 ? `<div class="small" style="margin-top:8px"><b>${esc(runTeam?.team?.abbreviation)}</b> on a ${run.pts}–0 run</div>` : ''}</div>`;
}
function nbaShots(g){

// ESPN rink coordinates are feet from center ice (x −100…100, goal lines at ±89; y −42.5…42.5).
// Every attempt is flipped onto one half so both teams shoot at the same net.
function nhlShots(g){
  const kinds = /^(Shot|Goal|Missed)$/;
  const all = (g.s.plays || []).filter(p => kinds.test(p.type?.text || '') && p.coordinate && Math.abs(p.coordinate.x) <= 100 && Math.abs(p.coordinate.y) <= 43 && !isShootout(p));
  if (!all.length) return '';
  const periods = [...new Set(all.map(p => p.period?.number))].filter(Boolean);
  const shots = all.filter(p => (view.period === 'all' || String(p.period?.number) === String(view.period)) && (view.shotTeam === 'all' || String(p.team?.id) === view.shotTeam));
  const S = 6, X = x => (x - 25) * S, Y = y => (42.5 - y) * S; // shows x 25…100 (blue line to end boards)
  const by = [g.away, g.home].map(c => ({ id:String(c?.team?.id), abbr:c?.team?.abbreviation, col:c === g.home ? g.hc : g.ac }));
  const colOf = id => by.find(b => b.id === String(id))?.col || 'var(--muted)';
  const goals = shots.filter(p => p.type?.text === 'Goal').length, onNet = shots.filter(p => p.type?.text !== 'Missed').length;
  const dots = shots.map(p => {
    const flip = p.coordinate.x < 0 ? -1 : 1, x = p.coordinate.x * flip, y = p.coordinate.y * flip;
    const c = colOf(p.team?.id), kind = p.type?.text;
    const mark = kind === 'Goal' ? `<circle cx="${X(x)}" cy="${Y(y)}" r="7" fill="${c}" stroke="var(--text)" stroke-width="1.5"/>`
      : kind === 'Missed' ? `<path d="M${X(x)-4},${Y(y)-4}l8,8m0,-8l-8,8" stroke="${c}" stroke-width="2" fill="none"/>`
      : `<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="none" stroke="${c}" stroke-width="2"/>`;
    return `<g><title>${esc(p.text)}</title>${mark}</g>`;
  }).join('');
  const rink = `<path d="M0,0 H${X(72)} A${28*S},${28*S} 0 0 1 ${X(100)},${Y(14.5)} V${Y(-14.5)} A${28*S},${28*S} 0 0 1 ${X(72)},${Y(-42.5)} H0" fill="none" stroke="var(--border)" stroke-width="2"/>
    <line x1="${X(25)}" x2="${X(25)}" y1="0" y2="${Y(-42.5)}" stroke="#3b82f6" stroke-width="4" opacity=".6"/>
    <line x1="${X(89)}" x2="${X(89)}" y1="${Y(38)}" y2="${Y(-38)}" stroke="#e11d48" stroke-width="2" opacity=".6"/>
    <path d="M${X(89)},${Y(4)} a${6*S},${4*S} 0 0 0 0,${8*S}" fill="#3b82f6" opacity=".15" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="${X(89)}" y="${Y(3)}" width="${3.3*S}" height="${6*S}" fill="none" stroke="var(--text)" stroke-width="2"/>
    ${[22, -22].map(y => `<circle cx="${X(69)}" cy="${Y(y)}" r="${15*S}" fill="none" stroke="#e11d48" stroke-width="1.5" opacity=".45"/><circle cx="${X(69)}" cy="${Y(y)}" r="4" fill="#e11d48" opacity=".6"/>`).join('')}`;
  return `<div class="box"><h3>Shot chart <span class="sub">${goals} goal${goals === 1 ? '' : 's'} · ${onNet} on net · ${shots.length} attempts</span></h3>
    <div class="pchips"><button class="chip" data-shot="all" aria-pressed="${view.shotTeam==='all'}">Both</button>${by.map(b => `<button class="chip" data-shot="${esc(b.id)}" aria-pressed="${view.shotTeam===b.id}"><span class="sw" style="background:${b.col}"></span>${esc(b.abbr)}</button>`).join('')}</div>
    ${periodChips(periods, nhlPerName)}
    <svg viewBox="0 0 ${75*S} ${85*S}" width="100%" style="max-width:420px;display:block;margin:0 auto" role="img" aria-label="Shot chart">${rink}${dots}</svg>
    <div class="legend"><span>● filled: goal</span><span>○ saved</span><span>× missed the net</span><span>Blocked shots aren't shown</span></div></div>`;
}

function pseudoTeam(info, league){
  return { key:'t' + info.id, label:info.shortDisplayName || info.name, league, sport:SPORT[league], abbr:(info.abbreviation || '').toLowerCase(),
           color:hexColor(info.color) || 'var(--accent)', id:String(info.id) };

async function loadTeamSchedule(base){
  const t = pseudoTeam(tview.info, tview.league);
  const q = tview.season ? `&season=${tview.season}` : '';
  const res = await Promise.allSettled([2, 3].map(st => getJSON(`${base}/schedule?seasontype=${st}${q}`)));
  const events = new Map();
  let year = null, ok = false;
  res.forEach((r, i) => {
    if (r.status !== 'fulfilled') return;
    ok = true;
    year ||= r.value.requestedSeason?.year || r.value.season?.year;
    (r.value.events || []).forEach(e => { const g = norm(e, t); g.postseason = i === 1; events.set(e.id, g); });
  });
  if (!ok) throw new Error('schedule unavailable');
  if (!tview.season || tview.season === tview.schedCurrent) {
    try {
      const sb = await leagueScoreboard(t);
      for (const e of sb.events || []) if (events.has(e.id)) { const g = norm(e, t); g.postseason = events.get(e.id).postseason; events.set(e.id, g); }
    } catch {}
  }
  tview.schedCurrent ||= year;
  tview.season ||= year;
  tview.sched = [...events.values()].sort((a, b) => a.date - b.date);
  const now = Date.now();
  await refineBay(tview.sched.filter(g => g.state === 'pre' && g.date - now < 8*24*H));
}
async function loadTeamStats(base){
  const want = tview.statSeason;
  const get = async (y) => {
    const q = `?seasontype=${tview.stype}` + (y ? `&season=${y}` : '');
    const [st, pl, sc] = await Promise.all([getJSON(`${base}/statistics${q}`), getJSON(`${base}/athletes/statistics${q}`),
      tview.league === 'nba' ? getJSON(`${base}/schedule${q}`).catch(() => null) : null]);
    let pf = 0, pa = 0, n = 0, lastGame = null;
    for (const e of sc?.events || []) {
      const c = e.competitions?.[0];
      if (!c?.status?.type?.completed) continue;
      const me = (c.competitors || []).find(x => String(x.team?.id) === String(tview.id));
      const op = (c.competitors || []).find(x => x !== me);
      const a = num(scoreOf(me?.score)), b = num(scoreOf(op?.score));
      if (a == null || b == null) continue;
      pf += a; pa += b; n++;
      const dt = new Date(e.date);
      if (!lastGame || dt > lastGame) lastGame = dt;
    }
    st.pointsPerGame = n ? { pf:pf / n, pa:pa / n } : null;
    st.lastGame = lastGame;
    const hasPlayers = (pl.results || []).some(c => (c.leaders || []).length);
    return { st, pl, hasPlayers, year:pl.requestedSeason?.year || st.requestedSeason?.year || y };
  };
  let d = await get(want);
  if (!want) tview.statCurrent ||= d.year;
  tview.note = '';
  if (!d.hasPlayers && !tview.statSeason && d.year) {
    const prev = await get(d.year - 1).catch(() => null);
    if (prev?.hasPlayers) { tview.note = `The ${seasonLabel(tview.league, d.year)} season hasn't started, so this shows ${seasonLabel(tview.league, prev.year)}.`; d = prev; }
  }
  tview.statCurrent ||= d.year;
  tview.statSeason = d.year;
  tview.stats = d.st;
  tview.players = d.pl;
  tview.nba = null;
  if (tview.league === 'nba' && tview.stype === 2) {
    try { tview.nba = await nbaLeague(d.year); } catch { tview.nba = null; }
    if (tview.rmode === 'last10') loadLast10();
  }
  const cats = (d.pl.results || []).filter(c => (c.leaders || []).length).map(c => c.name);
  if (!cats.includes(tview.cat)) { tview.cat = cats[0] || null; tview.sort = null; }
}

/* Team stats */
function statIndex(cats){
  const ix = {};
  for (const c of cats || []) for (const s of c.stats || []) (ix[c.name] ||= {})[s.name] = s;
  return ix;
}
function teamTiles(){
  const r = tview.stats?.results || {};
  const S = statIndex(r.stats?.categories), O = statIndex(r.opponent);
  const pp = tview.stats?.pointsPerGame;
  const v = (ix, c, n) => ix[c]?.[n]?.value;
  const d = (ix, c, n) => ix[c]?.[n]?.displayValue;
  const fix = (x, n=1) => x == null || !isFinite(x) ? null : x.toFixed(n);
  const L = tview.league, tiles = [];
  const add = (label, value, tip='') => { if (value != null && value !== '') tiles.push({ label, value, tip }); };
  if (L === 'nba') {
    const o = S.offensive || {};
    const tot = n => o[n]?.value;
    const poss = tot('fieldGoalsAttempted') + 0.44 * tot('freeThrowsAttempted') - tot('offensiveRebounds') + tot('turnovers');
    add('Points / game', d(S, 'offensive', 'avgPoints'));
    if (pp) { add('Allowed / game', fix(pp.pa)); add('Point diff / game', (pp.pf - pp.pa >= 0 ? '+' : '') + fix(pp.pf - pp.pa)); }
    add('Offensive rating', fix(100 * tot('points') / poss), 'Points per 100 possessions (estimated from season totals)');
    add('True shooting %', fix(100 * tot('points') / (2 * (tot('fieldGoalsAttempted') + 0.44 * tot('freeThrowsAttempted')))));
    add('eFG%', fix(100 * (tot('fieldGoalsMade') + 0.5 * tot('threePointFieldGoalsMade')) / tot('fieldGoalsAttempted')));
    add('3P%', d(S, 'offensive', 'threePointFieldGoalPct'));
    add('3PA / game', d(S, 'offensive', 'avgThreePointFieldGoalsAttempted'));
    add('Assists / game', d(S, 'offensive', 'avgAssists'));
    add('Rebounds / game', d(S, 'general', 'avgRebounds'));
    add('Turnover %', fix(100 * tot('turnovers') / poss), 'Turnovers per 100 possessions');
    add('AST/TO', d(S, 'general', 'assistTurnoverRatio'));
  } else if (L === 'nfl') {
    const gp = v(S, 'passing', 'teamGamesPlayed') || v(S, 'general', 'gamesPlayed');
    add('Points / game', d(S, 'scoring', 'totalPointsPerGame'));
    add('Allowed / game', d(O, 'scoring', 'totalPointsPerGame'));
    add('Yards / game', fix(v(S, 'rushing', 'totalYards') / gp));
    add('Allowed yds / game', fix(v(O, 'rushing', 'totalYards') / gp));
    add('Yards / play', fix(v(S, 'rushing', 'totalYards') / v(S, 'rushing', 'totalOffensivePlays'), 2));
    add('Allowed yds / play', fix(v(O, 'rushing', 'totalYards') / v(O, 'rushing', 'totalOffensivePlays'), 2));
    add('3rd down %', fix(v(S, 'miscellaneous', 'thirdDownConvPct')));
    add('Red zone TD %', fix(v(S, 'miscellaneous', 'redzoneTouchdownPct')));
    add('Turnover margin', d(S, 'miscellaneous', 'turnOverDifferential'));
    add('Sacks / allowed', v(S, 'defensive', 'sacks') != null ? `${d(S, 'defensive', 'sacks')} / ${d(S, 'passing', 'sacks')}` : null);
  } else if (L === 'nhl') {
    const gp = v(S, 'general', 'games');
    const gf = v(S, 'offensive', 'goals'), ga = v(S, 'defensive', 'goalsAgainst');
    add('Goals / game', fix(gf / gp, 2));
    add('Allowed / game', d(S, 'defensive', 'avgGoalsAgainst'));
    add('Goal diff', gf != null && ga != null ? (gf - ga > 0 ? '+' : '') + (gf - ga) : null);
    add('Shots / game', fix(v(S, 'offensive', 'shotsTotal') / gp, 1));
    add('Shots against / game', fix(v(S, 'defensive', 'shotsAgainst') / gp, 1));
    add('Shooting %', d(S, 'offensive', 'shootingPct'));
    add('Save %', d(S, 'defensive', 'savePct'));
    add('PDO', fix(v(S, 'offensive', 'shootingPct') + 100 * v(S, 'defensive', 'savePct'), 1), 'Shooting % + save %: around 100 is normal, far above or below usually evens out');
    add('Power-play goals', d(S, 'offensive', 'powerPlayGoals'));
    add('Faceoff %', d(S, 'offensive', 'faceoffPercent'));
    add('PIM / game', fix(v(S, 'penalties', 'penaltyMinutes') / gp, 1));
  } else {
    const g = v(S, 'batting', 'teamGamesPlayed');
    add('Runs / game', fix(v(S, 'batting', 'runs') / g, 2));
    add('Allowed / game', fix(v(S, 'pitching', 'runs') / g, 2));
    add('AVG / OBP / SLG', [d(S, 'batting', 'avg'), d(S, 'batting', 'onBasePct'), d(S, 'batting', 'slugAvg')].every(Boolean) ? `${d(S, 'batting', 'avg')} / ${d(S, 'batting', 'onBasePct')} / ${d(S, 'batting', 'slugAvg')}` : null);
    add('OPS', d(S, 'batting', 'OPS'));
    add('Home runs', d(S, 'batting', 'homeRuns'));
    add('Stolen bases', d(S, 'batting', 'stolenBases'));
    add('ERA', d(S, 'pitching', 'ERA'));
    add('WHIP', d(S, 'pitching', 'WHIP'));
    add('K / 9', d(S, 'pitching', 'strikeoutsPerNineInnings'));
    add('Fielding %', d(S, 'fielding', 'fieldingPct'));
  }
  return tiles;
}

function playerRows(cat){

function playerColumns(cat, rows){
  const L = tview.league;
  if (tview.allCols) {
    const seen = new Map();
    rows.forEach(r => Object.values(r.vals).forEach(s => { if (!seen.has(s.name) && !/^(isQualified|teamGamesPlayed)$/.test(s.name)) seen.set(s.name, { key:s.name, label:s.abbreviation || s.shortDisplayName || s.name, tip:s.displayName || s.description || '' }); }));
    return [...seen.values()];
  }
  const spec = PLAYER_COLS[L]?.[cat.name];
  if (!spec) { tview.allCols = true; return playerColumns(cat, rows); }
  return spec.map(x => {
    const [k, label] = x.split(':');
    if (k.startsWith('=')) { const d = DERIVED[k.slice(1)]; return { key:k, label, tip:d.tip, derived:d }; }
    const any = rows.find(r => r.vals[k]);
    return any ? { key:k, label:label || any.vals[k].abbreviation, tip:any.vals[k].displayName || '' } : null;

}
function cellValue(r, c){

    if (!c.derived.need.every(n => r.vals[n])) return { v:null, d:'–' };
    const s = Object.fromEntries(c.derived.need.map(n => [n, r.vals[n].value]));
    const v = c.derived.f(s);
    return isFinite(v) ? { v, d:c.derived.fmt(v) } : { v:null, d:'–' };
  }
  const s = r.vals[c.key];
  return s ? { v:typeof s.value === 'number' ? s.value : num(s.displayValue), d:s.displayValue } : { v:null, d:'–' };
}
function renderPlayerStats(){
  const cats = (tview.players?.results || []).filter(c => (c.leaders || []).length);

  }

  const sorted = [...rows].sort((a, b) => {

    const c = cols.find(x => x.key === key);

    if (va == null && vb == null) return 0;
    if (va == null) return 1;
    if (vb == null) return -1;
    return dir === 'asc' ? va - vb : vb - va;
  });
  const arrow = k => k === key ? (dir === 'asc' ? ' ▲' : ' ▼') : '';

  const body = sorted.map(r => `<tr><td class="pl">${esc(r.short)}<span class="pos">${esc(r.pos)}</span></td>${cols.map(c => `<td class="${c.key === key ? 'sorted' : ''}">${esc(cellValue(r, c).d)}</td>`).join('')}</tr>`).join('');
  const chips = cats.length > 1 ? `<div class="pchips">${cats.map(c => `<button class="chip" data-cat="${esc(c.name)}" aria-pressed="${c.name === cat.name}">${esc(CAT_LABEL[c.name] || c.displayName)}</button>`).join('')}</div>` : '';
  const derivedUsed = cols.filter(c => c.derived);
  return `<div class="box"><h3>Individual <span class="sub">tap a column to sort</span></h3>${chips}
    <div class="toolbar" style="margin:0 0 8px"><label class="small"><input type="checkbox" data-allcols ${tview.allCols ? 'checked' : ''}> Show every stat</label></div>
    <div class="tablewrap"><table class="ptable"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    ${derivedUsed.length ? `<div class="note">${derivedUsed.map(c => `${esc(c.label)}: ${esc(c.derived.tip)}`).join(' · ')}. Calculated from season totals.</div>` : ''}</div>`;
}
