<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cleveland Sports</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CLE Sports">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
:root{
  --bg:#f6f5f2;--surface:#ffffff;--surface-2:#f0eee9;--border:#e2dfd8;--text:#1b1a18;--muted:#6b675f;--faint:#9a958b;
  --accent:#e4572e;--live:#d7263d;--good:#1f8a4c;--warn:#b45309;--focus:#2563eb;
  --cavs:#860038;--browns:#ff3c00;--guardians:#00385d;
  --warriors:#1d428a;--niners:#aa0000;--sharks:#006d75;--giants:#e3521b;--athletics:#0f5a3c;--raiders:#5d6166;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --field:#2f7d3a;--field-line:rgba(255,255,255,.55);--zone:#1b1a18;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212;--surface:#1c1c1e;--surface-2:#26262a;--border:#333338;--text:#f1efe9;--muted:#a7a39a;--faint:#77746d;
  --accent:#ff7a50;--live:#ff4d61;--good:#4cc27e;--warn:#f5a524;--focus:#7aa2ff;
  --cavs:#c23a6e;--browns:#ff6a33;--guardians:#4d8fc4;
  --warriors:#5b8ee6;--niners:#e0484d;--sharks:#2bb3bd;--giants:#fd7a45;--athletics:#3aa874;--raiders:#a5acaf;
  --shadow:none;--field:#24612d;--zone:#f1efe9;
}}
:root[data-theme="dark"]{
  --bg:#121212;--surface:#1c1c1e;--surface-2:#26262a;--border:#333338;--text:#f1efe9;--muted:#a7a39a;--faint:#77746d;
  --accent:#ff7a50;--live:#ff4d61;--good:#4cc27e;--warn:#f5a524;--focus:#7aa2ff;
  --cavs:#c23a6e;--browns:#ff6a33;--guardians:#4d8fc4;
  --warriors:#5b8ee6;--niners:#e0484d;--sharks:#2bb3bd;--giants:#fd7a45;--athletics:#3aa874;--raiders:#a5acaf;
  --shadow:none;--field:#24612d;--zone:#f1efe9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.num,table td,table th{font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 48px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:12px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand select{font:inherit;font-weight:800;font-size:18px;letter-spacing:-.01em;color:var(--text);background:transparent;border:none;padding:2px 22px 2px 0;cursor:pointer;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.brand select option{color:#000;font-size:15px;font-weight:600}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--cavs),var(--browns) 50%,var(--guardians))}
.spacer{flex:1}
.updated{color:var(--faint);font-size:12px;white-space:nowrap}
.iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .sw{width:8px;height:8px;border-radius:50%}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec .count{color:var(--faint);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:block;position:relative;overflow:hidden;text-decoration:none}
.card:hover{border-color:var(--faint)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px;gap:8px}
.card .meta .lg{font-weight:700;letter-spacing:.06em}
.status-live{color:var(--live);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.status-live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status-live::before{animation:none}}
.trow{display:flex;align-items:center;gap:10px;padding:3px 0}
.trow img,.logo{width:26px;height:26px;object-fit:contain;flex:none}
.trow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .rec{color:var(--faint);font-size:12px;margin-left:4px}
.trow .sc{font-weight:700;font-size:18px;min-width:2ch;text-align:right}
.trow.lose{color:var(--muted)}
.trow.win .nm{font-weight:700}
.card .foot{font-size:12px;color:var(--faint);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bay{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px 3px 8px;margin-top:8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bay svg{width:14px;height:14px;flex:none}
.bay.yes{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.bay.maybe{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bay.no,.bay.none{background:var(--surface-2);color:var(--muted)}
.baynote{font-size:12px;color:var(--muted);margin-top:6px}
.baynote a{color:inherit}
.empty{color:var(--faint);font-size:14px;padding:14px;border:1px dashed var(--border);border-radius:12px}
.err{background:color-mix(in srgb,var(--live) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--live) 40%,var(--border));color:var(--text);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.loading{color:var(--faint);padding:40px 0;text-align:center}

/* Game view */
.back{display:inline-flex;align-items:center;gap:6px;margin:16px 0 8px;text-decoration:none;color:var(--muted);font-size:14px}
.score-hero{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.hero-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.hteam{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.hteam img{width:56px;height:56px;object-fit:contain}
.hteam .tn{font-weight:700;font-size:15px}
.hteam .tr{font-size:12px;color:var(--faint)}
.hteam .ts{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em}
.hteam.lose .ts{color:var(--muted)}
.hteam .poss{font-size:11px;color:var(--accent);font-weight:700;min-height:14px}
.hmid{text-align:center;font-size:13px;color:var(--muted);max-width:150px}
.hmid .st{font-weight:700;color:var(--text);font-size:15px}
.hero-foot{text-align:center;color:var(--faint);font-size:12px;margin-top:10px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface-2)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1}
tbody tr{background:var(--surface)}
thead tr{background:var(--surface-2)}
tr.total td{font-weight:700;background:var(--surface-2)}
tr.divider td{background:var(--surface-2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left}
td .pos{color:var(--faint);font-size:11px;margin-left:4px}
td .dnp{color:var(--faint);font-style:italic}
td.pl{max-width:170px;overflow:hidden;text-overflow:ellipsis}
.line{margin-top:12px}
.line td:first-child,.line th:first-child{min-width:64px}
.tabs{display:flex;gap:4px;margin:18px 0 12px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{background:none;border:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.panel{display:grid;gap:16px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.box h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.box h3 .sub{font-weight:500;color:var(--faint);font-size:12px}
.teamhead{display:flex;align-items:center;gap:10px;margin:8px 0 10px;font-weight:700;font-size:16px}
.grp-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;align-items:center;font-size:13px}
.cmp .lbl{text-align:center;color:var(--muted);font-size:12px;grid-column:2}
.cmp .v{font-weight:700}
.cmp .va{text-align:right}
.cmp .bar{grid-column:1 / -1;display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--surface-2);margin-bottom:6px}
.cmp .bar span{display:block;height:100%}
.cmp-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:10px;font-weight:700}
.cmp-head > :last-child{justify-self:end}
.note{font-size:12px;color:var(--faint);margin-top:8px}
.plays{list-style:none;margin:0;padding:0}
.plays li{display:grid;grid-template-columns:auto 22px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.plays li:last-child{border-bottom:none}
.plays .clk{color:var(--faint);font-size:12px;min-width:44px;padding-top:2px}
.plays img{width:20px;height:20px;object-fit:contain;margin-top:1px}
.plays .scr{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
.plays li.scoring .txt{font-weight:600}
.plays li.scoring .scr{color:var(--text);font-weight:700}
.plays .dd{display:block;font-size:12px;color:var(--faint)}
details.drive{border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:8px}
details.drive>summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center}
details.drive>summary::-webkit-details-marker{display:none}
details.drive>summary .res{font-weight:700}
details.drive>summary .ds{font-size:12px;color:var(--faint)}
details.drive .plays{padding:0 12px 6px}
details.drive.score>summary .res{color:var(--good)}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pchips .chip{padding:3px 10px;font-size:12px}
.half{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px;font-weight:700}
details.ab>summary{cursor:pointer;list-style:none}
details.ab>summary::-webkit-details-marker{display:none}
.pitchlist{font-size:12px;color:var(--muted);margin:4px 0 0;padding-left:18px}
.situ{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.bigtxt{font-size:20px;font-weight:800}
.lastplay{font-size:15px}
.lastplay .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);display:block;margin-bottom:2px}
.count{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.count b{color:var(--text);font-size:18px}
.dots{display:inline-flex;gap:4px;vertical-align:middle;margin-left:4px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.leaders{display:grid;gap:8px}
.leader{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px}
.leader .cat{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.leader .who{font-weight:600}
.leader img.hs{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
svg text{font-family:inherit}
.small{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.tlink{color:inherit;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;border-radius:6px}
.tlink:hover{text-decoration:underline;text-underline-offset:3px}
.trow .tlink{flex:none;padding:2px;margin:-2px}
.trow .tlink:hover img{transform:scale(1.12)}
.trow img{transition:transform .12s}
.team-hero{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-left:6px solid var(--tc);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.team-hero .tlogo{width:56px;height:56px;object-fit:contain}
.team-hero .tname{font-size:20px;font-weight:800;letter-spacing:-.01em}
a.tab{text-decoration:none;display:inline-block}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 4px}
.seasonsel select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 8px;margin-left:6px}
.slist{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.srow{display:grid;grid-template-columns:110px 1fr auto;gap:4px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);text-decoration:none}
.srow:last-child{border-bottom:none}
.srow:hover{background:var(--surface-2)}
.sdate{font-size:13px;color:var(--muted)}
.ptag{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--accent)}
.sopp{display:flex;align-items:center;gap:8px;min-width:0}
.sopp .vs{color:var(--faint);font-size:12px;width:18px}
.sopp .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sres{text-align:right;white-space:nowrap}
.sbay{grid-column:2 / -1}
.sbay .bay{margin-top:0}
.wl{font-weight:800}
.wl.W{color:var(--good)} .wl.L{color:var(--live)}
@media (max-width:520px){.srow{grid-template-columns:76px 1fr auto}.sdate{font-size:12px}}
details.acc>summary{grid-template-columns:1fr auto}
.ratehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tile.ranked{position:relative;padding-bottom:22px}
.tile .rk{position:absolute;right:10px;bottom:7px;font-size:12px;font-weight:700;color:var(--muted)}
.tile .rk.top{color:var(--good)}
.tile .rk.bottom{color:var(--live)}
.livebar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 6px;margin:12px auto 0;padding:6px 12px;border-radius:999px;font-size:12px;color:var(--muted);background:var(--surface-2);width:fit-content;max-width:100%;text-align:center}
.livebar b{color:var(--live)}
.livebar .dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
.livebar.stale b{color:var(--warn)}
.livebar.stale .dot{background:var(--warn);animation:none}
.livebar .ago{font-variant-numeric:tabular-nums}
.plays li.new{animation:newplay 3s ease-out}
@keyframes newplay{0%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.plays li.new{animation:none;background:color-mix(in srgb,var(--accent) 10%,transparent)}.livebar .dot{animation:none}}
table.stand td.pl{max-width:none;min-width:150px}
table.stand .tcell{display:flex;align-items:center;gap:6px}
table.stand td.pl .tlink{gap:8px}
table.stand td.pl .logo{width:20px;height:20px}
table.stand tr.me td{background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-weight:700}
table.stand tr.cut td{border-bottom:2px dashed var(--muted)}
.seed{display:inline-block;width:18px;color:var(--faint);font-size:12px;text-align:right}
sup.clinch{font-size:10px;color:var(--muted);font-weight:700}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:16px 0 4px}
.qteam{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 10px;background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--tc);border-radius:12px;box-shadow:var(--shadow);text-decoration:none;text-align:center}
.qteam:hover{border-color:var(--faint);border-top-color:var(--tc)}
.qteam img{width:44px;height:44px;object-fit:contain;transition:transform .12s}
.qteam:hover img{transform:scale(1.08)}
.qteam .qname{font-weight:700;font-size:14px}
.qteam .qlg{font-size:11px;color:var(--faint);letter-spacing:.06em;font-weight:600}
:root[data-theme="light"] .qteam picture source{display:none}
.newslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.news{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow)}
.news:hover{border-color:var(--faint)}
.nthumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-2);display:block;border-bottom:3px solid var(--tc)}
.nthumb.ph{display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--tc) 22%,var(--surface-2));color:var(--muted);font-weight:800;font-size:18px}
.nbody{min-width:0;padding:10px 12px 12px}
.latest{margin-top:4px}
.lrow{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border);text-decoration:none}
.lrow:first-of-type{border-top:none}
.lrow:hover .ltitle{text-decoration:underline;text-underline-offset:3px}
.llogo{width:40px;height:40px;object-fit:contain}
.ltitle{font-weight:700;line-height:1.3}
.nmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--faint);margin-bottom:3px}
.nsrc{font-weight:700;color:var(--text)}
.nteam{font-weight:600;color:var(--tc)}
.npay{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:4px;padding:0 4px}
.ntitle{font-weight:700;line-height:1.3}
.nsum{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:10px;width:100%;padding:8px}

.hero-grid{max-width:680px;margin:0 auto}
.tablewrap.line{max-width:620px;margin:12px auto 0}
.cmp,.cmp-head{max-width:620px;margin-left:auto;margin-right:auto}
.cmp .bar.nobar{background:transparent}
details.acc .tablewrap{max-width:620px}
.empty.slim{padding:10px 14px}
.schedcols{display:grid;gap:0 20px;align-items:start}
@media (min-width:900px){.schedcols{grid-template-columns:1fr 1fr}}
