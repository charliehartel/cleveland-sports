/* ---------- NBA: ratings and league ranks ---------- */
const nbaCache = {};
function nbaTeamFromStats(st){
  const ix = statIndex(st.results?.stats?.categories);
  const g = (c, n) => ix[c]?.[n]?.value;
  return { gp:g('general', 'gamesPlayed'), pts:g('offensive', 'points'), fga:g('offensive', 'fieldGoalsAttempted'), fgm:g('offensive', 'fieldGoalsMade'),
    fta:g('offensive', 'freeThrowsAttempted'), tpm:g('offensive', 'threePointFieldGoalsMade'), tpa:g('offensive', 'threePointFieldGoalsAttempted'),
    oreb:g('offensive', 'offensiveRebounds'), tov:g('offensive', 'turnovers'), ast:g('offensive', 'assists'),
    reb:g('general', 'totalRebounds') ?? g('general', 'rebounds'), astTo:g('general', 'assistTurnoverRatio') };
}
// Possessions (estimate) = FGA + 0.44·FTA − offensive rebounds + turnovers
const possOf = t => t.fga + 0.44 * t.fta - t.oreb + t.tov;
function nbaMetrics(t){
  const poss = possOf(t);
  const o = 100 * t.pts / poss, d = t.pa != null ? 100 * t.pa / poss : NaN;
  return { ortg:o, drtg:d, net:o - d, pace:poss / t.gp, ts:100 * t.pts / (2 * (t.fga + 0.44 * t.fta)), efg:100 * (t.fgm + 0.5 * t.tpm) / t.fga,
    tp:100 * t.tpm / t.tpa, tpa:t.tpa / t.gp, ast:t.ast / t.gp, reb:t.reb / t.gp, tovp:100 * t.tov / poss, astTo:t.astTo ?? t.ast / t.tov };
}
async function nbaLeague(season){
  const key = 'L' + season;
  nbaCache[key] ||= (async () => {
    const stand = await getJSON(`https://site.api.espn.com/apis/v2/sports/basketball/nba/standings?season=${season}`);
    const entries = (stand.children || []).flatMap(c => c.standings?.entries || []);
    const teams = {};
    await Promise.all(entries.map(async e => {
      const id = String(e.team?.id);
      try {
        const t = nbaTeamFromStats(await getJSON(`${API}/basketball/nba/teams/${id}/statistics?seasontype=2&season=${season}`));
        t.pa = e.stats?.find(x => x.name === 'pointsAgainst')?.value;
        if (t.gp && t.fga) teams[id] = { ...t, abbr:e.team?.abbreviation, m:nbaMetrics(t) };
      } catch {}
    }));
    if (Object.keys(teams).length < 20) throw new Error('league data incomplete');
    return teams;
  })();
  try { return await nbaCache[key]; } catch (e) { delete nbaCache[key]; throw e; }
}
// Last 10 games for every team, from daily scoreboards. Scoreboards lack offensive rebounds and turnovers,
// so each game's possessions use that team's season averages for those two.
async function nbaLast10(season, anchor, base){
  const dayKey = d => { const p = etParts(d); return `${p.year}${p.month}${p.day}`; };
  const key = `T${season}-${dayKey(anchor)}`;
  nbaCache[key] ||= (async () => {
    const games = {}, seen = new Set();
    let cursor = anchor.getTime();
    for (let batch = 0; batch < 7; batch++) {
      const days = Array.from({ length:7 }, (_, i) => dayKey(new Date(cursor - i * 24*H)));
      cursor -= 7 * 24*H;
      const sbs = await Promise.all(days.map(dd => getJSON(`${API}/basketball/nba/scoreboard?dates=${dd}`).catch(() => null)));
      for (const sb of sbs) for (const e of sb?.events || []) {
        if (seen.has(e.id)) continue;
        seen.add(e.id);
        const c = e.competitions?.[0];
        if (!c?.status?.type?.completed || (e.season?.type && e.season.type !== 2) || new Date(e.date) > anchor) continue;
        const cs = c.competitors || [];
        if (cs.length !== 2) continue;
        const stat = (x, n) => num((x.statistics || []).find(z => z.name === n)?.displayValue);
        const rows = cs.map(x => ({ id:String(x.team?.id), pts:num(scoreOf(x.score)), fga:stat(x, 'fieldGoalsAttempted'), fta:stat(x, 'freeThrowsAttempted') }));
        if (rows.some(r => r.pts == null || r.fga == null || r.fta == null)) continue;
        rows.forEach((r, i) => (games[r.id] ||= []).push({ date:new Date(e.date), pts:r.pts, pa:rows[1 - i].pts, fga:r.fga, fta:r.fta }));
      }
      if (Object.keys(base).every(id => (games[id] || []).length >= 10)) break;
    }
    const out = {};
    for (const [id, gs] of Object.entries(games)) {
      const b = base[id];
      if (!b) continue;
      const last = gs.sort((x, y) => y.date - x.date).slice(0, 10);
      if (last.length < 5) continue;
      const orebPg = b.oreb / b.gp, tovPg = b.tov / b.gp;
      let pts = 0, pa = 0, poss = 0, w = 0;
      for (const g of last) { pts += g.pts; pa += g.pa; poss += g.fga + 0.44 * g.fta - orebPg + tovPg; if (g.pts > g.pa) w++; }
      const o = 100 * pts / poss, d = 100 * pa / poss;
      out[id] = { n:last.length, w, m:{ ortg:o, drtg:d, net:o - d, pace:poss / last.length } };
    }
    return out;
  })();
  try { return await nbaCache[key]; } catch (e) { delete nbaCache[key]; throw e; }
}
async function loadLast10(){

function route(){
  clearTimeout(timer);
  const r = currentRoute();
  window.scrollTo(0, 0);
  if (r.name === 'game') showGame(r.league, r.id);
  else if (r.name === 'team') { view.id = null; showTeam(r.league, r.id, r.tab); }
  else { view.id = null; showHome(); }
}
window.addEventListener('hashchange', route);
$('#refresh').onclick = () => {
  const r = currentRoute(); clearTimeout(timer);
  if (r.name === 'game') showGame(r.league, r.id);
  else if (r.name === 'team') { tview.sched = null; tview.stats = null; tview.stand = null; newsState.data = null; showTeam(r.league, r.id, r.tab); }
  else { newsState.data = null; showHome(); }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) $('#refresh').click(); });
route();
</script>
</body>
</html>
