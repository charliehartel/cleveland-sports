<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Sports</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Sports">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121212">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
:root{
  --bg:#f6f5f2;--surface:#ffffff;--surface-2:#f0eee9;--border:#e2dfd8;--text:#1b1a18;--muted:#6b675f;--faint:#9a958b;
  --accent:#e4572e;--live:#d7263d;--good:#1f8a4c;--warn:#b45309;--focus:#2563eb;
  --cavs:#860038;--browns:#ff3c00;--guardians:#00385d;
  --warriors:#1d428a;--niners:#aa0000;--sharks:#006d75;--giants:#e3521b;--athletics:#0f5a3c;--valkyries:#6f4fa0;--stanford:#8c1515;
  --mets:#ff5910;--nygiants:#0b2265;--knicks:#006bb6;--yankees:#0c2340;--jets:#125740;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  --field:#2f7d3a;--field-line:rgba(255,255,255,.55);--zone:#1b1a18;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212;--surface:#1c1c1e;--surface-2:#26262a;--border:#333338;--text:#f1efe9;--muted:#a7a39a;--faint:#77746d;
  --accent:#ff7a50;--live:#ff4d61;--good:#4cc27e;--warn:#f5a524;--focus:#7aa2ff;
  --cavs:#c23a6e;--browns:#ff6a33;--guardians:#4d8fc4;
  --warriors:#5b8ee6;--niners:#e0484d;--sharks:#2bb3bd;--giants:#fd7a45;--athletics:#3aa874;--valkyries:#b38fcf;--stanford:#e0484d;
  --mets:#ff7a3d;--nygiants:#6f8fe0;--knicks:#f58426;--yankees:#8fa3c7;--jets:#4fb37a;
  --shadow:none;--field:#24612d;--zone:#f1efe9;
}}
:root[data-theme="dark"]{
  --bg:#121212;--surface:#1c1c1e;--surface-2:#26262a;--border:#333338;--text:#f1efe9;--muted:#a7a39a;--faint:#77746d;
  --accent:#ff7a50;--live:#ff4d61;--good:#4cc27e;--warn:#f5a524;--focus:#7aa2ff;
  --cavs:#c23a6e;--browns:#ff6a33;--guardians:#4d8fc4;
  --warriors:#5b8ee6;--niners:#e0484d;--sharks:#2bb3bd;--giants:#fd7a45;--athletics:#3aa874;--valkyries:#b38fcf;--stanford:#e0484d;
  --mets:#ff7a3d;--nygiants:#6f8fe0;--knicks:#f58426;--yankees:#8fa3c7;--jets:#4fb37a;
  --shadow:none;--field:#24612d;--zone:#f1efe9;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.num,table td,table th{font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 48px}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:12px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand .appname{text-decoration:none;color:var(--text);white-space:nowrap}
@media (max-width:440px){.updated{display:none}}
.brand select{font:inherit;font-weight:600;font-size:14px;color:var(--text);background-color:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 26px 4px 12px;cursor:pointer;
  appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.brand select option{color:#000;font-size:15px;font-weight:600}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--cavs),var(--browns) 50%,var(--guardians))}
.spacer{flex:1}
.updated{color:var(--faint);font-size:12px;white-space:nowrap}
.iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .sw{width:8px;height:8px;border-radius:50%}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec .count{color:var(--faint);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;text-align:left;width:100%;display:block;position:relative;overflow:hidden;text-decoration:none}
.card:hover{border-color:var(--faint)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px;gap:8px}
.card .meta .lg{font-weight:700;letter-spacing:.06em}
.status-live{color:var(--live);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.status-live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status-live::before{animation:none}}
.status-stale{color:var(--muted);font-weight:600}
.trow{display:flex;align-items:center;gap:10px;padding:3px 0}
.trow img,.logo{width:26px;height:26px;object-fit:contain;flex:none}
.trow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .rec{color:var(--faint);font-size:12px;margin-left:4px}
.trow .sc{font-weight:700;font-size:18px;min-width:2ch;text-align:right}
.trow.lose{color:var(--muted)}
.trow.win .nm{font-weight:700}
.card .foot{font-size:12px;color:var(--faint);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bay{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px 3px 8px;margin-top:8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bay svg{width:14px;height:14px;flex:none}
.bay.yes{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.bay.maybe{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bay.no,.bay.none{background:var(--surface-2);color:var(--muted)}
.baynote{font-size:12px;color:var(--muted);margin-top:6px}
.baynote a{color:inherit}
.empty{color:var(--faint);font-size:14px;padding:14px;border:1px dashed var(--border);border-radius:12px}
.err{background:color-mix(in srgb,var(--live) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--live) 40%,var(--border));color:var(--text);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
.loading{color:var(--faint);padding:40px 0;text-align:center}

/* Game view */
.back{display:inline-flex;align-items:center;gap:6px;margin:16px 0 8px;text-decoration:none;color:var(--muted);font-size:14px}
.score-hero{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.hero-grid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.hteam{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.hteam img{width:56px;height:56px;object-fit:contain}
.hteam .tn{font-weight:700;font-size:15px}
.hteam .tr{font-size:12px;color:var(--faint)}
.hteam .ts{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em}
.hteam.lose .ts{color:var(--muted)}
.hteam .poss{font-size:11px;color:var(--accent);font-weight:700;min-height:14px}
.hmid{text-align:center;font-size:13px;color:var(--muted);max-width:150px}
.hmid .st{font-weight:700;color:var(--text);font-size:15px}
.hero-foot{text-align:center;color:var(--faint);font-size:12px;margin-top:10px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--surface-2)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1}
tbody tr{background:var(--surface)}
thead tr{background:var(--surface-2)}
tr.total td{font-weight:700;background:var(--surface-2)}
tr.divider td{background:var(--surface-2);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left}
td .pos{color:var(--faint);font-size:11px;margin-left:4px}
td .dnp{color:var(--faint);font-style:italic}
td.pl{max-width:170px;overflow:hidden;text-overflow:ellipsis}
.line{margin-top:12px}
.line td:first-child,.line th:first-child{min-width:64px}
.tabs{display:flex;gap:4px;margin:18px 0 12px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{background:none;border:none;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.panel{display:grid;gap:16px}
.box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.box h3{margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.box h3 .sub{font-weight:500;color:var(--faint);font-size:12px}
.teamhead{display:flex;align-items:center;gap:10px;margin:8px 0 10px;font-weight:700;font-size:16px}
.grp-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;align-items:center;font-size:13px}
.cmp .lbl{text-align:center;color:var(--muted);font-size:12px;grid-column:2}
.cmp .v{font-weight:700}
.cmp .va{text-align:right}
.cmp .bar{grid-column:1 / -1;display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--surface-2);margin-bottom:6px}
.cmp .bar span{display:block;height:100%}
.cmp-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-bottom:10px;font-weight:700}
.cmp-head > :last-child{justify-self:end}
.note{font-size:12px;color:var(--faint);margin-top:8px}
.plays{list-style:none;margin:0;padding:0}
.plays li{display:grid;grid-template-columns:5.2em 22px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.plays li:last-child{border-bottom:none}
.plays .clk{color:var(--faint);font-size:12px;min-width:44px;padding-top:2px;white-space:nowrap}
.plays img{width:20px;height:20px;object-fit:contain;margin-top:1px}
.plays .scr{font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
.plays li.scoring .txt{font-weight:600}
.plays li.scoring .scr{color:var(--text);font-weight:700}
.gstr{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;background:var(--surface-2);color:var(--text)}
.star3{display:inline-block;flex:none;width:3.6em;margin:0!important;font-size:14px!important;letter-spacing:-.05em;white-space:nowrap}
.star{margin-left:6px;font-size:11px;font-weight:800;color:#c48a00;white-space:nowrap}
@media (prefers-color-scheme:dark){.star{color:#f5c542}}
.penl{display:inline-block;margin-right:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--warn)}
.ppbar{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
/* Hockey: my team's goals get a red goal light; the other team's goals are muted */
.plays li.goal-mine{background:color-mix(in srgb,#e00000 9%,transparent);box-shadow:inset 4px 0 0 #e00000;margin-left:-10px;padding-left:10px}
.plays li.goal-mine .txt,.plays li.goal-mine .scr{font-weight:800}
.plays li.goal-opp{opacity:.55}
.plays li.goal-opp .txt,.plays li.goal-opp .scr{font-weight:400}
.goal-banner{display:inline-flex;align-items:center;gap:8px;margin-right:8px;color:#e00000;font-weight:900;text-transform:uppercase;letter-spacing:.03em}
@media (prefers-color-scheme:dark){.goal-banner{color:#ff4d4d}}
.goal-light{width:14px;height:14px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#ffd6d1,#ff1a1a 45%,#9a0000 80%);box-shadow:0 0 10px 4px rgba(255,30,30,.8)}
@media (prefers-reduced-motion:no-preference){.goal-light{animation:goallamp .6s ease-in-out infinite alternate}}
@keyframes goallamp{from{opacity:.7;box-shadow:0 0 4px 1px rgba(255,30,30,.5)}to{opacity:1;box-shadow:0 0 16px 7px rgba(255,30,30,.95)}}
.plays .dd{display:block;font-size:12px;color:var(--faint)}
details.drive{border:1px solid var(--border);border-radius:10px;background:var(--surface);margin-bottom:8px}
details.drive>summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center}
details.drive>summary::-webkit-details-marker{display:none}
details.drive>summary .res{font-weight:700}
details.drive>summary .ds{font-size:12px;color:var(--faint)}
details.drive .plays{padding:0 12px 6px}
details.drive.score>summary .res{color:var(--good)}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pchips .chip{padding:3px 10px;font-size:12px}
.half{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 4px;font-weight:700}
details.ab>summary{cursor:pointer;list-style:none}
details.ab>summary::-webkit-details-marker{display:none}
.pitchlist{font-size:12px;color:var(--muted);margin:4px 0 0;padding-left:18px}
.situ{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.bigtxt{font-size:20px;font-weight:800}
.lastplay{font-size:15px}
.lastplay .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);display:block;margin-bottom:2px}
.count{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.count b{color:var(--text);font-size:18px}
.dots{display:inline-flex;gap:4px;vertical-align:middle;margin-left:4px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.leaders{display:grid;gap:8px}
.leader{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:13px}
.leader .cat{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.leader .who{font-weight:600}
.leader img.hs{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
svg text{font-family:inherit}
.small{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.tlink{color:inherit;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;border-radius:6px}
.tlink:hover{text-decoration:underline;text-underline-offset:3px}
.trow .tlink{flex:none;padding:2px;margin:-2px}
.trow .tlink:hover img{transform:scale(1.12)}
.trow img{transition:transform .12s}
.team-hero{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-left:6px solid var(--tc);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.team-hero .tlogo{width:56px;height:56px;object-fit:contain}
.team-hero .tname{font-size:20px;font-weight:800;letter-spacing:-.01em}
a.tab{text-decoration:none;display:inline-block}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 4px}
.seasonsel select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:4px 8px;margin-left:6px}
.slist{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.srow{display:grid;grid-template-columns:110px 1fr auto;gap:4px 12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);text-decoration:none}
.srow:last-child{border-bottom:none}
.srow:hover{background:var(--surface-2)}
.sdate{font-size:13px;color:var(--muted)}
.ptag{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;text-transform:uppercase;color:var(--accent)}
.sopp{display:flex;align-items:center;gap:8px;min-width:0}
.sopp .vs{color:var(--faint);font-size:12px;width:18px}
.sopp .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sres{text-align:right;white-space:nowrap}
.sbay{grid-column:2 / -1}
.sbay .bay{margin-top:0}
.wl{font-weight:800}
.wl.W{color:var(--good)} .wl.L{color:var(--live)}
@media (max-width:520px){.srow{grid-template-columns:76px 1fr auto}.sdate{font-size:12px}}
details.acc>summary{grid-template-columns:1fr auto}
.ratehead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.tile.ranked{position:relative;padding-bottom:22px}
.tile .rk{position:absolute;right:10px;bottom:7px;font-size:12px;font-weight:700;color:var(--muted)}
.tile .rk.top{color:var(--good)}
.tile .rk.bottom{color:var(--live)}
.livebar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 6px;margin:12px auto 0;padding:6px 12px;border-radius:999px;font-size:12px;color:var(--muted);background:var(--surface-2);width:fit-content;max-width:100%;text-align:center}
.livebar b{color:var(--live)}
.livebar .dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite}
.livebar.stale b{color:var(--warn)}
.livebar.stale .dot{background:var(--warn);animation:none}
.livebar .ago{font-variant-numeric:tabular-nums}
.plays li.new{animation:newplay 3s ease-out}
@keyframes newplay{0%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.plays li.new{animation:none;background:color-mix(in srgb,var(--accent) 10%,transparent)}.livebar .dot{animation:none}}
table.stand td.pl{max-width:none;min-width:150px}
table.stand .tcell{display:flex;align-items:center;gap:6px}
table.stand td.pl .tlink{gap:8px}
table.stand td.pl .logo{width:20px;height:20px}
table.stand tr.me td{background:color-mix(in srgb,var(--accent) 12%,var(--surface));font-weight:700}
table.stand tr.cut td{border-bottom:2px dashed var(--muted)}
.seed{display:inline-block;width:18px;color:var(--faint);font-size:12px;text-align:right}
sup.clinch{font-size:10px;color:var(--muted);font-weight:700}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:16px 0 4px}
.qteam{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px 10px;background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--tc);border-radius:12px;box-shadow:var(--shadow);text-decoration:none;text-align:center}
.qteam:hover{border-color:var(--faint);border-top-color:var(--tc)}
.qteam img{width:44px;height:44px;object-fit:contain;transition:transform .12s}
.qteam:hover img{transform:scale(1.08)}
.qteam .qname{font-weight:700;font-size:14px}
.qteam .qlg{font-size:11px;color:var(--faint);letter-spacing:.06em;font-weight:600}
:root[data-theme="light"] .qteam picture source{display:none}
.newslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.news{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow)}
.news:hover{border-color:var(--faint)}
.nthumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--surface-2);display:block;border-bottom:3px solid var(--tc)}
.nthumb.ph{display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--tc) 22%,var(--surface-2));color:var(--muted);font-weight:800;font-size:18px}
.nbody{min-width:0;padding:10px 12px 12px}
.latest{margin-top:4px}
.lrow{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border);text-decoration:none}
.lrow:first-of-type{border-top:none}
.lrow:hover .ltitle{text-decoration:underline;text-underline-offset:3px}
.llogo{width:40px;height:40px;object-fit:contain}
.ltitle{font-weight:700;line-height:1.3}
.nmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--faint);margin-bottom:3px}
.nsrc{font-weight:700;color:var(--text)}
.nteam{font-weight:600;color:var(--tc)}
.npay{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--border);border-radius:4px;padding:0 4px}
.ntitle{font-weight:700;line-height:1.3}
.nsum{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:10px;width:100%;padding:8px}

.hero-grid{max-width:680px;margin:0 auto}
.tablewrap.line{max-width:620px;margin:12px auto 0}
.cmp,.cmp-head{max-width:620px;margin-left:auto;margin-right:auto}
.cmp .bar.nobar{background:transparent}
details.acc .tablewrap{max-width:620px}
.empty.slim{padding:10px 14px}
.schedcols{display:grid;gap:0 20px;align-items:start}
@media (min-width:900px){.schedcols{grid-template-columns:1fr 1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.tile .tv{font-size:20px;font-weight:800;letter-spacing:-.01em}
.tile .tl{font-size:12px;color:var(--muted)}
.sortbtn{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.sortbtn.on{color:var(--text)}
.ptable td.sorted{background:color-mix(in srgb,var(--accent) 7%,var(--surface));font-weight:700}
/* NHL preview lists: goalies, out tonight, leaders, streaks, season series */
.pvl{list-style:none;margin:0;padding:0}
.pvl li{padding:8px 0;border-top:1px solid var(--border)}
.pvl li:first-child{border-top:0}
.pvl .top{display:flex;gap:6px 8px;align-items:baseline;flex-wrap:wrap}
.pvl .nm{font-weight:600}
.pvl .meta{font-size:13px;color:var(--muted);margin-top:2px}
.pvl a{text-decoration:none}
.tagx{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tagx.out{background:color-mix(in srgb,var(--live) 14%,transparent);color:var(--live)}
.tagx.hot{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tagx.cold{background:color-mix(in srgb,var(--focus) 14%,transparent);color:var(--focus)}
.tagx.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.lrk{font-size:12px;color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="dot"></span><a class="appname" href="#/">My Sports</a>
    <label><span class="visually-hidden">Region</span><select id="view" aria-label="Region"></select></label></div>
  <span class="spacer"></span>
  <span class="updated" id="updated"></span>
  <button class="iconbtn" id="refresh" title="Refresh now" aria-label="Refresh now">↻</button>
</div></header>
<main class="wrap" id="app"><div class="loading">Loading…</div></main>

<script>
/* ---------- Config: your teams ---------- */
// Each view is a set of teams. Cleveland is the default; open ?view=bayarea (or the bayarea/ folder) for the other one.
// news:true shows the news feed collected by scripts/news.mjs (its TEAMS list must include the view's team keys).
const VIEWS = {
  cleveland: { name:'Cleveland', local:'Cleveland-area', news:true, teams:[
    { key:'cavs',      label:'Cavaliers', league:'nba', sport:'basketball', abbr:'cle', id:'5', color:'var(--cavs)' },
    { key:'browns',    label:'Browns',    league:'nfl', sport:'football',   abbr:'cle', id:'5', color:'var(--browns)' },
    { key:'guardians', label:'Guardians', league:'mlb', sport:'baseball',   abbr:'cle', id:'5', color:'var(--guardians)' },
  ]},
  bayarea: { name:'Bay Area', local:'Bay Area', news:true, teams:[
    { key:'warriors',  label:'Warriors',  league:'nba', sport:'basketball', abbr:'gs',  id:'9',  color:'var(--warriors)' },
    { key:'niners',    label:'49ers',     league:'nfl', sport:'football',   abbr:'sf',  id:'25', color:'var(--niners)' },
    { key:'giants',    label:'Giants',    league:'mlb', sport:'baseball',   abbr:'sf',  id:'26', color:'var(--giants)' },
    { key:'sharks',    label:'Sharks',    league:'nhl', sport:'hockey',     abbr:'sj',  id:'18', color:'var(--sharks)' },
    { key:'athletics', label:'Athletics', league:'mlb', sport:'baseball',   abbr:'ath', id:'11', color:'var(--athletics)' },
    { key:'valkyries', label:'Valkyries', league:'wnba', sport:'basketball', abbr:'gs',  id:'129689', color:'var(--valkyries)' },
    { key:'stanford',  label:'Stanford',  league:'college-football', sport:'football', abbr:'stan', id:'24', color:'var(--stanford)' },
  ]},
  nyccool: { name:'NYC Cool', local:'New York', news:true, teams:[
    { key:'mets',      label:'Mets',      league:'mlb', sport:'baseball',   abbr:'nym', id:'21', color:'var(--mets)' },
    { key:'nygiants',  label:'Giants',    league:'nfl', sport:'football',   abbr:'nyg', id:'19', color:'var(--nygiants)' },
    { key:'knicks',    label:'Knicks',    league:'nba', sport:'basketball', abbr:'ny',  id:'18', color:'var(--knicks)' },
  ]},
  nyclame: { name:'NYC Lame', local:'New York', news:true, teams:[
    { key:'yankees',   label:'Yankees',   league:'mlb', sport:'baseball',   abbr:'nyy', id:'10', color:'var(--yankees)' },
    { key:'jets',      label:'Jets',      league:'nfl', sport:'football',   abbr:'nyj', id:'20', color:'var(--jets)' },
    { key:'knicks',    label:'Knicks',    league:'nba', sport:'basketball', abbr:'ny',  id:'18', color:'var(--knicks)' },
  ]},
};
const VIEW_KEY = Object.hasOwn(VIEWS, new URLSearchParams(location.search).get('view')) ? new URLSearchParams(location.search).get('view') : 'cleveland';
const VIEW = VIEWS[VIEW_KEY];
const TEAMS = VIEW.teams;
const APP_NAME = 'My Sports';
// The page title names the region; the app name and home-screen icon are the same for every region.
document.title = `${APP_NAME} · ${VIEW.name}`;
// Header title is a selector; choosing another view reloads the page with ?view=… (Cleveland is the plain address).
(() => {
  const sel = document.getElementById('view');
  sel.innerHTML = Object.entries(VIEWS).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('');
  sel.value = VIEW_KEY;
  sel.onchange = () => { location.href = `${location.pathname}${sel.value === 'cleveland' ? '' : `?view=${sel.value}`}#/`; };
})();
document.querySelector('.brand .dot').style.background = `linear-gradient(135deg,${TEAMS.map(t => t.color).join(',')})`;
const API = 'https://site.api.espn.com/apis/site/v2/sports';
const SPORT = { nba:'basketball', wnba:'basketball', nfl:'football', 'college-football':'football', mlb:'baseball', nhl:'hockey' };
// Game and team pages treat the WNBA like the NBA and college football like the NFL (same data shapes)
const FAMILY = { wnba:'nba', 'college-football':'nfl' };
const fam = league => FAMILY[league] || league;
const LEAGUE_LABEL = { 'college-football':'NCAAF' };
const leagueLabel = league => (LEAGUE_LABEL[league] || league).toUpperCase();
const H = 3600e3;

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => (typeof u === 'string' && u.startsWith('https://')) ? u : '';
const img = (u, cls='logo', alt='') => safeUrl(u) ? `<img class="${cls}" src="${esc(safeUrl(u))}" alt="${esc(alt)}" loading="lazy">` : `<span class="${cls}"></span>`;
const hexColor = c => /^[0-9a-f]{6}$/i.test(c || '') ? '#' + c : null;
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const FETCH_MS = 15000; // a request that hangs would otherwise stop the live refresh loop, which only reschedules once a request settles
// Options object, not a plain number: getJSON is also used as a .map() callback, which passes the index as the second argument.
async function getJSON(url, { timeout = FETCH_MS, cache } = {}){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(url, { signal:ctl.signal, cache });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('timed out');
    throw e;
  } finally { clearTimeout(t); }
}
// Store successful responses and share pending requests. A failed refresh leaves the last good value available.
function cachedResponse(cache, key, maxAge, load){
  let entry = cache.get(key);
  if (!entry) { entry = {}; cache.set(key, entry); }
  if (entry.pending) return entry.pending;
  if (entry.at != null && Date.now() - entry.at < maxAge) return Promise.resolve(entry.value);
  entry.pending = load().then(value => {
    entry.value = value;
    entry.at = Date.now();
    return value;
  }).finally(() => { delete entry.pending; });
  return entry.pending;
}
async function getEvents(url){
  const data = await getJSON(url);
  if (!Array.isArray(data?.events)) throw new Error('ESPN events unavailable');
  return data;
}
const fmtTime = d => d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
const fmtDay = d => d.toLocaleDateString([], { weekday:'short', month:'short', day:'numeric' });
const sameDay = (a, b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const ordinal = n => { const s=['th','st','nd','rd'], v=n%100; return n + (s[(v-20)%10] || s[v] || s[0]); };
const num = v => { const n = parseFloat(String(v).replace('%','')); return isNaN(n) ? null : n; };
const pct = (v, d=1) => v == null || !isFinite(v) ? '–' : (v*100).toFixed(d) + '%';
let timer = null, pageLoad = 0;
function beginPageLoad(){
  clearTimeout(timer);
  const request = ++pageLoad, hash = location.hash;
  return () => request === pageLoad && location.hash === hash;
}
function schedule(fn, ms){
  clearTimeout(timer);
  const hash = location.hash;
  timer = setTimeout(() => { if (location.hash === hash) fn(); }, ms);
}
function setUpdated(extra=''){ $('#updated').textContent = `Updated ${fmtTime(new Date())}${extra}`; }

/* ---------- Normalize ESPN events (schedule + scoreboard shapes) ---------- */
function logoOf(tm){ return safeUrl(tm?.logo || tm?.logos?.[0]?.href || ''); }
function scoreOf(s){ return s == null ? null : (typeof s === 'object' ? (s.displayValue ?? s.value) : s); }
function recOf(x){
  const r = x.records || x.record;
  if (Array.isArray(r) && r.length) { const t = r.find(z => z.type === 'total') || r[0]; return t.summary || t.displayValue || ''; }
  return '';
}
function bcOf(c){
  const out = [];
  for (const b of c.broadcasts || []) {
    if (b.media?.shortName) out.push(b.media.shortName);
    else if (Array.isArray(b.names)) out.push(...b.names);
  }
  return [...new Set(out)].join(', ');
}
function side(x){
  if (!x) return { abbr:'TBD', name:'TBD', short:'TBD', logo:'', score:null, winner:false, record:'' };
  return { id:x.team?.id, abbr:x.team?.abbreviation, name:x.team?.displayName, short:x.team?.shortDisplayName || x.team?.name,
           logo:logoOf(x.team), score:scoreOf(x.score), winner:!!x.winner, record:recOf(x) };
}
function norm(e, t){
  const c = e.competitions?.[0] || {};
  const st = (c.status || e.status || {}).type || {};
  const comps = c.competitors || [];
  const g = {
    id:e.id, team:t, league:t.league, date:new Date(e.date), state:st.state || 'pre', completed:!!st.completed,
    detail:st.shortDetail || st.detail || '', home:side(comps.find(x => x.homeAway==='home')),
    away:side(comps.find(x => x.homeAway==='away')), broadcast:bcOf(c), venue:c.venue?.fullName || '',
  };
  g.bay = bayArea(g.league, g.date, bcList(c), g.home, g.away);
  return g;
}

/* ---------- Bay Area TV ---------- */
// Broadcasts with their market ("national" / "home" / "away"), from schedule, scoreboard or summary shapes.
function bcList(c){
  const out = [];
  for (const b of c.broadcasts || []) {
    const market = String((typeof b.market === 'string' ? b.market : b.market?.type) || '').toLowerCase();
    const names = b.media?.shortName ? [b.media.shortName] : (Array.isArray(b.names) ? b.names : []);
    for (const n of names) if (n) out.push({ name:String(n).trim(), market });
  }
  return out;
}
const BAY = {
  ota: { ABC:'KGO 7', CBS:'KPIX 5', NBC:'KNTV 11', FOX:'KTVU 2' },
  // Bay Area teams: when one is the opponent, its own broadcast airs here.
  teams: { nba:{ GS:'NBC Sports Bay Area' }, mlb:{ SF:'NBC Sports Bay Area', ATH:'NBC Sports California', OAK:'NBC Sports California' }, nfl:{ SF:'' }, wnba:{ GS:'KPIX+' }, 'college-football':{ STAN:'' }, nhl:{ SJ:'NBC Sports Bay Area' } },
  cable: /^(ESPN|ESPN2|ESPNU|ESPNEWS|ABC\/ESPN|TNT|TBS|truTV|FS1|FS2|NFL Net(work)?|NFLN|NBA TV|ACC Network|ACCN|SEC Network|SECN|Big Ten Network|BTN|CBS Sports Network|CBSSN|ESPNU|CNBC|E!|SYFY|ION|MLB Net(work)?|MLBN|NHL Net(work)?|NHLN|NBCSN|USA Net(work)?)$/i,
  stream: /prime|peacock|netflix|apple tv|espn\+|espn unl|youtube|^max$|paramount|nbc sports app|amazon/i,
  packages: /mlb\.tv|league pass|sunday ticket|nfl\+/i,      // out-of-market packages, not Bay Area TV
  alias: { 'NBC Sports BA':'NBC Sports Bay Area', 'NBCS-BA':'NBC Sports Bay Area', 'NBCS-CA':'NBC Sports California' }, // ESPN's short names
  outOfMarket: { nba:'NBA League Pass', wnba:'WNBA League Pass', mlb:'MLB.TV', nfl:'NFL Sunday Ticket', 'college-football':'ESPN+', nhl:'ESPN+' },
};
// NHL games listed nationally on ESPN+ are its out-of-market package (blacked out in the home teams' markets), not national TV.
const isPackage = (league, name) => BAY.packages.test(name) || (league === 'nhl' && /^espn\s?\+$/i.test(name));
function etParts(d){
  const parts = new Intl.DateTimeFormat('en-US', { timeZone:'America/New_York', weekday:'short', hour:'numeric', hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(d);
  return Object.fromEntries(parts.map(p => [p.type, p.value]));
}
function bayArea(league, date, bcs, home, away){
  const teams = BAY.teams[league] || {};
  const baySide = home && home.abbr in teams ? 'home' : away && away.abbr in teams ? 'away' : null;
  const bayTeam = baySide === 'home' ? home : baySide === 'away' ? away : null;
  const opts = [];
  for (const b of bcs) {
    if (isPackage(league, b.name)) continue;
    const key = b.name.toUpperCase();
    if (b.market === 'national') {
      if (BAY.ota[key]) {
        const et = etParts(date);
        const regional = (league === 'nfl' && (key === 'CBS' || key === 'FOX') && et.weekday === 'Sun' && Number(et.hour) < 19)
                      || (league === 'mlb' && key === 'FOX');
        if (regional && !baySide) opts.push({ lvl:1, label:`Maybe · ${key} regional`, net:key, regional:true,
          why:`${key}'s Sunday-afternoon games are regional. ${BAY.ota[key]} airs it only if the Bay Area is in this game's coverage map.` });
        else opts.push({ lvl:2, label:`${BAY.ota[key]} · ${key}`, why:'Free over-the-air TV in the Bay Area.' });
      } else if (BAY.stream.test(b.name)) opts.push({ lvl:2, label:b.name, why:'Streams nationally, including the Bay Area.' });
      else if (BAY.cable.test(b.name)) opts.push({ lvl:2, label:b.name, why:'National cable channel, available in the Bay Area.' });
      else opts.push({ lvl:1, label:`Maybe · ${b.name}`, why:`Listed nationally on ${b.name}, which I don't recognize as a Bay Area channel.` });
    } else if (baySide && b.market === baySide) {
      opts.push({ lvl:2, label:BAY.alias[b.name] || b.name, why:`The ${bayTeam.short} broadcast airs in the Bay Area.` });
    }
  }
  if (baySide && !opts.some(o => o.lvl === 2)) {
    const ch = teams[bayTeam.abbr] || (league === 'nfl' ? 'Local TV' : '');
    if (ch) opts.push({ lvl:2, label:ch, why:`The ${bayTeam.short} broadcast airs in the Bay Area.` });
  }
  if (opts.length) return opts.sort((a, b) => b.lvl - a.lvl)[0];
  if (!bcs.some(b => !isPackage(league, b.name))) return null; // TV not announced yet
  return { lvl:0, label:'Not on Bay Area TV', sub:BAY.outOfMarket[league],
    why:`Only on ${[home, away].some(x => x && TEAMS.some(t => t.league === league && t.abbr.toUpperCase() === String(x.abbr || '').toUpperCase())) ? VIEW.local : 'the teams\' local'} channels. Out of market, you can stream it on ${BAY.outOfMarket[league]}.` };
}
// For a regional NFL game: if the 49ers are on the same network at the same time, Bay Area TV shows the 49ers.
const sfCache = {};
async function refineBay(games){
  let changed = false;
  const jobs = games.filter(g => g.bay?.regional && g.league === 'nfl').map(async g => {
    const et = etParts(g.date), ymd = `${et.year}${et.month}${et.day}`;
    const scoreboard = sfCache[ymd] ||= getJSON(`${API}/football/nfl/scoreboard?dates=${ymd}`);
    try {
      const sb = await scoreboard;
      const sf = (sb.events || []).find(e => (e.competitions?.[0]?.competitors || []).some(x => x.team?.abbreviation === 'SF'));
      if (!sf || sf.id === g.id) return;
      const sameTime = new Date(sf.date).getTime() === g.date.getTime();
      const sameNet = bcList(sf.competitions[0]).some(b => b.name.toUpperCase() === g.bay.net);
      if (sameTime && sameNet) {
        g.bay = { lvl:0, label:'Not on Bay Area TV', sub:`${BAY.ota[g.bay.net]} has the 49ers`,
          why:`${BAY.ota[g.bay.net]} is showing the 49ers in the same time slot. Stream it on NFL Sunday Ticket.` };
        changed = true;
      }
    } catch { if (sfCache[ymd] === scoreboard) delete sfCache[ymd]; }
  });
  await Promise.all(jobs);
  return changed;
}
const TV_ICON = `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 14.5h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
const TV_OFF = `<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3.5" width="13" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 2l12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`;
function bayPill(bay){
  if (!bay) return `<span class="bay none">${TV_ICON}Bay Area TV: not announced</span>`;
  const cls = ['no', 'maybe', 'yes'][bay.lvl];
  const text = bay.lvl === 2 ? `Bay Area TV: ${bay.label}` : bay.lvl === 1 ? `Bay Area TV: ${bay.label}` : `${bay.label}${bay.sub ? ' · ' + bay.sub : ''}`;
  return `<span class="bay ${cls}" title="${esc(bay.why || '')}">${bay.lvl ? TV_ICON : TV_OFF}${esc(text)}</span>`;
}

/* ---------- Home ---------- */
const sbQuery = league => league === 'college-football' ? '?groups=80' : ''; // FBS, not just the top 25
const homeSchedules = new Map(), scoreboards = new Map();
const SCHEDULE_MS = 5*60e3, STALE_SCORES_MS = 24*H;
function leagueScoreboard(league){
  return cachedResponse(scoreboards, league, 0, () => getEvents(`${API}/${SPORT[league]}/${league}/scoreboard${sbQuery(league)}`));
}
// Keep one card for games involving two tracked teams, under both team filters.
function mergeGames(lists){
  const byId = new Map();
  for (const g of lists.flat()) {
    const id = `${g.league}:${g.id}`;
    const had = byId.get(id);
    if (had) { if (!had.keys.includes(g.team.key)) had.keys.push(g.team.key); }
    else byId.set(id, { ...g, keys:[g.team.key] });
  }
  return [...byId.values()];
}
async function loadTeam(t, refreshSchedules){
  const base = `${API}/${t.sport}/${t.league}`;
  const urls = [2, 3].map(st => `${base}/teams/${t.league === 'college-football' ? t.id : t.abbr}/schedule?seasontype=${st}`);
  const res = await Promise.allSettled([
    ...urls.map(url => cachedResponse(homeSchedules, url, refreshSchedules ? 0 : SCHEDULE_MS, () => getEvents(url))),
    leagueScoreboard(t.league),
  ]);
  const previous = [...urls.map(url => homeSchedules.get(url)), scoreboards.get(t.league)];
  const stale = [], staleAt = [];
  const [regular, playoffs, board] = res.map((result, i) => {
    if (result.status === 'fulfilled') return result.value;
    const entry = previous[i];
    if (entry?.at != null && Date.now() - entry.at < STALE_SCORES_MS) {
      stale.push(entry.at);
      staleAt[i] = entry.at;
      return entry.value;
    }
    return null;
  });
  // Keep the fetch time for score precedence and show the age of failed-source snapshots.
  const normAt = (e, i) => ({ ...norm(e, t), fetchedAt:previous[i]?.at, staleAt:staleAt[i] });
  const events = new Map();
  [regular, playoffs].forEach((data, i) => { for (const e of data?.events || []) events.set(String(e.id), normAt(e, i)); });
  for (const e of board?.events || []) {
    const mine = (e.competitions?.[0]?.competitors || []).some(x =>
      String(x.team?.id) === t.id || (x.team?.abbreviation || '').toLowerCase() === t.abbr);
    if (mine) {
      const id = String(e.id), event = normAt(e, 2), scheduleEvent = events.get(id);
      // During a scoreboard outage, keep the newer final if both sources have one.
      const newerFinal = event.completed && event.fetchedAt > scheduleEvent?.fetchedAt;
      if (res[2].status === 'fulfilled' || !scheduleEvent?.completed || newerFinal) events.set(id, event);
    }
  }
  if (!regular && !playoffs && !events.size) throw new Error(`Couldn't load the ${t.label} schedule`);
  return { games:[...events.values()], stale, partial:res.some(r => r.status === 'rejected') };
}

let homeState = { games:[], errors:[], staleAt:null, partial:false };
const FILTER_KEY = VIEW_KEY === 'cleveland' ? 'teamFilter' : `teamFilter:${VIEW_KEY}`; // each view remembers its own team filter
async function showHome(refreshSchedules = true){
  const active = beginPageLoad();
  document.title = `${APP_NAME} · ${VIEW.name}`;
  if (!$('#app .quick')) {
    if (homeState.games.length) renderHome();
    else $('#app').innerHTML = '<div class="loading">Loading your teams…</div>';
  }
  const res = await Promise.allSettled(TEAMS.map(t => loadTeam(t, refreshSchedules)));
  if (!active()) return;
  const teams = res.flatMap(r => r.status === 'fulfilled' ? [r.value] : []);
  const games = mergeGames(teams.map(t => t.games));
  const errors = res.flatMap(r => r.status === 'rejected' ? [r.reason.message] : []);
  const stale = teams.flatMap(t => t.stale);
  homeState = { games, errors, staleAt:stale.length ? Math.min(...stale) : null, partial:teams.some(t => t.partial) };
  renderHome();
  if (homeState.partial || errors.length) $('#updated').textContent = 'ESPN updates delayed';
  else setUpdated();
  const now = Date.now();
  const busy = games.some(g => g.state === 'in' || (g.state === 'pre' && g.date - now < 30*60e3 && g.date - now > -3*H));
  schedule(() => showHome(false), busy ? 30e3 : SCHEDULE_MS);

  const nearby = games.filter(g => g.date.getTime() < now + 8*24*H && g.date.getTime() > now - 2*24*H && g.bay?.regional);
  if (nearby.length && await refineBay(nearby) && active()) renderHome();
}
function buckets(games, filter){
  const now = new Date(), t = now.getTime();
  const gs = games.filter(g => filter === 'all' || (g.keys || [g.team.key]).includes(filter));
  const live = gs.filter(g => g.state === 'in').sort((a,b) => a.date-b.date);
  const today = gs.filter(g => g.state !== 'in' && sameDay(g.date, now)).sort((a,b) => a.date-b.date);
  const recent = gs.filter(g => g.state === 'post' && !sameDay(g.date, now) && g.date.getTime() + 3*H >= t - 36*H && g.date.getTime() <= t)
                   .sort((a,b) => b.date-a.date);
  const upcoming = gs.filter(g => g.state === 'pre' && !sameDay(g.date, now) && g.date > now && g.date - now <= 7*24*H).sort((a,b) => a.date-b.date);
  return { live, today, recent, upcoming };
}
function teamRow(s, g){
  const showScore = g.state !== 'pre' && s.score != null;
  const cls = g.state === 'post' && showScore ? (s.winner ? 'win' : 'lose') : '';
  return `<div class="trow ${cls}">${teamLink(g.team.league, { id:s.id, displayName:s.name, abbreviation:s.abbr }, img(s.logo, '', s.abbr), true)}<span class="nm">${esc(s.short || s.name)}<span class="rec">${esc(s.record)}</span></span>${showScore ? `<span class="sc">${esc(s.score)}</span>` : ''}</div>`;
}
function card(g){
  let status;
  if (g.state === 'in' && g.staleAt != null) status = `<span class="status-stale" title="ESPN hasn't answered since then">${esc(g.detail || 'Live')} · score as of ${esc(fmtTime(new Date(g.staleAt)))}</span>`;
  else if (g.state === 'in') status = `<span class="status-live">${esc(g.detail || 'Live')}</span>`;
  else if (g.state === 'post') status = `<span>${esc(g.detail || 'Final')} · ${esc(fmtDay(g.date))}</span>`;
  else status = `<span>${esc(sameDay(g.date, new Date()) ? 'Today' : fmtDay(g.date))} · ${esc(fmtTime(g.date))}</span>`;
  const foot = [g.broadcast, g.venue].filter(Boolean).join(' · ');
  return `<a class="card" style="--tc:${g.team.color}" href="#/g/${g.team.league}/${esc(g.id)}">
    <div class="meta"><span class="lg">${esc(leagueLabel(g.team.league))}</span>${status}</div>
    ${teamRow(g.away, g)}${teamRow(g.home, g)}
    ${foot ? `<div class="foot">${esc(foot)}</div>` : ''}
    ${bayPill(g.bay)}</a>`;
}
function section(title, list, emptyMsg){
  return `<h2 class="sec">${esc(title)} <span class="count">${list.length || ''}</span></h2>` +
    (list.length ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="empty">${esc(emptyMsg)}</div>`);
}
// ESPN logo for one of my teams; college logos are filed by team id, pro logos by abbreviation
const logoSrc = (t, dark) => t.league === 'college-football'
  ? `https://a.espncdn.com/i/teamlogos/ncaa/${dark ? '500-dark' : '500'}/${t.id}.png`

function renderHome(){

  const quick = `<nav class="quick" aria-label="Team pages">${TEAMS.map(t => `<a class="qteam" style="--tc:${t.color}" href="#/t/${t.league}/${t.id}">

  $('#app').innerHTML = `${quick}<div class="chips">${chips}</div>

    ${b.live.length ? section('Live now', b.live, '') : ''}

/* ---------- Game view ---------- */
let view = {};

const LIVE_MS = 5000; // ESPN caches game data for ~1s, so this picks up changes within a few seconds
function playIds(s){
  if (s.drives) return [...(s.drives.previous || []), ...(s.drives.current ? [s.drives.current] : [])].flatMap(d => (d.plays || []).map(p => String(p.id)));
  return (s.plays || []).map(p => String(p.id));
}
const agoText = ms => { const sec = Math.max(0, Math.round(ms / 1000)); return sec < 60 ? `${sec}s ago` : `${Math.floor(sec / 60)}m ${sec % 60}s ago`; };
const fmtClock = d => d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit', second:'2-digit' });
// Updates the live status line every second without redrawing the page.
function tickLive(){
  const el = document.getElementById('livebar');
  if (!el || !view.fetchedAt) return;
  const age = Date.now() - view.fetchedAt;
  const stale = age > 30e3 || view.failures > 0;
  el.className = 'livebar' + (stale ? ' stale' : '');
  const espn = view.espnAt ? ` · ESPN data as of ${fmtClock(view.espnAt)}` : '';
  el.innerHTML = stale
    ? `<span class="dot"></span><b>Updates delayed</b> · last updated ${esc(fmtClock(view.fetchedAt))} (${esc(agoText(age))}) · retrying`
    : `<span class="dot"></span><b>Live</b> · Last updated ${esc(fmtClock(view.fetchedAt))} <span class="ago">(${esc(agoText(age))})</span>${esc(espn)}`;
}
setInterval(tickLive, 1000);

function isCurrentGame(game){
  const r = currentRoute();
  return view === game && r.name === 'game' && r.league === game.league && r.id === game.id;
}

async function loadGameSituation(game){
  if (game.situationPending) return;
  game.situationPending = true;
  let situation = null;
  try {
    const sb = await leagueScoreboard(game.league);
    situation = (sb.events || []).find(e => String(e.id) === game.id)?.competitions?.[0]?.situation || null;
  } catch {
    // Gamecast can render from the summary alone.
  } finally {
    game.situationPending = false;
  }
  if (!isCurrentGame(game) || gameCtx().state !== 'in') return;
  game.sit = situation;
  renderGame();
}

async function showGame(league, id){
  const active = beginPageLoad();
  if (view.league !== league || view.id !== id) {
    view = { league, id, tab:null, s:null, sit:null, open:new Set(), period:'all', shotTeam:'all',
      seen:null, fresh:new Set(), fetchedAt:null, espnAt:null, failures:0, nx:null, px:null };
  }
  const game = view;
  if (document.hidden && game.s) { schedule(() => showGame(league, id), LIVE_MS); return; }
  if (!game.s) $('#app').innerHTML = `<a class="back" href="#/">← All games</a><div class="loading">Loading game…</div>`;
  try {
    const s = await getJSON(`${API}/${SPORT[league]}/${league}/summary?event=${encodeURIComponent(id)}`);
    if (!active()) return;
    const hc = s?.header?.competitions?.[0];
    if (!Array.isArray(hc?.competitors)) throw new Error('Game data unavailable');
    const state = hc.status?.type?.state || 'pre';
    const date = new Date(hc.date || 0);
    const side = name => {
      const t = hc.competitors?.find(x => x.homeAway === name)?.team;
      return t ? { abbr:t.abbreviation, short:t.shortDisplayName || t.name } : null;
    };
    const bay = { league, date, id, bay:isFinite(date) ? bayArea(league, date, bcList(hc), side('home'), side('away')) : null };
    const ids = playIds(s);
    game.fresh = game.seen ? new Set(ids.filter(x => !game.seen.has(x))) : new Set();
    game.seen = new Set(ids);
    game.s = s;
    if (state !== 'in') game.sit = null;
    const regional = state !== 'post' && league === 'nfl' && bay.bay?.regional;
    const broadcast = regional ? `${date.toISOString()}|${bay.bay.net}` : null;
    game.bay = game.regionalBay?.broadcast === broadcast ? game.regionalBay.result : bay.bay;
    if (regional) {
      refineBay([bay]).then(() => {
        if (!isCurrentGame(game) || game.s !== s) return;
        game.regionalBay = { broadcast, result:bay.bay };
        game.bay = bay.bay;
        renderGame();
      });
    }
    game.fetchedAt = new Date(); game.failures = 0;
    game.espnAt = s.meta?.lastUpdatedAt ? new Date(s.meta.lastUpdatedAt) : null;
    if (!game.tab) game.tab = state === 'in' ? 'gamecast' : state === 'post' ? 'box' : 'preview';
    renderGame();
    setUpdated(state === 'in' ? ' · live' : '');
    if (state === 'in') {
      schedule(() => showGame(league, id), LIVE_MS);
      if (fam(league) === 'nfl' || league === 'mlb') loadGameSituation(game).catch(e => console.warn(e.message));
    } else if (state === 'pre' && date - Date.now() < H) {
      schedule(() => showGame(league, id), 60e3);
    }
    const extraFail = e => console.warn(`Extra game data didn't load: ${e.message}`);
    if (league === 'nhl') loadNhlExtra(gameCtx(), state).catch(extraFail);
    else if (state === 'pre' && (fam(league) === 'nba' || fam(league) === 'nfl')) pxLoad(gameCtx()).catch(extraFail);
  } catch (e) {
    if (!active()) return;
    if (!$('#app .score-hero')) $('#app').innerHTML = `<a class="back" href="#/">← All games</a><div class="err">Couldn't load this game (${esc(e.message)}). Retrying…</div>`;
    game.failures++;
    tickLive();
    const live = game.s?.header?.competitions?.[0]?.status?.type?.state === 'in';
    schedule(() => showGame(league, id), live ? Math.min(30e3, LIVE_MS * 2 ** Math.min(game.failures, 3)) : 20e3);
  }
}

function gameCtx(){
  const s = view.s, comp = s.header.competitions[0];
  const cs = comp.competitors || [];
  const home = cs.find(c => c.homeAway === 'home') || cs[0];
  const away = cs.find(c => c.homeAway === 'away') || cs[1];
  const st = comp.status?.type || {};
  const color = (c, fallback) => hexColor(c?.team?.color) || fallback;
  let ac = color(away, '#5b6b8c'), hc = color(home, '#c2410c');
  if (ac.toLowerCase() === hc.toLowerCase()) hc = hexColor(home?.team?.alternateColor) || '#c2410c';
  return { s, comp, home, away, st, state:st.state || 'pre', league:view.league, ac, hc,
    byId: id => (String(home?.team?.id) === String(id) ? home : String(away?.team?.id) === String(id) ? away : null) };
}

function renderGame(){
  if (!view.s || !isCurrentGame(view)) return;
  const g = gameCtx();
  const tabs = tabList(g);
  if (!tabs.some(t => t.key === view.tab)) view.tab = tabs[0].key;
  document.title = `${g.away?.team?.abbreviation} ${g.away?.score ?? ''} – ${g.home?.team?.abbreviation} ${g.home?.score ?? ''} · ${APP_NAME}`;
  const panel = tabs.find(t => t.key === view.tab).render(g);
  const html = `<a class="back" href="#/">← All games</a>
    ${hero(g)}
    <div class="tabs" role="tablist">${tabs.map(t => `<button class="tab" role="tab" data-tab="${t.key}" aria-selected="${t.key===view.tab}">${esc(t.label)}</button>`).join('')}</div>
    <div class="panel" role="tabpanel">${panel}</div>`;
  if (view.html !== html || !$('#app .score-hero')) {
    $('#app').innerHTML = html;
    view.html = html;
    wireGame();
  }
  tickLive();
}

function tabList(g){
  const box = { key:'box', label:'Box Score', render:renderBox };
  const team = { key:'team', label:'Team Stats', render:renderTeamStats };
  const plays = { key:'plays', label:'Play-by-Play', render:renderPlays };
  const summary = { key:'summary', label:'Summary', render:renderSummary };
  if (g.state === 'in') return [{ key:'gamecast', label:'Gamecast', render:renderGamecast }, box, team, plays];
  if (g.state === 'post') return [box, team, summary, plays];
  return [{ key:'preview', label:'Preview', render:renderPreview }];
}

function hero(g){
  const { comp, home, away, state } = g;
  const st = comp.status?.type || {};
  const t = (c) => {
    if (!c) return '<div></div>';
    const cls = state === 'post' ? (c.winner ? 'win' : 'lose') : '';
    const rec = recOf(c);
    const poss = state === 'in' && fam(g.league) === 'nfl' && (c.possession || String(view.sit?.possession) === String(c.team?.id)) ? '● Ball' : '';
    return `<div class="hteam ${cls}">${teamLink(g.league, c.team, img(logoOf(c.team), '', c.team?.abbreviation))}
      <div class="tn">${teamLink(g.league, c.team, esc(c.team?.shortDisplayName || c.team?.displayName))}</div><div class="tr">${esc(rec)}</div>
      ${divRank(c.team?.id) ? `<div class="tr">${esc(divRank(c.team?.id))}</div>` : ''}
      ${state !== 'pre' ? `<div class="ts num">${esc(scoreOf(c.score) ?? 0)}</div>` : ''}<div class="poss">${esc(poss)}</div></div>`;
  };
  const date = new Date(comp.date);
  const mid = state === 'pre'
    ? `<div class="st">${esc(fmtTime(date))}</div><div>${esc(fmtDay(date))}</div>`
    : state === 'in' ? `<div class="st status-live">${esc(st.shortDetail || st.detail)}</div>${g.league === 'nhl' ? nhlPPBadge(g) + nhlEmptyNetBadge(g) : ''}` : `<div class="st">${esc(st.detail || 'Final')}</div><div>${esc(fmtDay(date))}</div>`;
  const venue = view.s.gameInfo?.venue?.fullName;
  const bc = bcOf(comp);
  return `<div class="score-hero"><div class="hero-grid">${t(away)}<div class="hmid">${mid}</div>${t(home)}</div>
    ${linescore(g)}${g.league === 'nhl' ? nhlShotTable(g) : ''}
    ${state === 'in' ? `<div class="livebar" id="livebar" role="status" aria-live="off"></div>` : ''}
    <div class="hero-foot">${esc([venue, bc].filter(Boolean).join(' · '))}<br>${bayPill(view.bay)}
      ${view.bay?.why ? `<div class="baynote">${esc(view.bay.why)}${view.bay.regional ? ` <a href="https://506sports.com/nfl.php" target="_blank" rel="noopener">See this week's coverage maps</a>` : ''}</div>` : ''}</div></div>`;
}

// "5th in Pacific": from the division table ESPN includes with each game summary (listed in standings order).
function divRank(teamId){
  for (const gr of view.s?.standings?.groups || []) {
    const es = gr.standings?.entries || [], i = es.findIndex(e => String(e.id) === String(teamId));
    if (i >= 0) return `${ordinal(i + 1)} in ${String(gr.header || '').replace(/^\d{4}(-\d{2,4})?\s+/, '').replace(/\s+Standings$/i, '').replace(/\s+Division$/i, '')}`;
  }
  return '';
}
function linescore(g){
  const { home, away, league, state } = g;
  if (state === 'pre' || !home || !away) return '';
  const n = Math.max(home.linescores?.length || 0, away.linescores?.length || 0);
  if (!n) return '';
  const regs = league === 'mlb' ? 9 : league === 'nhl' ? 3 : 4;
  const cols = Array.from({ length:Math.max(n, league === 'mlb' ? regs : n) }, (_, i) => league === 'nhl' && i >= regs ? nhlPerLabel(i + 1)
    : i < regs ? String(i+1) : (league === 'mlb' ? String(i+1) : (i === regs ? 'OT' : `${i-regs+1}OT`)));
  const mlbExtra = league === 'mlb';
  const teamHits = c => {
    const t = (view.s.boxscore?.teams || []).find(x => String(x.team?.id) === String(c.team?.id));
    const bat = (t?.statistics || []).find(gp => gp.name === 'batting');
    const fld = (t?.statistics || []).find(gp => gp.name === 'fielding');
    const get = (gp, ab) => (gp?.stats || []).find(z => z.abbreviation === ab)?.displayValue;
    return { h: c.hits ?? get(bat, 'H') ?? '', e: c.errors ?? get(fld, 'E') ?? '' };
  };
  const row = c => {
    const ls = c.linescores || [];
    const x = mlbExtra ? teamHits(c) : null;
    return `<tr><td>${esc(c.team?.abbreviation)}</td>${cols.map((_, i) => `<td>${esc(ls[i]?.displayValue ?? (ls[i]?.value ?? ''))}</td>`).join('')}
      <td><b>${esc(scoreOf(c.score) ?? '')}</b></td>${mlbExtra ? `<td>${esc(x.h)}</td><td>${esc(x.e)}</td>` : ''}</tr>`;
  };
  return `<div class="tablewrap line"><table><thead><tr><th></th>${cols.map(c => `<th>${c}</th>`).join('')}<th>${mlbExtra ? 'R' : 'T'}</th>${mlbExtra ? '<th>H</th><th>E</th>' : ''}</tr></thead>
    <tbody>${row(away)}${row(home)}</tbody></table></div>`;
}

function wireGame(){
  const game = view;
  $('#app').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { game.fresh.clear(); game.tab = b.dataset.tab; renderGame(); });
  $('#app').querySelectorAll('details[data-id]').forEach(d => d.addEventListener('toggle', () => {
    const id = d.dataset.id;
    if (d.open) { game.open.add(id); game.open.delete('closed-' + id); } else { game.open.delete(id); game.open.add('closed-' + id); }
  }));
  $('#app').querySelectorAll('[data-period]').forEach(b => b.onclick = () => { game.fresh.clear(); game.period = b.dataset.period; renderGame(); });
  $('#app').querySelectorAll('[data-shot]').forEach(b => b.onclick = () => { game.fresh.clear(); game.shotTeam = b.dataset.shot; renderGame(); });
}

/* ---------- Box score ---------- */
// My team (one on this view's home screen) first, whether home or away; otherwise the away team first.
const isMine = (league, id) => TEAMS.some(t => t.league === league && String(t.id) === String(id));
function orderedPlayers(g){
  const ps = g.s.boxscore?.players || [];
  const rank = p => isMine(g.league, p.team?.id) ? 0 : String(p.team?.id) === String(g.away?.team?.id) ? 1 : 2;
  return [...ps].sort((a, b) => rank(a) - rank(b));
}
function grpTitle(gp){
  const t = gp.name || gp.type || gp.text || '';
  return t ? t.replace(/([A-Z])/g, ' $1').replace(/^./, c => c.toUpperCase()) : '';
}
function nbaDerived(gp){
  const L = gp.labels || [];
  const iP = L.indexOf('PTS'), iFG = L.indexOf('FG'), i3 = L.indexOf('3PT'), iFT = L.indexOf('FT');
  if (iP < 0 || iFG < 0 || iFT < 0) return null;
  return {
    labels:['TS%', 'eFG%'],
    calc(stats){

// NHL box score: ESPN sends ~20 columns per skater; show the usual hockey line. Keys are ESPN's stat keys.

  goalies:[['goalsAgainst','GA'], ['shotsAgainst','SA'], ['saves','SV'], ['savePct','SV%'], ['timeOnIce','TOI'], ['penaltyMinutes','PIM']],

// Forwards and defense in one Skaters table, by points, then ice time
function nhlMergeSkaters(groups){
  const fw = groups.find(x => x.name === 'forwards'), df = groups.find(x => x.name === 'defenses'), base = fw || df;

  const k = base.keys || [], ig = k.indexOf('goals'), ia = k.indexOf('assists'), it = k.indexOf('timeOnIce');

function nhlBox(gp){
  const keys = gp.keys || [], L = gp.labels || [];

  const cols = spec.map(([k, label]) => {
    if (k === '=pts') { const ig = keys.indexOf('goals'), ia = keys.indexOf('assists'); return ig < 0 || ia < 0 ? null : { label, get:st => String(Number(st[ig]) + Number(st[ia])) }; }

    if (k === 'faceoffPercent') { // a dash for players who took no faceoffs (most defensemen)

function renderBox(g){

      const der = fam(g.league) === 'nba' ? nbaDerived(gp) : null;
      const nhl = g.league === 'nhl' ? nhlBox(gp) : null;
      const labels = nhl ? nhl.labels : [...(gp.labels || []), ...(der ? der.labels : [])];
      const desc = nhl ? nhl.descs : gp.descriptions || [];
      const title = (g.league === 'nhl' && NHL_GROUP[gp.name]) || grpTitle(gp);
      const head = `<tr><th>${esc(title || 'Player')}</th>${labels.map((l, i) => `<th title="${esc(desc[i] || '')}">${esc(l)}</th>`).join('')}</tr>`;
      let ath = gp.athletes;
      const rows = [];
      const rowFor = a => {
        const pos = a.athlete?.position?.abbreviation || a.position?.abbreviation || '';
        const star = g.league === 'nhl' && g.state === 'post' ? nhlStarMap(g)[String(a.athlete?.id)] : null;
        const name = `${esc(a.athlete?.shortName || a.athlete?.displayName)}${pos ? `<span class="pos">${esc(pos)}</span>` : ''}${star ? `<span class="star" title="${esc(star.label)} star">${'★'.repeat(star.n)}</span>` : ''}`;

    }).join('');

  });
  return (g.league === 'nhl' ? nhlThreeStars(g) : '') + teams.join('') + (fam(g.league) === 'nba' ? `<div class="note">TS% (true shooting) and eFG% (effective field goal) are calculated from the box score.</div>` : '')
    + (g.league === 'nhl' ? nhlLinesBox(g) + nhlScratchNote(g) : '');
}

/* ---------- Team stats ---------- */
function orderedTeams(g){
  const ts = g.s.boxscore?.teams || [];
  const a = ts.find(t => String(t.team?.id) === String(g.away?.team?.id)) || ts[0];
  const h = ts.find(t => String(t.team?.id) === String(g.home?.team?.id)) || ts[1];
  return [a, h];
}
function cmpRow(label, av, hv, opts={}){
  const a = num(String(av).split('-')[0]), h = num(String(hv).split('-')[0]);
  let bar = '';
  if (a != null && h != null && a + h > 0 && !opts.noBar) {
    let pa = a / (a + h);
    if (opts.lowerBetter) pa = 1 - pa;
    bar = `<div class="bar"><span style="width:${(pa*100).toFixed(1)}%;background:var(--ac)"></span><span style="width:${((1-pa)*100).toFixed(1)}%;background:var(--hc)"></span></div>`;
  }
  return `<div class="v va">${esc(av)}</div><div class="lbl">${esc(label)}</div><div class="v">${esc(hv)}</div>${bar || '<div class="bar nobar"></div>'}`;
}
function cmpHead(g){
  return `<div class="cmp-head"><span style="display:flex;gap:8px;align-items:center">${img(logoOf(g.away?.team),'logo')}${esc(g.away?.team?.abbreviation)}</span><span></span><span style="display:flex;gap:8px;align-items:center">${esc(g.home?.team?.abbreviation)}${img(logoOf(g.home?.team),'logo')}</span></div>`;
}
function renderTeamStats(g){
  const [a, h] = orderedTeams(g);

  const vars = `style="--ac:${g.ac};--hc:${g.hc}"`;
  let out = '';
  if (fam(g.league) === 'nba') out += nbaAdvanced(g, a, h, vars);
  if (a.statistics[0]?.stats) {
    // Grouped (MLB): batting / pitching / fielding
    const groups = a.statistics.map((ga, i) => {
      const gh = h.statistics.find(x => x.name === ga.name) || h.statistics[i] || { stats:[] };
      const rows = (ga.stats || []).filter(st => st.displayValue !== '' && !['GP','G'].includes(st.abbreviation)).map(st => {
        const hv = (gh.stats || []).find(x => x.name === st.name)?.displayValue ?? '';
        return cmpRow(st.displayName || st.abbreviation || st.name, st.displayValue, hv, { noBar:true });
      }).join('');
      return rows ? `<div class="box"><h3>${esc(grpTitle(ga))}</h3>${cmpHead(g)}<div class="cmp" ${vars}>${rows}</div></div>` : '';
    }).join('');

function nbaAdvanced(g, a, h, vars){

}

/* ---------- Win probability ---------- */
function winProb(g){

  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
  const last = wp[n - 1].homeWinPercentage;
  const leader = last >= 0.5 ? g.home : g.away;
  const lp = last >= 0.5 ? last : 1 - last;
  return `<div class="box"><h3>Win probability <span class="sub">${esc(leader?.team?.abbreviation)} ${pct(lp, 1)}</span></h3>
    <svg viewBox="0 0 ${W} ${Hh}" width="100%" preserveAspectRatio="none" style="height:150px;display:block" role="img" aria-label="Win probability chart">
      <defs><clipPath id="top"><rect x="0" y="0" width="${W}" height="${Hh/2}"/></clipPath><clipPath id="bot"><rect x="0" y="${Hh/2}" width="${W}" height="${Hh/2}"/></clipPath></defs>
      <path d="${line}L${W},${Hh/2}L0,${Hh/2}Z" fill="${g.hc}" opacity=".22" clip-path="url(#top)"/>
      <path d="${line}L${W},${Hh/2}L0,${Hh/2}Z" fill="${g.ac}" opacity=".22" clip-path="url(#bot)"/>
      <line x1="0" x2="${W}" y1="${Hh/2}" y2="${Hh/2}" stroke="var(--border)" stroke-dasharray="4 4"/>
      <path d="${line}" fill="none" stroke="var(--text)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="legend"><span><i style="background:${g.hc}"></i>${esc(g.home?.team?.abbreviation)} (top)</span><span><i style="background:${g.ac}"></i>${esc(g.away?.team?.abbreviation)} (bottom)</span></div></div>`;
}

/* ---------- Leaders ---------- */
function leaders(g){

/* ---------- Scoring summary ---------- */

// Football: what kind of score each scoring play was (ESPN's scoringType), as a tag

function renderSummary(g){

/* ---------- Play-by-play ---------- */
// Hockey goals: 'mine' when my team scores, 'opp' when the team I'm up against does, null otherwise
function goalKind(g, p){
  if (g.league !== 'nhl' || !p.scoringPlay) return null;

  return nhlSides(g).some(t => isMine(g.league, t.id)) ? 'opp' : null;
}
function goalBanner(g, p){

}
function playRow(g, p, clk){
  const dd = p.start?.downDistanceText && !/kickoff|timeout|end of|extra point/i.test(p.type?.text || '') ? `<span class="dd">${esc(p.start.downDistanceText)}</span>` : '';

    `<button class="chip" data-period="${esc(n)}" aria-pressed="${String(view.period)===String(n)}">${esc(label(n))}</button>`).join('')}</div>`;

/* NHL periods: 1–3, then OT; in the regular season period 5 is the shootout, in the playoffs it's 2OT and so on.

const nhlPlayoffs = () => view.s?.header?.season?.type === 3;

const isShootout = p => !nhlPlayoffs() && periodNumber(p.period?.number) >= 5;
const nhlClk = (g, p) => {
  const n = periodNumber(p.period?.number);

const NHL_GOAL_STR = { 'power-play':'Power-play goal', 'short-handed':'Shorthanded goal', 'empty-net':'Empty-net goal' };
function nhlGoalTag(g, p){

// During a shootout ESPN's play scores count shootout goals, not the game score: leave them out.
function playScore(g, p){

}
const NHL_SKIP = /^(Stoppage|Period Start|Shootout Start)$/;
function renderPlays(g){

    if (d.current && !drives.some(x => x.id === d.current.id)) drives.push(d.current);
    if (!drives.length) return `<div class="empty">No plays yet.</div>`;
    if (live) drives.reverse();
    const lastId = live ? drives[0]?.id : null;
    return `<div>${drives.map(dr => {
      const id = 'd' + dr.id;
      const open = view.open.has(id) || (dr.id === lastId && !view.open.has('closed-' + id));
      let plays = [...(dr.plays || [])];
      if (live) plays.reverse();
      return `<details class="drive ${dr.isScore ? 'score' : ''}" data-id="${esc(id)}" ${open ? 'open' : ''}>
        <summary>${img(logoOf(dr.team), 'logo', dr.team?.abbreviation)}<div><div class="res">${esc(dr.displayResult || dr.result || (dr.id === d.current?.id ? 'In progress' : ''))}</div>
        <div class="ds">${esc(dr.description)}${dr.start?.text ? ' · from ' + esc(dr.start.text) : ''}</div></div><span class="small">${esc(dr.plays?.[0]?.period?.number ? 'Q' + dr.plays[0].period.number : '')}</span></summary>
