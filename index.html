    return `<div class="box">${periodChips(periods, nbaPer)}<ul class="plays">${list.map(p => playRow(g, p, `${nbaPer(p.period?.number)} ${p.clock?.displayValue || ''}`)).join('')}</ul></div>`;
  }
  if (g.league === 'nhl') {
    const all = (g.s.plays || []).filter(p => !NHL_SKIP.test(p.type?.text || ''));
    if (!all.length) return `<div class="empty">No plays yet.</div>`;
    const periods = all.map(p => p.period?.number);
    let list = view.period === 'all' ? all : all.filter(p => periodNumber(p.period?.number) === Number(view.period));
    if (live) list = [...list].reverse();
    return `<div class="box">${periodChips(periods, nhlPerName)}<ul class="plays">${list.map(p => playRow(g, p, nhlClk(g, p))).join('')}</ul></div>`;
  }
  // MLB: grouped by half-inning, each at-bat expandable to its pitches
  const all = g.s.plays || [];
  if (!all.length) return `<div class="empty">No plays yet.</div>`;
  const pitchesByAB = {};
  all.forEach(p => { if (p.summaryType === 'P' && p.atBatId) (pitchesByAB[p.atBatId] ||= []).push(p); });
  const skip = new Set(['start-batterpitcher', 'end-batterpitcher', 'start-inning', 'end-inning']);
  const events = all.filter(p => p.summaryType !== 'P' && !skip.has(p.type?.type) && p.text);
  const halves = [];
  events.forEach(p => {
    const key = `${p.period?.type}-${p.period?.number}`;
    let h = halves[halves.length - 1];
    if (!h || h.key !== key) halves.push(h = { key, label:`${p.period?.type === 'Bottom' ? 'Bottom' : 'Top'} ${ordinal(p.period?.number || 0)}`, items:[] });
    h.items.push(p);
  });
  if (live) { halves.reverse(); halves.forEach(h => h.items.reverse()); }
  const used = new Set();
  return `<div class="box">${halves.map(h => `<div class="half">${esc(h.label)}</div><ul class="plays">${h.items.map(p => {
    const pitches = p.type?.type === 'play-result' && p.atBatId && !used.has(p.atBatId) ? (used.add(p.atBatId), pitchesByAB[p.atBatId] || []) : [];
    const id = 'ab' + p.id;
    const body = pitches.length
      ? `<details class="ab" data-id="${esc(id)}" ${view.open.has(id) ? 'open' : ''}><summary>${esc(p.text)} <span class="small">· ${pitches.length} pitch${pitches.length === 1 ? '' : 'es'}</span></summary>
         <ol class="pitchlist">${pitches.map(pi => `<li>${esc(pi.type?.text)}${pi.pitchType?.text ? ` · ${esc(pi.pitchType.text)}` : ''}${pi.pitchVelocity ? ` ${esc(pi.pitchVelocity)} mph` : ''}</li>`).join('')}</ol></details>`
      : esc(p.text);
    return `<li class="${p.scoringPlay ? 'scoring' : ''}"><span class="clk">${esc(p.outs != null ? p.outs + ' out' : '')}</span>${img(teamLogoById(g, p.team?.id), '', '')}<span class="txt">${body}</span><span class="scr">${esc(p.awayScore ?? '')}–${esc(p.homeScore ?? '')}</span></li>`;
  }).join('')}</ul>`).join('')}</div>`;
}

/* ---------- Gamecast ---------- */
function renderGamecast(g){
  const parts = [];
  if (fam(g.league) === 'nfl') parts.push(nflField(g));
  if (g.league === 'mlb') parts.push(mlbDiamond(g));
  if (fam(g.league) === 'nba') parts.push(nbaLive(g), nbaShots(g));
  if (g.league === 'nhl') parts.push(nhlLive(g), nhlPenaltyBox(g), nhlInsights(g), nhlStreaks(g), nhlOnIce(g), nhlShots(g), nhlMilestones(g));
  parts.push(winProb(g), recentPlays(g), quickCompare(g), scoringSummary(g), g.league === 'nhl' ? nhlPenaltySummary(g) : '', leaders(g));
  return parts.filter(Boolean).join('');
}
function lastPlays(g, n){
  if (fam(g.league) === 'nfl') {
    const d = g.s.drives || {};
    const plays = [...(d.previous || []), ...(d.current && !(d.previous || []).some(x => x.id === d.current.id) ? [d.current] : [])].flatMap(dr => dr.plays || []);
    return plays.slice(-n).reverse();
  }
  const ps = (g.s.plays || []).filter(p => g.league === 'nhl' ? !NHL_SKIP.test(p.type?.text || '') && p.text
    : g.league !== 'mlb' || (p.summaryType !== 'P' && p.text && !/batterpitcher|inning/.test(p.type?.type || '')));
  return ps.slice(-n).reverse();
}
function recentPlays(g){
  const ps = lastPlays(g, 8);
  if (!ps.length) return '';
  const clk = p => g.league === 'mlb' ? `${p.period?.type === 'Bottom' ? 'B' : 'T'}${p.period?.number}` : fam(g.league) === 'nba' ? `${nbaPer(p.period?.number)} ${p.clock?.displayValue || ''}`
    : g.league === 'nhl' ? nhlClk(g, p) : `Q${p.period?.number} ${p.clock?.displayValue || ''}`;
  return `<div class="box"><h3>Latest plays <span class="sub">new plays appear automatically</span></h3><ul class="plays">${ps.map(p => playRow(g, p, clk(p))).join('')}</ul></div>`;
}
function quickCompare(g){
  const [a, h] = orderedTeams(g);
  if (!a || !h) return '';
  const want = { nba:['fieldGoalPct', 'threePointFieldGoalPct', 'totalRebounds', 'assists', 'totalTurnovers', 'pointsInPaint', 'fastBreakPoints'],
                 nfl:['totalYards', 'netPassingYards', 'rushingYards', 'thirdDownEff', 'turnovers', 'possessionTime', 'totalPenaltiesYards'],
                 nhl:['shotsTotal', 'powerPlayGoals', 'powerPlayOpportunities', 'faceoffPercent', 'hits', 'blockedShots', 'takeaways', 'giveaways', 'penaltyMinutes'] }[fam(g.league)];
  if (!want) return '';
  const rows = want.map(n => {
    const sa = (a.statistics || []).find(s => s.name === n), sh = (h.statistics || []).find(s => s.name === n);
    return sa ? cmpRow(sa.label, sa.displayValue, sh?.displayValue ?? '', { lowerBetter:/turnover|penalt|giveaway/i.test(n), noBar:n === 'possessionTime' }) : '';
  }).join('');
  return rows ? `<div class="box"><h3>Key stats</h3>${cmpHead(g)}<div class="cmp" style="--ac:${g.ac};--hc:${g.hc}">${rows}</div></div>` : '';
}

/* NFL field */
function nflField(g){
  const d = g.s.drives || {};
  const cur = d.current;
  const lastPlay = cur?.plays?.[cur.plays.length - 1];
  const sit = view.sit || {};
  const possText = sit.possessionText || lastPlay?.end?.possessionText || '';
  const ddText = sit.downDistanceText || lastPlay?.end?.downDistanceText || '';
  const possId = sit.possession || lastPlay?.end?.team?.id || cur?.team?.id;
  const distance = sit.distance ?? lastPlay?.end?.distance;
  const awayAbbr = g.away?.team?.abbreviation;
  // Absolute yard from the away team's goal line (left) to home goal line (right).
  let abs = null;
  const m = possText.match(/^([A-Z]+)\s+(\d+)$/);
  if (m) abs = m[1] === awayAbbr ? Number(m[2]) : 100 - Number(m[2]);
  else if (/^50$|^\s*50\s*$/.test(possText.trim())) abs = 50;
  const offAway = String(possId) === String(g.away?.team?.id);
  const dir = offAway ? 1 : -1;
  const offense = g.byId(possId);
  const W = 120, U = 6; // 120 yards incl. end zones, scale factor
  const X = y => (10 + y) * U;
  let marks = '';
  if (abs != null) {
    const fd = distance != null ? Math.max(0, Math.min(100, abs + dir * distance)) : null;
    if (fd != null && /&/.test(ddText)) marks += `<line x1="${X(fd)}" x2="${X(fd)}" y1="0" y2="160" stroke="#f5d90a" stroke-width="3"/>`;
    marks += `<line x1="${X(abs)}" x2="${X(abs)}" y1="0" y2="160" stroke="#3b82f6" stroke-width="3"/>`;
    marks += `<g transform="translate(${X(abs)},80)"><ellipse rx="11" ry="7" fill="#8b4513" stroke="#fff" stroke-width="1.5"/><path d="M${dir*16},0 l${-dir*6},-5 v10z" fill="#fff"/></g>`;
  }
  let lines = '';
  for (let y = 0; y <= 100; y += 5) lines += `<line x1="${X(y)}" x2="${X(y)}" y1="0" y2="160" stroke="var(--field-line)" stroke-width="${y % 10 === 0 ? 1.5 : .7}"/>`;
  let labels = '';
  for (let y = 10; y < 100; y += 10) labels += `<text x="${X(y)}" y="150" text-anchor="middle" font-size="12" fill="rgba(255,255,255,.75)" font-weight="700">${y <= 50 ? y : 100 - y}</text>`;
  const ezA = `<rect x="0" y="0" width="${10*U}" height="160" fill="${g.ac}" opacity=".85"/><text x="${5*U}" y="80" transform="rotate(-90 ${5*U} 80)" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="800" font-size="16">${esc(awayAbbr)}</text>`;
  const ezH = `<rect x="${110*U}" y="0" width="${10*U}" height="160" fill="${g.hc}" opacity=".85"/><text x="${115*U}" y="80" transform="rotate(90 ${115*U} 80)" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-weight="800" font-size="16">${esc(g.home?.team?.abbreviation)}</text>`;
  const lp = sit.lastPlay?.text || lastPlay?.text || '';
  return `<div class="box"><div class="situ" style="justify-content:space-between;margin-bottom:10px">
      <div><div class="bigtxt">${esc(ddText || 'Between plays')}</div><div class="small">${offense ? `${esc(offense.team?.displayName)} ball${sit.isRedZone ? ' · Red zone' : ''}` : ''}${cur?.description ? ` · Drive: ${esc(cur.description)}` : ''}</div></div>
      <div class="small">Timeouts: ${esc(awayAbbr)} ${esc(sit.awayTimeouts ?? '–')} · ${esc(g.home?.team?.abbreviation)} ${esc(sit.homeTimeouts ?? '–')}</div></div>
    <svg viewBox="0 0 ${W*U} 160" width="100%" style="display:block;border-radius:8px;background:var(--field)" role="img" aria-label="Field position: ${esc(possText)}">
      ${ezA}${ezH}${lines}${labels}${marks}</svg>
    <div class="legend"><span><i style="background:#3b82f6"></i>Line of scrimmage</span><span><i style="background:#f5d90a"></i>First down</span></div>
    ${lp ? `<div class="lastplay" style="margin-top:12px"><span class="lbl">Last play</span>${esc(lp)}</div>` : ''}</div>`;
}

/* MLB diamond + strike zone */
function mlbDiamond(g){
  const plays = g.s.plays || [];
  const sit = view.sit || {};
  const pitches = plays.filter(p => p.summaryType === 'P');
  const lastPitch = pitches[pitches.length - 1];
  const abId = sit.lastPlay?.atBatId || lastPitch?.atBatId;
  const abPitches = pitches.filter(p => p.atBatId === abId);
  const balls = sit.balls ?? lastPitch?.resultCount?.balls ?? 0;
  const strikes = sit.strikes ?? lastPitch?.resultCount?.strikes ?? 0;
  const outs = sit.outs ?? plays[plays.length - 1]?.outs ?? 0;
  const on = [sit.onFirst, sit.onSecond, sit.onThird].map(Boolean);
  const startAB = [...plays].reverse().find(p => p.type?.type === 'start-batterpitcher');
  const batter = sit.batter?.athlete?.displayName, pitcher = sit.pitcher?.athlete?.displayName;
  const matchup = batter && pitcher ? `${batter} vs. ${pitcher}` : (startAB?.text || '');
  const dots = (n, max) => `<span class="dots">${Array.from({ length:max }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
  const base = (x, y, lit) => `<rect x="${x-13}" y="${y-13}" width="26" height="26" transform="rotate(45 ${x} ${y})" fill="${lit ? 'var(--accent)' : 'none'}" stroke="var(--muted)" stroke-width="2"/>`;
  const diamond = `<svg viewBox="0 0 140 120" width="140" height="120" role="img" aria-label="Runners on base">
    ${base(70, 22, on[1])}${base(112, 64, on[0])}${base(28, 64, on[2])}<path d="M62 98h16v8l-8 8-8-8z" fill="var(--muted)"/></svg>`;
  // Strike zone: ESPN pitch coordinates, zone approx x 85–145, y 145–200
  const zx = x => (x - 20) * 1.1, zy = y => (y - 80) * 1.1;
  const color = t => /ball/.test(t) ? '#3b82f6' : /strike|foul/.test(t) ? '#e11d48' : '#16a34a';
  const pts = abPitches.filter(p => p.pitchCoordinate).map((p, i) =>
    `<g><circle cx="${zx(p.pitchCoordinate.x).toFixed(1)}" cy="${zy(p.pitchCoordinate.y).toFixed(1)}" r="9" fill="${color(p.type?.type || '')}" opacity=".9"/><text x="${zx(p.pitchCoordinate.x).toFixed(1)}" y="${zy(p.pitchCoordinate.y).toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="10" fill="#fff" font-weight="700">${i+1}</text></g>`).join('');
  const zone = `<svg viewBox="0 0 190 200" width="190" height="200" role="img" aria-label="Pitch locations for the current at-bat">
    <rect x="${zx(85)}" y="${zy(145)}" width="${66}" height="${60.5}" fill="none" stroke="var(--zone)" stroke-width="2"/>${pts}</svg>`;
  const list = abPitches.map((p, i) => `<li>${i+1}. ${esc(p.type?.text)}${p.pitchType?.text ? ` · ${esc(p.pitchType.text)}` : ''}${p.pitchVelocity ? ` ${esc(p.pitchVelocity)} mph` : ''}</li>`).join('');
  const lp = [...plays].reverse().find(p => p.type?.type === 'play-result');
  return `<div class="box"><h3>${esc(g.comp.status?.type?.detail || '')}</h3>
    <div class="situ">${diamond}
      <div><div class="count"><span>B ${dots(balls, 4)}</span><span>S ${dots(strikes, 3)}</span><span>O ${dots(outs, 3)}</span></div>
      <div style="margin-top:8px;font-weight:600">${esc(matchup)}</div>
      ${lp ? `<div class="lastplay" style="margin-top:8px"><span class="lbl">Last play</span>${esc(lp.text)}</div>` : ''}</div>
      ${abPitches.length ? `<div style="display:flex;gap:12px;align-items:flex-start">${zone}<ol class="pitchlist" style="list-style:none;padding:0">${list}</ol></div>` : ''}
    </div>
    <div class="legend"><span><i style="background:#3b82f6"></i>Ball</span><span><i style="background:#e11d48"></i>Strike / foul</span><span><i style="background:#16a34a"></i>In play</span></div></div>`;
}

/* NBA live + shot chart */
function nbaLive(g){
  const plays = g.s.plays || [];
  const last = plays[plays.length - 1];
  if (!last) return '';
  // Current run: consecutive points by one team
  let run = { team:null, pts:0, opp:0 };
  for (let i = plays.length - 1; i >= 0; i--) {
    const p = plays[i];
    if (!p.scoringPlay) continue;
    if (!run.team) run.team = p.team?.id;
    if (p.team?.id === run.team) run.pts += p.scoreValue || 0; else break;
  }
  const runTeam = g.byId(run.team);
  return `<div class="box"><div class="lastplay"><span class="lbl">Last play · ${esc(nbaPer(last.period?.number))} ${esc(last.clock?.displayValue || '')}</span>${esc(last.text)}</div>
    ${run.pts >= 6 ? `<div class="small" style="margin-top:8px"><b>${esc(runTeam?.team?.abbreviation)}</b> on a ${run.pts}–0 run</div>` : ''}</div>`;
}
function nbaShots(g){
  const all = (g.s.plays || []).filter(p => p.shootingPlay && p.coordinate && Math.abs(p.coordinate.x) < 100 && Math.abs(p.coordinate.y) < 100 && !/free throw/i.test(p.type?.text || ''));
  if (!all.length) return '';
  const periods = all.map(p => p.period?.number);
  const shots = all.filter(p => (view.period === 'all' || periodNumber(p.period?.number) === Number(view.period)) && (view.shotTeam === 'all' || String(p.team?.id) === view.shotTeam));
  const S = 8, X = x => x * S, Y = y => (y + 4) * S; // basket ≈ (25, 2), baseline ≈ y -3.25
  const by = [g.away, g.home].map(c => ({ id:String(c?.team?.id), abbr:c?.team?.abbreviation, col:c === g.home ? g.hc : g.ac }));
  const colOf = id => by.find(b => b.id === String(id))?.col || 'var(--muted)';
  const made = shots.filter(p => p.scoringPlay).length;
  const dots = shots.map(p => {
    const c = colOf(p.team?.id);
    return `<circle cx="${X(p.coordinate.x)}" cy="${Y(p.coordinate.y)}" r="5" fill="${p.scoringPlay ? c : 'none'}" stroke="${c}" stroke-width="2"><title>${esc(p.text)}</title></circle>`;
  }).join('');
  const court = `<rect x="0" y="${Y(-3.25)}" width="${50*S}" height="${47*S}" fill="none" stroke="var(--border)" stroke-width="2"/>
    <rect x="${X(17)}" y="${Y(-3.25)}" width="${16*S}" height="${19*S}" fill="none" stroke="var(--border)" stroke-width="2"/>
    <circle cx="${X(25)}" cy="${Y(15.75)}" r="${6*S}" fill="none" stroke="var(--border)" stroke-width="2"/>
    <circle cx="${X(25)}" cy="${Y(2)}" r="${0.75*S}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <path d="M${X(3)},${Y(-3.25)} V${Y(10.5)} A${23.75*S},${23.75*S} 0 0 0 ${X(47)},${Y(10.5)} V${Y(-3.25)}" fill="none" stroke="var(--border)" stroke-width="2"/>`;
  return `<div class="box"><h3>Shot chart <span class="sub">${made}/${shots.length} made · filled = make</span></h3>
    <div class="pchips"><button class="chip" data-shot="all" aria-pressed="${view.shotTeam==='all'}">Both</button>${by.map(b => `<button class="chip" data-shot="${esc(b.id)}" aria-pressed="${view.shotTeam===b.id}"><span class="sw" style="background:${b.col}"></span>${esc(b.abbr)}</button>`).join('')}</div>
    ${periodChips(periods, nbaPer)}
    <svg viewBox="0 0 ${50*S} ${48*S}" width="100%" style="max-width:520px;display:block;margin:0 auto" role="img" aria-label="Shot chart">${court}${dots}</svg></div>`;
}

/* NHL live + shot chart */
function nhlLive(g){
  const plays = (g.s.plays || []).filter(p => !NHL_SKIP.test(p.type?.text || '') && p.text);
  const last = plays[plays.length - 1];
  if (!last) return '';
  const sog = c => (orderedTeams(g).find(t => String(t?.team?.id) === String(c?.team?.id))?.statistics || []).find(s => s.name === 'shotsTotal')?.displayValue;
  const sa = sog(g.away), sh = sog(g.home);
  const logo = teamLogoById(g, last.team?.id), gk = goalKind(g, last);
  return `<div class="box"><div class="lastplay"><span class="lbl">Last play · ${esc(nhlClk(g, last))}</span>${logo ? `<span style="display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap${gk === 'opp' ? ';opacity:.6' : ''}">${img(logo, 'logo', '')}${gk === 'mine' ? goalBanner(g, last) : ''}${nhlGoalTag(g, last)}${esc(last.text)}</span>` : esc(last.text)}</div>
    ${sa != null && sh != null ? `<div class="small" style="margin-top:8px">Shots on goal: <b>${esc(g.away?.team?.abbreviation)} ${esc(sa)}</b> · <b>${esc(g.home?.team?.abbreviation)} ${esc(sh)}</b></div>` : ''}</div>`;
}
// ESPN rink coordinates are feet from center ice (x −100…100, goal lines at ±89; y −42.5…42.5).
// Every attempt is flipped onto one half so both teams shoot at the same net.
function nhlShots(g){
  const kinds = /^(Shot|Goal|Missed)$/;
  const all = (g.s.plays || []).filter(p => kinds.test(p.type?.text || '') && p.coordinate && Math.abs(p.coordinate.x) <= 100 && Math.abs(p.coordinate.y) <= 43 && !isShootout(p));
  if (!all.length) return '';
  const periods = all.map(p => p.period?.number);
  const shots = all.filter(p => (view.period === 'all' || periodNumber(p.period?.number) === Number(view.period)) && (view.shotTeam === 'all' || String(p.team?.id) === view.shotTeam));
  const S = 6, X = x => (x - 25) * S, Y = y => (42.5 - y) * S; // shows x 25…100 (blue line to end boards)
  const by = [g.away, g.home].map(c => ({ id:String(c?.team?.id), abbr:c?.team?.abbreviation, col:c === g.home ? g.hc : g.ac }));
  const colOf = id => by.find(b => b.id === String(id))?.col || 'var(--muted)';
  const goals = shots.filter(p => p.type?.text === 'Goal').length, onNet = shots.filter(p => p.type?.text !== 'Missed').length;
  const dots = shots.map(p => {
    const flip = p.coordinate.x < 0 ? -1 : 1, x = p.coordinate.x * flip, y = p.coordinate.y * flip;
    const c = colOf(p.team?.id), kind = p.type?.text;
    const mark = kind === 'Goal' ? `<circle cx="${X(x)}" cy="${Y(y)}" r="7" fill="${c}" stroke="var(--text)" stroke-width="1.5"/>`
      : kind === 'Missed' ? `<path d="M${X(x)-4},${Y(y)-4}l8,8m0,-8l-8,8" stroke="${c}" stroke-width="2" fill="none"/>`
      : `<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="none" stroke="${c}" stroke-width="2"/>`;
    return `<g><title>${esc(p.text)}</title>${mark}</g>`;
  }).join('');
  const rink = `<path d="M0,0 H${X(72)} A${28*S},${28*S} 0 0 1 ${X(100)},${Y(14.5)} V${Y(-14.5)} A${28*S},${28*S} 0 0 1 ${X(72)},${Y(-42.5)} H0" fill="none" stroke="var(--border)" stroke-width="2"/>
    <line x1="${X(25)}" x2="${X(25)}" y1="0" y2="${Y(-42.5)}" stroke="#3b82f6" stroke-width="4" opacity=".6"/>
    <line x1="${X(89)}" x2="${X(89)}" y1="${Y(38)}" y2="${Y(-38)}" stroke="#e11d48" stroke-width="2" opacity=".6"/>
    <path d="M${X(89)},${Y(4)} a${6*S},${4*S} 0 0 0 0,${8*S}" fill="#3b82f6" opacity=".15" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="${X(89)}" y="${Y(3)}" width="${3.3*S}" height="${6*S}" fill="none" stroke="var(--text)" stroke-width="2"/>
    ${[22, -22].map(y => `<circle cx="${X(69)}" cy="${Y(y)}" r="${15*S}" fill="none" stroke="#e11d48" stroke-width="1.5" opacity=".45"/><circle cx="${X(69)}" cy="${Y(y)}" r="4" fill="#e11d48" opacity=".6"/>`).join('')}`;
  return `<div class="box"><h3>Shot chart <span class="sub">${goals} goal${goals === 1 ? '' : 's'} · ${onNet} on net · ${shots.length} attempts</span></h3>
    <div class="pchips"><button class="chip" data-shot="all" aria-pressed="${view.shotTeam==='all'}">Both</button>${by.map(b => `<button class="chip" data-shot="${esc(b.id)}" aria-pressed="${view.shotTeam===b.id}"><span class="sw" style="background:${b.col}"></span>${esc(b.abbr)}</button>`).join('')}</div>
    ${periodChips(periods, nhlPerName)}
    <svg viewBox="0 0 ${75*S} ${85*S}" width="100%" style="max-width:420px;display:block;margin:0 auto" role="img" aria-label="Shot chart">${rink}${dots}</svg>
    <div class="legend"><span>● filled: goal</span><span>○ saved</span><span>× missed the net</span><span>Blocked shots aren't shown</span></div></div>`;
}

/* ---------- Preview (upcoming) ---------- */
function renderPreview(g){
  if (g.league === 'nhl') return nhlPreview(g);
  if (fam(g.league) === 'nba' || fam(g.league) === 'nfl') return pxPreview(g);
  const s = g.s, out = [];
  const date = new Date(g.comp.date);
  const odds = s.pickcenter?.[0];
  out.push(`<div class="box"><h3>Game info</h3><dl class="kv">
    <dt>Start</dt><dd>${esc(fmtDay(date))}, ${esc(fmtTime(date))}</dd>
    ${s.gameInfo?.venue?.fullName ? `<dt>Venue</dt><dd>${esc(s.gameInfo.venue.fullName)}${s.gameInfo.venue.address?.city ? ', ' + esc(s.gameInfo.venue.address.city) : ''}</dd>` : ''}
    ${bcOf(g.comp) ? `<dt>TV</dt><dd>${esc(bcOf(g.comp))}</dd>` : ''}
    ${odds?.details ? `<dt>Line</dt><dd>${esc(odds.details)}${odds.overUnder ? ` · O/U ${esc(odds.overUnder)}` : ''}</dd>` : ''}
  </dl></div>`);
  const ld = leaders(g); if (ld) out.push(ld.replace('Top performers', 'Season leaders'));
  const inj = (s.injuries || []).filter(t => (t.injuries || []).length);
  if (inj.length) out.push(`<div class="box"><h3>Injury report</h3><div class="two">${inj.map(t => `<div><div class="teamhead" style="font-size:14px">${img(logoOf(t.team), 'logo')}${esc(t.team?.displayName)}</div>
    <ul class="plays">${t.injuries.slice(0, 12).map(i => `<li style="grid-template-columns:1fr auto"><span>${esc(i.athlete?.displayName)} <span class="small">${esc(i.athlete?.position?.abbreviation || '')}</span></span><span class="small">${esc(i.status || i.type?.description || '')}</span></li>`).join('')}</ul></div>`).join('')}</div></div>`);
  const ser = s.seasonseries?.[0];
  if (ser?.summary) out.push(`<div class="box"><h3>Season series</h3><div>${esc(ser.summary)}</div></div>`);
  out.push(`<div class="note">Box score, gamecast and play-by-play appear here once the game starts. This page checks for the start every minute in the last hour before the game.</div>`);
  return out.join('');
}

/* ---------- NHL preview ---------- */
// Loaded after the game summary and filled in as it arrives:
//  - game rosters from ESPN's core API: who is scratched (teams announce this about an hour before puck drop)
//  - each team's player stats: numbers for injured and scratched players, and who to check for streaks
//  - league ranks for the season leaders (core API)
//  - recent game logs for each team's top scorers and goalies: hot and cold streaks
// ESPN doesn't name the starting goalie ahead of time, so the goalie list shows each one's last start instead.
const NHL_CORE = 'https://sports.core.api.espn.com/v2/sports/hockey/leagues/nhl';
const NHL_WEB = 'https://site.web.api.espn.com/apis/common/v3/sports/hockey/nhl';
// Both teams, my team first (otherwise away, then home)
const nhlSides = g => [g.away, g.home].filter(Boolean).map(c => ({ id:String(c.team?.id), abbr:c.team?.abbreviation, name:c.team?.displayName, team:c.team }))
  .sort((a, b) => isMine('nhl', b.id) - isMine('nhl', a.id));
async function loadNhlExtra(g, state){
  const game = view, id = game.id, season = g.s.header?.season?.year, stype = g.s.header?.season?.type || 2;
  const x = game.nx ||= { players:{}, roster:{}, ranks:{}, logs:{}, career:{}, lines:{ seen:{}, samples:[] }, rosterAt:0, linesAt:0,
    started:false, done:false, playersStarted:false, playersDone:false, careerStarted:false, careerDone:false };
  const alive = () => isCurrentGame(game);
  const redraw = () => { if (alive() && ['preview', 'box', 'gamecast', 'summary'].includes(view.tab)) renderGame(); };
  const sides = nhlSides(g);
  // Rosters: before the game, look again every 5 minutes for newly announced scratches; after that once is enough.
  if (!x.rosterAt || (state === 'pre' && Date.now() - x.rosterAt > 5*60e3)) {
    x.rosterAt = Date.now();
    await Promise.all(sides.map(async t => {
      try { x.roster[t.id] = (await getJSON(`${NHL_CORE}/events/${id}/competitions/${id}/competitors/${t.id}/roster`)).entries || []; } catch {}
    }));
    if (!alive()) return;
    redraw();
  }
  // Lines: who was on the ice at even-strength faceoffs (live: new faceoffs every 30 seconds)
  if (state !== 'pre' && !x.linesBusy && x.lines.samples.length < 90 && (!x.linesAt || (state === 'in' && Date.now() - x.linesAt > 30e3))) {
    x.linesBusy = true;
    nhlLoadLines(id).catch(() => {}).finally(() => { x.linesBusy = false; redraw(); });
  }
  if (!x.teamsStarted) {
    x.teamsStarted = true;
    x.teamStats ||= {};
    Promise.all(sides.map(async t => {
      try {
        const d = await getJSON(`${NHL_CORE}/seasons/${season}/types/${stype}/teams/${t.id}/statistics`);
        const r = {};
        for (const c of d.splits?.categories || []) for (const st of c.stats || []) if (!(st.name in r)) r[st.name] = { v:st.displayValue, rank:st.rankDisplayValue };
        x.teamStats[t.id] = r;
      } catch {}
    })).then(redraw);
  }
  if (!x.playersStarted) {
    x.playersStarted = true;
    await Promise.all(sides.map(async t => {
      try {
        const d = await getJSON(`${API}/hockey/nhl/teams/${t.id}/athletes/statistics?seasontype=${stype}${season ? `&season=${season}` : ''}`);
        x.players[t.id] = Object.fromEntries((d.results || []).map(c => [c.name, playerRows(c)]));
      } catch { x.players[t.id] = {}; }
    }));
    x.playersDone = true;
    if (!alive()) return;
    redraw();
  }
  if (!x.playersDone) return;
  // Career totals for upcoming milestones: everyone who has played this season
  if (state !== 'post' && !x.careerStarted) {
    x.careerStarted = true;
    const ids = sides.flatMap(t => Object.values(x.players[t.id] || {}).flat().filter(p => (Number(p.vals.games?.value) || 0) > 0).map(p => p.id));
    runPool([...new Set(ids)], 8, async aid => {
      const d = await getJSON(`${NHL_CORE}/athletes/${aid}/statistics/0`);
      const c = {};
      for (const cat of d.splits?.categories || []) for (const st of cat.stats || []) if (!(st.name in c)) c[st.name] = st.value;
      x.career[aid] = c;
    }).then(() => { x.careerDone = true; redraw(); });
  }
  if (x.started) return;
  x.started = true;
  const leaderIds = state === 'pre' ? [...new Set((g.s.leaders || []).flatMap(t => (t.leaders || []).map(c => c.leaders?.[0]?.athlete?.id)).filter(Boolean))] : [];
  const goalieIds = sides.flatMap(t => nhlStreakGoalies(g, t).map(a => a.id));
  const scorers = sides.flatMap(t => nhlSkaters(t.id).slice(0, 8).map(p => p.id));
  await Promise.all([
    ...leaderIds.map(async aid => {
      try {
        const d = await getJSON(`${NHL_CORE}/seasons/${season}/types/${stype}/athletes/${aid}/statistics`);
        const r = {};
        for (const c of d.splits?.categories || []) for (const st of c.stats || []) if (st.rankDisplayValue && !(st.name in r)) r[st.name] = st.rankDisplayValue;
        x.ranks[aid] = r;
      } catch {}
    }),
    ...[...new Set([...scorers, ...goalieIds])].map(async aid => {
      try { x.logs[aid] = nhlGameLog(await getJSON(`${NHL_WEB}/athletes/${aid}/gamelog`), new Date(g.comp.date)); } catch {}
    }),
  ]);
  x.done = true;
  redraw();
}
// A player's games this season, newest first, each with its stats by name. Games on or after this one are left out.
function nhlGameLog(d, before){
  const names = d.names || [];
  return (d.seasonTypes?.[0]?.categories || []).flatMap(c => c.events || []).map(e => {
    const m = d.events?.[e.eventId] || {};
    return { id:e.eventId, date:new Date(m.gameDate), result:m.gameResult, opp:m.opponent?.abbreviation, at:m.atVs,
             st:Object.fromEntries(names.map((n, i) => [n, e.stats?.[i]])) };
  }).filter(e => !isNaN(e.date) && e.date < before).sort((a, b) => b.date - a.date);
}
const nhlSkaters = tid => [...(view.nx?.players[tid]?.team || [])].sort((a, b) => (b.vals.points?.value ?? 0) - (a.vals.points?.value ?? 0));
function nhlPlayer(tid, aid){
  const P = view.nx?.players[tid] || {};
  const sk = nhlSkaters(tid), i = sk.findIndex(p => String(p.id) === String(aid));
  if (i >= 0) return { p:sk[i], goalie:false, teamRank:i + 1 };
  const gk = (P.goalkeeping || []).find(p => String(p.id) === String(aid));
  return gk ? { p:gk, goalie:true } : null;
}
const sv = (p, k) => p?.vals[k]?.displayValue ?? '';
function nhlStatLine(tid, aid){
  const f = nhlPlayer(tid, aid);
  if (!f) return view.nx?.players[tid] ? 'No games this season' : '';
  const p = f.p;
  if (f.goalie) return `${sv(p, 'games')} GP · ${sv(p, 'wins')}-${sv(p, 'losses')}-${sv(p, 'overtimeLosses') || 0} · ${sv(p, 'savePct')} SV% · ${sv(p, 'avgGoalsAgainst')} GAA`;
  const pts = Number(sv(p, 'points')) || 0;
  return `${sv(p, 'games')} GP · ${sv(p, 'goals')} G, ${sv(p, 'assists')} A, ${pts} PTS${pts ? ` · ${ordinal(f.teamRank)} on team in points` : ''}${sv(p, 'timeOnIcePerGame') ? ` · ${sv(p, 'timeOnIcePerGame')} TOI` : ''}`;
}
const rankText = r => r ? r.replace(/^Tied-/, 'T-') + ' in NHL' : '';
const nhlInjuries = tid => ((view.s.injuries || []).find(t => String(t.team?.id) === tid)?.injuries || []);
const nhlScratches = tid => (view.nx?.roster[tid] || []).filter(e => e.scratched);
function nhlOutIds(tid){ return new Set([...nhlInjuries(tid).map(i => String(i.athlete?.id)), ...nhlScratches(tid).map(e => String(e.playerId))]); }
const nhlName = (tid, aid, fallback) => nhlPlayer(tid, aid)?.p?.name || fallback || '';
const nhlPos = (tid, aid, fallback) => fallback || nhlPlayer(tid, aid)?.p?.pos || '';
const shortDate = d => d.toLocaleDateString([], { month:'short', day:'numeric' });
const twoCols = (g, fn) => `<div class="two">${nhlSides(g).map(t => `<div><div class="teamhead" style="font-size:14px">${img(logoOf(t.team), 'logo')}${esc(t.name)}</div>${fn(t)}</div>`).join('')}</div>`;

function nhlGoalies(g){
  const keyOf = t => String(g.home?.team?.id) === t.id ? 'homeTeam' : 'awayTeam';
  const x = view.nx;
  const body = t => {
    const list = [...(g.s.goalies?.[keyOf(t)]?.athletes || [])];
    if (!list.length) return `<div class="empty">No goalies listed yet.</div>`;
    const stat = (a, n) => (a.statistics || []).find(s => s.name === n)?.displayValue;
    list.sort((a, b) => (Number(stat(b, 'games')) || 0) - (Number(stat(a, 'games')) || 0));
    const roster = x?.roster[t.id] || [];
    return `<ul class="pvl">${list.map(a => {
      const r = roster.find(e => String(e.playerId) === String(a.id));
      const tag = r?.starter ? '<span class="tagx ok">Starting</span>' : r?.scratched ? '<span class="tagx out">Scratched</span>' : '';
      const starts = (x?.logs[a.id] || []).filter(e => e.st.gameStarted === '1');
      const last = starts[0];
      const rest = last ? Math.round((new Date(g.comp.date) - last.date) / 864e5) : null;
      const lastTxt = last ? `Last start ${shortDate(last.date)} ${last.at === '@' ? '@' : 'vs'} ${last.opp} (${last.result || '–'}, ${last.st.saves}/${last.st.shotsAgainst} saves)${rest != null ? ` · ${rest} day${rest === 1 ? '' : 's'} before this game` : ''}` : x?.done ? 'No starts this season' : '';
      return `<li><div class="top"><span class="nm">${esc(a.displayName)}</span>${tag}</div>
        <div class="meta">${esc(`${stat(a, 'games') || 0} GP · ${stat(a, 'wins') || 0}-${stat(a, 'losses') || 0}-${stat(a, 'overtimeLosses') || 0} · ${stat(a, 'savePct') || '–'} SV% · ${stat(a, 'avgGoalsAgainst') || '–'} GAA · ${stat(a, 'shutouts') || 0} SO`)}</div>
        ${lastTxt ? `<div class="meta">${esc(lastTxt)}</div>` : ''}</li>`;
    }).join('')}</ul>`;
  };
  const anyStarter = Object.values(x?.roster || {}).some(r => r.some(e => e.starter));
  return `<div class="box"><h3>Goalies</h3>${twoCols(g, body)}
    <div class="note">${anyStarter ? 'Starters as listed by ESPN.' : "ESPN doesn't name the starting goalie before the game, so each goalie's last start is shown instead. The starter appears in the box score once the game begins."}</div></div>`;
}
function nhlOutTonight(g){
  const x = view.nx;
  const body = t => {
    const inj = nhlInjuries(t.id).map(i => ({ id:String(i.athlete?.id), name:i.athlete?.displayName, pos:i.athlete?.position?.abbreviation,
      tag:i.status || 'Injured', why:[i.details?.type, i.details?.detail].filter(Boolean).join(', '), back:i.details?.returnDate }));
    const injIds = new Set(inj.map(i => i.id));
    const scr = nhlScratches(t.id).filter(e => !injIds.has(String(e.playerId))).map(e => ({ id:String(e.playerId), name:nhlName(t.id, e.playerId, e.displayName), pos:nhlPos(t.id, e.playerId), tag:'Scratched', why:'' }));
    // most important first: goalies, then by points
    const weight = r => { const f = nhlPlayer(t.id, r.id); return f ? (f.goalie ? 1000 + (Number(sv(f.p, 'games')) || 0) : Number(sv(f.p, 'points')) || 0) : -1; };
    const all = [...inj, ...scr].sort((a, b) => weight(b) - weight(a));
    const note = x?.rosterAt && !nhlScratches(t.id).length ? `<div class="meta" style="margin-top:6px">Scratches not announced yet.</div>` : '';
    if (!all.length) return `<div class="empty">Nobody listed.</div>${note}`;
    return `<ul class="pvl">${all.map(r => {
      const back = r.back ? new Date(r.back + 'T12:00:00') : null;
      const meta = [r.why, back && !isNaN(back) ? `expected back ${shortDate(back)}` : ''].filter(Boolean).join(' · ');
      return `<li><div class="top"><span class="nm">${esc(r.name)}</span><span class="small">${esc(r.pos || '')}</span><span class="tagx ${/day-to-day|questionable/i.test(r.tag) ? '' : 'out'}">${esc(r.tag)}</span></div>
        ${meta ? `<div class="meta">${esc(meta)}</div>` : ''}<div class="meta">${esc(nhlStatLine(t.id, r.id) || 'Loading stats…')}</div></li>`;
    }).join('')}</ul>${note}`;
  };
  return `<div class="box"><h3>Out tonight <span class="sub">injuries and scratches, with season stats</span></h3>${twoCols(g, body)}</div>`;
}
function nhlLeaders(g){
  const L = g.s.leaders || [];
  if (!L.length) return '';
  const x = view.nx;
  const body = t => {
    const tl = L.find(z => String(z.team?.id) === t.id);
    const out = nhlOutIds(t.id);
    return `<ul class="pvl">${(tl?.leaders || []).map(c => {
      const top = c.leaders?.[0]; if (!top) return '';
      const aid = String(top.athlete?.id), rk = x?.ranks[aid]?.[c.name];
      return `<li><div class="top"><span class="small">${esc(c.displayName)}</span></div>
        <div class="top"><span class="nm">${esc(top.athlete?.displayName)}</span>${out.has(aid) ? '<span class="tagx out">Out</span>' : ''}<span style="margin-left:auto" class="num"><b>${esc(top.displayValue)}</b></span><span class="lrk">${esc(rankText(rk) || (x?.done ? '' : '…'))}</span></div></li>`;
    }).join('')}</ul>`;
  };
  return `<div class="box"><h3>Season leaders <span class="sub">with league rank</span></h3>${twoCols(g, body)}</div>`;
}
function nhlStreaksFor(tid, aid, goalie, teamRank){
  const evs = view.nx?.logs[aid];
  if (!evs?.length) return [];
  const run = (list, f) => { let n = 0; for (const e of list) { if (f(e)) n++; else break; } return n; };
  const N = (e, k) => Number(e.st[k]) || 0;
  const out = [];
  if (goalie) {
    const starts = evs.filter(e => e.st.gameStarted === '1');
    const w = run(starts, e => e.result === 'W'), nw = run(starts, e => e.result !== 'W');
    if (w >= 3) out.push({ hot:true, kind:'win', n:w, text:`won ${w} straight starts` });
    if (nw >= 4) out.push({ hot:false, kind:'winless', n:nw, text:`winless in ${nw} straight starts` });
    const l5 = starts.slice(0, 5);
    if (l5.length === 5) {
      const pct5 = l5.reduce((s, e) => s + N(e, 'saves'), 0) / Math.max(1, l5.reduce((s, e) => s + N(e, 'shotsAgainst'), 0));
      if (pct5 >= .925) out.push({ hot:true, kind:'sv', text:`${pct5.toFixed(3).replace(/^0/, '')} SV% over his last 5 starts` });
      if (pct5 < .880) out.push({ hot:false, kind:'sv', text:`${pct5.toFixed(3).replace(/^0/, '')} SV% over his last 5 starts` });
    }
    return out;
  }
  const sum = (n, k) => evs.slice(0, n).reduce((s, e) => s + N(e, k), 0);
  const pts = run(evs, e => N(e, 'points') > 0), gl = run(evs, e => N(e, 'goals') > 0), as = run(evs, e => N(e, 'assists') > 0);
  if (pts >= 3) out.push({ hot:true, kind:'points', n:pts, text:`${pts}-game point streak (${sum(pts, 'goals')} G, ${sum(pts, 'assists')} A)` });
  if (gl >= 2) out.push({ hot:true, kind:'goals', n:gl, text:`goals in ${gl} straight games (${sum(gl, 'goals')} total)` });
  if (as >= 4 && as > pts - 1) out.push({ hot:true, kind:'assists', n:as, text:`assists in ${as} straight games` });
  if (teamRank <= 6) {
    const dry = run(evs, e => N(e, 'points') === 0);
    if (dry >= 4) out.push({ hot:false, kind:'noPoints', n:dry, text:`no points in ${dry} games` });
    const gdry = run(evs, e => N(e, 'goals') === 0);
    if (teamRank <= 3 && gdry >= 8 && dry < 4) out.push({ hot:false, kind:'noGoals', n:gdry, text:`no goals in ${gdry} games` });
  }
  const l5 = evs.slice(0, 5);
  // a big last 5 counts even if a point streak just started (a 1- or 2-game streak isn't listed on its own)
  const l5pts = sum(5, 'points'), l5games = l5.filter(e => N(e, 'points') > 0).length;
  if (pts < 3 && l5.length === 5 && l5pts >= 6) out.push({ hot:true, kind:'last5', text:`${l5pts} points in his last 5 games` });
  // scoring in most games without an unbroken streak
  else if (pts < 3 && l5.length === 5 && l5games >= 4) out.push({ hot:true, kind:'last5', text:`points in ${l5games} of his last 5 games (${l5pts} total)` });
  return out;
}
// Goalies to check: the preview's goalie list, or (once the game starts) each team's goalies with games this season
function nhlStreakGoalies(g, t){
  const key = String(g.home?.team?.id) === t.id ? 'homeTeam' : 'awayTeam';
  const pre = (g.s.goalies?.[key]?.athletes || []).map(a => ({ id:String(a.id), name:a.displayName }));
  return pre.length ? pre : (view.nx?.players[t.id]?.goalkeeping || []).filter(p => (Number(p.vals.games?.value) || 0) > 0).map(p => ({ id:String(p.id), name:p.name }));
}
// What tonight's game has done to a streak so far: { cls, text } or null
function nhlStreakTonight(g, tid, r, tn){
  const live = g.state === 'in', won = g.byId(tid)?.winner;
  const ext = n => ({ cls:'ok', text:`extended to ${n + 1} tonight` }), ended = n => ({ cls:'out', text:`ended at ${n} tonight` });
  const add = k => tn?.[k] || 0;
  switch (r.kind) {
    case 'points': case 'goals': case 'assists':
      return add(r.kind) ? ext(r.n) : live ? { cls:'', text:`on the line: no ${r.kind === 'points' ? 'points' : r.kind} yet tonight` } : ended(r.n);
    case 'noPoints': case 'noGoals': {
      const k = r.kind === 'noPoints' ? 'points' : 'goals';
      return add(k) ? { cls:'ok', text:`snapped tonight (${add(k)} ${add(k) === 1 ? k.replace(/s$/, '') : k})` } : live ? { cls:'', text:'still looking tonight' } : { cls:'out', text:`now ${r.n + 1} games` };
    }
    case 'last5': return add('points') ? { cls:'ok', text:`+${add('points')} tonight` } : null;
    case 'win': return live ? { cls:'', text:'on the line tonight' } : won ? ext(r.n) : ended(r.n);
    case 'winless': return live ? { cls:'', text:'on the line tonight' } : won ? { cls:'ok', text:'snapped with a win tonight' } : { cls:'out', text:`now ${r.n + 1} starts` };
    case 'sv': return tn?.shotsAgainst ? { cls:'', text:`${(tn.saves / tn.shotsAgainst).toFixed(3).replace(/^0/, '')} tonight (${tn.saves}/${tn.shotsAgainst})` } : null;
  }
  return null;
}
function nhlStreaks(g){
  const x = view.nx, pre = g.state === 'pre', tonight = nhlTonight(g);
  const body = t => {
    if (!x?.done) return `<div class="empty">Checking recent games…</div>`;
    const out = nhlOutIds(t.id);
    const rows = [];
    nhlSkaters(t.id).slice(0, 8).forEach((p, i) => { for (const s2 of nhlStreaksFor(t.id, p.id, false, i + 1)) rows.push({ name:p.name, pos:p.pos, id:String(p.id), ...s2 }); });
    for (const a of nhlStreakGoalies(g, t)) for (const s2 of nhlStreaksFor(t.id, a.id, true)) rows.push({ name:a.name, pos:'G', id:a.id, ...s2 });
    // once the game is on, only players who are playing tonight
    const shown = pre ? rows : rows.filter(r => tonight[r.id]);
    if (!shown.length) return `<div class="empty">No notable streaks${pre ? '' : ' among tonight’s players'}.</div>`;
    shown.sort((a, b) => b.hot - a.hot);
    return `<ul class="pvl">${shown.map(r => {
      const tn = pre ? null : nhlStreakTonight(g, t.id, r, tonight[r.id]);
      return `<li><div class="top"><span class="tagx ${r.hot ? 'hot' : 'cold'}">${r.hot ? 'Hot' : 'Cold'}</span><span class="nm">${esc(r.name)}</span><span class="small">${esc(r.pos || '')}</span>${pre && out.has(r.id) ? '<span class="tagx out">Out</span>' : ''}${tn ? `<span class="tagx ${tn.cls}">${esc(tn.text)}</span>` : ''}</div><div class="meta">${esc(r.text)}${pre ? '' : ' coming into tonight'}</div></li>`;
    }).join('')}</ul>`;
  };
  // the most recent game in anyone's log, so it's clear which games are counted
  const latest = Object.values(x?.logs || {}).map(l => l[0]?.date).filter(Boolean).sort((a, b) => b - a)[0];
  const thru = latest ? `, through ${shortDate(latest)}` : '';

function pxStreaks(g){

const PX_MS = {

const NHL_MS = { skater:[['games', 'games', 100], ['goals', 'goals', 50], ['assists', 'assists', 100], ['points', 'points', 100]],

function nhlTonight(g){
  const out = {};
  if (g.state === 'pre') return out;
  for (const p of g.s.boxscore?.players || []) for (const gp of p.statistics || []) {
    const k = gp.keys || [], at = n => k.indexOf(n);
    for (const a of gp.athletes || []) {
      const st = a.stats || [], toi = mins(st[at('timeOnIce')]) || 0;
      if (!st.length || (gp.name === 'goalies' && !toi)) continue; // a backup goalie who hasn't played isn't "playing"
      const goals = Number(st[at('goals')]) || 0, assists = Number(st[at('assists')]) || 0;
      out[String(a.athlete?.id)] = { games:1, goals, assists, points:goals + assists, saves:Number(st[at('saves')]) || 0, shotsAgainst:Number(st[at('shotsAgainst')]) || 0 };
    }

}
function nhlMilestoneList(g){
  const x = view.nx, out = [];
  if (!x?.playersDone) return out;
  const tonight = nhlTonight(g), pre = g.state === 'pre', post = g.state === 'post';
  for (const t of nhlSides(g)) {
    const P = x.players[t.id] || {}, outIds = nhlOutIds(t.id);
    for (const [rows, goalie] of [[P.team || [], false], [P.goalkeeping || [], true]]) for (const p of rows) {
      const car = x.career[p.id];
      if (!car) continue;
      const gp = Number(p.vals.games?.value) || 0, tn = tonight[String(p.id)];
      const playing = pre ? !outIds.has(String(p.id)) && !goalie : !!tn; // pregame: dressed skaters (the starting goalie isn't known)
      for (const [k, label, step] of NHL_MS[goalie ? 'goalie' : 'skater']) {
        const base = Number(car[k]);
        if (!isFinite(base)) continue;
        const one = label.replace(/s$/, ''), mine = isMine('nhl', t.id);
        if (k === 'games') {
          const nth = base + 1; // tonight's game number for someone playing
          if (playing && nth % step === 0) { out.push({ team:t, p, mine, now:true, games:0, text:pre ? `Would play his ${ordinal(nth)} career game tonight` : `${post ? 'Played' : 'Playing'} his ${ordinal(nth)} career game tonight` }); continue; }
          const from = playing && !pre ? nth : base, next = (Math.floor(from / step) + 1) * step, need = next - from;
          if (need > 5) continue;
          out.push({ team:t, p, mine, games:need, text:playing && !pre
            ? `${post ? 'Played' : 'Playing'} his ${ordinal(nth)} career game tonight · ${need} more to ${next}`
            : `${need} game${need === 1 ? '' : 's'} from ${next} career games` });
          continue;
        }
        const add = tn?.[k] || 0, now = base + add;
        if (add && Math.floor(now / step) > Math.floor(base / step)) {

          out.push({ team:t, p, mine, now:true, games:0, text:`Reached ${hit} career ${label} tonight` });
          continue;
        }
        const next = (Math.floor(now / step) + 1) * step, need = next - now;
        const rate = gp >= 5 ? (Number(p.vals[k]?.value) || 0) / gp : 0;
        if (!rate) continue;

        if (games > 5) continue;
        out.push({ team:t, p, mine, games, text:`${need} ${need === 1 ? one : label} from ${next} career ${label}${add ? ` (${add} tonight)` : ''} · about ${games} game${games === 1 ? '' : 's'} at this season's pace` });
      }

}
function nhlMilestones(g){
  const x = view.nx;

async function loadTeamSchedule(tview, base){

  const events = new Map();
  let year = null, ok = false;
  res.forEach((r, i) => {
    if (r.status !== 'fulfilled') return;
    ok = true;
    year ||= r.value.requestedSeason?.year || r.value.season?.year;
    (r.value.events || []).forEach(e => { const g = norm(e, t); g.postseason = i === 1; events.set(e.id, g); });
  });
  if (!ok) throw new Error('schedule unavailable');
  if (!tview.season || tview.season === tview.schedCurrent) {

async function loadTeamStats(tview, base){

    const [st, pl, sc] = await Promise.all([getJSON(`${base}/statistics${q}`), getJSON(`${base}/athletes/statistics${q}`),
      fam(tview.league) === 'nba' ? getJSON(`${base}/schedule${q}`).catch(() => null) : null]);
    let pf = 0, pa = 0, n = 0, lastGame = null;
    for (const e of sc?.events || []) {
      const c = e.competitions?.[0];
      if (!c?.status?.type?.completed) continue;
      const me = (c.competitors || []).find(x => String(x.team?.id) === String(tview.id));
      const op = (c.competitors || []).find(x => x !== me);
      const a = num(scoreOf(me?.score)), b = num(scoreOf(op?.score));
      if (a == null || b == null) continue;
      pf += a; pa += b; n++;
      const dt = new Date(e.date);
      if (!lastGame || dt > lastGame) lastGame = dt;
    }
    st.pointsPerGame = n ? { pf:pf / n, pa:pa / n } : null;
    st.lastGame = lastGame;
    const hasPlayers = (pl.results || []).some(c => (c.leaders || []).length);
    return { st, pl, hasPlayers, year:pl.requestedSeason?.year || st.requestedSeason?.year || y };
  };
  let d = await get(want);
  if (!want) tview.statCurrent ||= d.year;
  tview.note = '';
  if (!d.hasPlayers && !tview.statSeason && d.year) {
    const prev = await get(d.year - 1).catch(() => null);
    if (prev?.hasPlayers) { tview.note = `The ${seasonLabel(tview.league, d.year)} season hasn't started, so this shows ${seasonLabel(tview.league, prev.year)}.`; d = prev; }
  }
  tview.statCurrent ||= d.year;
  tview.statSeason = d.year;
  tview.stats = d.st;
  tview.players = d.pl;
  tview.nba = null;
  tview.nhlL = null;
  tview.ranksLoading = tview.league === 'nhl' || (tview.league === 'nba' && tview.stype === 2);
  const cats = (d.pl.results || []).filter(c => (c.leaders || []).length).map(c => c.name);
  if (!cats.includes(tview.cat)) { tview.cat = cats[0] || null; tview.sort = null; }
}

function nbaTeamFromStats(st){

  return { gp:g('general', 'gamesPlayed'), pts:g('offensive', 'points'), fga:g('offensive', 'fieldGoalsAttempted'), fgm:g('offensive', 'fieldGoalsMade'),
    fta:g('offensive', 'freeThrowsAttempted'), tpm:g('offensive', 'threePointFieldGoalsMade'), tpa:g('offensive', 'threePointFieldGoalsAttempted'),
    oreb:g('offensive', 'offensiveRebounds'), tov:g('offensive', 'turnovers'), ast:g('offensive', 'assists'),

const possOf = t => t.fga + 0.44 * t.fta - t.oreb + t.tov;

    const entries = (stand.children || []).flatMap(c => c.standings?.entries || []);
    const teams = {};
    await runPool(entries, 6, async e => {
      const id = String(e.team?.id);
      const stats = id === teamId ? teamStats : await getJSON(`${API}/basketball/nba/teams/${id}/statistics?seasontype=2&season=${season}`);
      const t = nbaTeamFromStats(stats);
      t.pa = e.stats?.find(x => x.name === 'pointsAgainst')?.value;
      if (t.gp && t.fga) teams[id] = { ...t, abbr:e.team?.abbreviation, m:nbaMetrics(t) };

  newsState.loading ||= (async () => {
    try {
      const data = await getJSON(NEWS_URL, { cache:'no-cache' });
      if (!Array.isArray(data?.items)) throw new Error('News data unavailable');
      Object.assign(newsState, { data, missing:false, error:null, fetchedAt:Date.now() });
    } catch (e) {
      newsState.missing = e.message === 'HTTP 404' && !newsState.data;
      newsState.error = e.message;
    }
    finally { newsState.loading = null; }
  })();
  return newsState.loading;
}
// Mix sources: newest first, but avoid three stories in a row from the same outlet when another is close behind.
function diversify(items){
  const pool = [...items].sort((a, b) => b.published.localeCompare(a.published));
  const out = [];
  while (pool.length) {
    const last2 = out.slice(-2).map(i => i.source);
    let k = 0;
    if (last2.length === 2 && last2[0] === last2[1]) {
      const alt = pool.slice(0, 6).findIndex(i => i.source !== last2[0]);
      if (alt > 0) k = alt;
    }
    out.push(pool.splice(k, 1)[0]);
  }
  return out;
}
function timeAgo(iso){
  const m = Math.round((Date.now() - Date.parse(iso)) / 60e3);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  if (m < 24*60) return `${Math.round(m / 60)}h ago`;
  return fmtDay(new Date(iso));
}
const TEAM_LABEL = Object.fromEntries(TEAMS.map(t => [t.key, t.label]));
function newsItem(i, showTeam){
  const team = TEAMS.find(t => t.key === i.team);
  return `<a class="news" href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener" style="--tc:${team?.color || 'var(--accent)'}">
    ${safeUrl(i.image) ? `<img class="nthumb" src="${esc(safeUrl(i.image))}" alt="" loading="lazy">` : `<span class="nthumb ph"><span>${esc(i.sourceName)}</span></span>`}
    <div class="nbody">
      <div class="nmeta"><span class="nsrc src-${esc(i.source)}">${esc(i.sourceName)}</span>${showTeam && team ? `<span class="nteam" style="--tc:${team.color}">${esc(team.label)}</span>` : ''}<span>${esc(timeAgo(i.published))}</span>${i.paywall ? '<span class="npay">Subscriber</span>' : ''}</div>
      <div class="ntitle">${esc(i.title)}</div>
      ${i.summary ? `<div class="nsum">${esc(i.summary)}</div>` : ''}
    </div></a>`;
}
function newsBlock({ team, limit, home }){
  const head = `<h2 class="sec">${home ? 'Latest news' : 'News'}${newsState.data ? ` <span class="count">updated ${esc(timeAgo(newsState.data.updated))}</span>` : ''}</h2>`;
  if (!newsState.data) {
    const msg = newsState.loading || (!newsState.error && !newsState.missing) ? 'Loading news…'
      : newsState.missing ? 'News will appear here after the first collection run.' : `Couldn't load news (${newsState.error}).`;
    return head + `<div class="empty">${esc(msg)}</div>`;
  }
  let items = (newsState.data.items || []).filter(i => TEAMS.some(t => t.key === i.team));
  if (team) items = items.filter(i => i.team === team);
  const srcs = [...new Map(items.map(i => [i.source, i.sourceName])).entries()];
  if (!srcs.some(([id]) => id === newsState.source)) newsState.source = 'all';
  if (newsState.source !== 'all') items = items.filter(i => i.source === newsState.source);
  // Home with no filters: lead with each team's newest story, then the mixed feed without those.
  let latest = '';
  if (home && !team && newsState.source === 'all') {
    const tops = TEAMS.map(t => ({ t, i:items.filter(x => x.team === t.key).sort((a, b) => b.published.localeCompare(a.published))[0] })).filter(x => x.i);
    if (tops.length) {
      latest = `<div class="box latest"><h3>Latest from each team</h3>${tops.map(({ t, i }) => `<a class="lrow" style="--tc:${t.color}" href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">
          <img class="llogo" src="${logoSrc(t, false)}" alt="">
          <div class="lbody"><div class="nmeta"><span class="nteam">${esc(t.label)}</span><span class="nsrc">${esc(i.sourceName)}</span><span>${esc(timeAgo(i.published))}</span>${i.paywall ? '<span class="npay">Subscriber</span>' : ''}</div>
          <div class="ltitle">${esc(i.title)}</div></div></a>`).join('')}</div>`;
      const used = new Set(tops.map(x => x.i.url));
      items = items.filter(x => !used.has(x.url));
    }
  }
  items = diversify(items);
  const shown = items.slice(0, limit);
  const chips = srcs.length > 1 ? `<div class="pchips">${[['all', 'All sources'], ...srcs].map(([id, name]) =>
    `<button class="chip" data-nsrc="${esc(id)}" aria-pressed="${newsState.source === id}">${esc(name)}</button>`).join('')}</div>` : '';
  const inView = x => TEAMS.some(t => t.key === x.team) && (!team || x.team === team);
  const failed = (newsState.data.sources || []).filter(x => !x.ok && inView(x));
  const okNames = [...new Set((newsState.data.sources || []).filter(x => x.ok && x.count && inView(x)).map(x => x.name))];
  return head + chips + latest + (shown.length ? `<div class="newslist">${shown.map(i => newsItem(i, !team)).join('')}</div>` : `<div class="empty">No recent stories${newsState.source !== 'all' ? ' from this source' : ''}.</div>`)
    + (items.length > shown.length && home ? `<button class="iconbtn more" data-nmore>Show more news</button>` : '')
    + `<div class="note">From ${esc(okNames.join(', ') || 'no sources yet')}.${failed.length ? ` Not reachable right now: ${esc([...new Set(failed.map(x => x.name))].join(', '))}.` : ''}</div>`;
}
function wireNews(){
  document.querySelectorAll('[data-nsrc]').forEach(b => b.onclick = () => {
    newsState.source = b.dataset.nsrc;
    if (currentRoute().name === 'team') renderTeam(); else renderHome();
  });
  document.querySelectorAll('[data-nmore]').forEach(b => b.onclick = () => { homeNewsLimit += 12; renderHome(); });
}

/* ---------- Router ---------- */
function currentRoute(){
  let m = location.hash.match(/^#\/g\/(nba|wnba|nfl|college-football|mlb|nhl)\/(\d+)/);
  if (m) return { name:'game', league:m[1], id:m[2] };
  m = location.hash.match(/^#\/t\/(nba|wnba|nfl|college-football|mlb|nhl)\/(\d+)(?:\/(stats|standings|news))?/);
  if (m) return { name:'team', league:m[1], id:m[2], tab:m[3] || 'schedule' };
  return { name:'home' };
}
function route(){
  clearTimeout(timer);
  const r = currentRoute();
  window.scrollTo(0, 0);
  if (r.name === 'game') showGame(r.league, r.id);
  else if (r.name === 'team') { view = {}; showTeam(r.league, r.id, r.tab); }
  else { view = {}; showHome(false); }
}
window.addEventListener('hashchange', route);
$('#refresh').onclick = () => {
  const r = currentRoute(); clearTimeout(timer);
  if (r.name === 'game') showGame(r.league, r.id);
  else if (r.name === 'team') { tview.sched = null; tview.stats = null; tview.stand = null; newsState.fetchedAt = 0; showTeam(r.league, r.id, r.tab); }
  else { newsState.fetchedAt = 0; showHome(); }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) $('#refresh').click(); });
route();
</script>
