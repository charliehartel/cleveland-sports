name: Collect news
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/news.mjs', '.github/workflows/news.yml']
permissions:
  contents: write
concurrency:
  group: news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load the previous news snapshot
        run: |
          mkdir -p out
          if git ls-remote --exit-code origin refs/heads/news-data > /dev/null; then
            git fetch --depth=1 origin refs/heads/news-data
            git show FETCH_HEAD:news.json > out/news.json
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
      - name: Collect news from the trusted sources
        run: node scripts/news.mjs out/news.json
      # The app reads news.json from the news-data branch. Each run replaces that branch with a
      # single commit, so it never builds up history.
      - name: Publish to the news-data branch
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q
          git checkout -q -b news-data
          git add news.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "News update"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news-data
